                const originalDraggedY = signY * b.height / 2;
                let newW = Math.max(minSize, signX * (originalDraggedX + dxLocal - fixedX));
                let newH = Math.max(minSize, signY * (originalDraggedY + dyLocal - fixedY));

                if (selectedShape.type === "image" && keepAspectRatio && b.width > 0 && b.height > 0) {
                    const widthScale = newW / b.width;
                    const heightScale = newH / b.height;
                    const uniformScale = Math.max(
                        minSize / b.width,
                        minSize / b.height,
                        Math.abs(widthScale - 1) >= Math.abs(heightScale - 1)
                            ? widthScale
                            : heightScale
                    );
                    newW = b.width * uniformScale;
                    newH = b.height * uniformScale;
                }

                // Move the center by half the size change, leaving the corner
                // opposite the dragged handle fixed in world space.
                const newCenter = localToWorldForBounds(
                    b,
                    fixedX + signX * newW / 2,
                    fixedY + signY * newH / 2
                );
                selectedShape.x = newCenter.x;
                selectedShape.y = newCenter.y;

                if (selectedShape.type === "circle") {
                    // allow ovals: map width/height to rx/ry
                    selectedShape.rx = Math.max(minSize / 2, newW / 2);
                    selectedShape.ry = Math.max(minSize / 2, newH / 2);
                } else {
                    selectedShape.width = newW;
                    selectedShape.height = newH;
                }

                resizeChanged = true;
                render();
            } else if (isRotating && isTransformableShape(selectedShape) && rotationCenter) {
                const dx = world.x - rotationCenter.x;
                const dy = world.y - rotationCenter.y;
                const angle = Math.atan2(dy, dx);
                selectedShape.rotation = shapeStartRotation + (angle - rotationStartAngle);
                rotateChanged = true;
                render();
            } else if (isDraggingSelection) {
                 const dx = world.x - dragStartWorld.x;
                 const dy = world.y - dragStartWorld.y;

                 if (selectedShape.type === "stroke") {
                     for (let i = 0; i < selectedShape.points.length; i++) {
                         const orig = originalShapeData[i];
                         selectedShape.points[i].x = orig.x + dx;
                         selectedShape.points[i].y = orig.y + dy;
                     }
                 } else if (selectedShape.type === "text") {
                     selectedShape.x = originalShapeData.x + dx;
                     selectedShape.y = originalShapeData.y + dy;
                 } else if (isTransformableShape(selectedShape)) {
                     selectedShape.x = originalShapeData.x + dx;
                     selectedShape.y = originalShapeData.y + dy;
                 }
                 moveChanged = true;
                 render();
             }
         } else if (isPanning) {
            const scale = camera.scale || 1;
            const dx = screenX - panStartScreen.x;
            const dy = screenY - panStartScreen.y;
            camera.x = panStartCamera.x - dx / scale;
            camera.y = panStartCamera.y - dy / scale;
            render();
            if (currentTextEditor) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
        }
    }

    function stopAllInteractions(cancelDrawing = false) {
        if (isShapeDrawingTool(currentTool) && isDrawing && draftShape) {
            const minimumSize = 3 / (camera.scale || 1);
            const isLargeEnough = draftShape.type === "arrow"
                ? draftShape.length >= minimumSize
                : draftShape.type === "circle"
                    ? draftShape.rx * 2 >= minimumSize && draftShape.ry * 2 >= minimumSize
                    : draftShape.width >= minimumSize && draftShape.height >= minimumSize;

            if (isLargeEnough && !cancelDrawing) {
                pushHistory();
                selectedShape = null;
            } else {
                const draftIndex = shapes.indexOf(draftShape);
                if (draftIndex !== -1) shapes.splice(draftIndex, 1);
            }
            render();
        }
        if (currentTool === "pen" && isDrawing && currentStroke) {
            if (currentStroke.points.length > 1 && !cancelDrawing) {
                pushHistory();
            } else {
                const strokeIndex = shapes.indexOf(currentStroke);
                if (strokeIndex !== -1) shapes.splice(strokeIndex, 1);
            }
        }
        if (currentTool === "eraser" && isDrawing && eraseChanged) {
            pushHistory();
        }
        if (currentTool === "select") {
            if (isDraggingSelection && moveChanged) {
                pushHistory();
            }
            if (isResizing && resizeChanged) {
                pushHistory();
            }
            if (isRotating && rotateChanged) {
                pushHistory();
            }
        }

        isDrawing = false;
        isPanning = false;
        isDraggingSelection = false;
        isResizing = false;
        isRotating = false;
        currentStroke = null;
        draftShape = null;
        drawingStartWorld = null;
        dragStartWorld = null;
        originalShapeData = null;
        originalBounds = null;
        rotationCenter = null;
        activeHandle = null;
        eraseChanged = false;
        moveChanged = false;
        resizeChanged = false;
        rotateChanged = false;

        updateCanvasCursor();
    }

    // Mouse handling
    canvas.addEventListener("mousedown", (e) => {
        commitCurrentTextEditor();

        // Middle mouse: always pan
        if (e.button === 1) {
            e.preventDefault();
            beginPan(e.clientX, e.clientY);
            return;
        }

        // Only handle left button for drawing/selecting
        if (e.button !== 0) return;

        const world = screenToWorld(e.clientX, e.clientY);
        handlePrimaryDownAtWorld(world, e.clientX, e.clientY);
    });

    canvas.addEventListener("mousemove", (e) => {
        const world = screenToWorld(e.clientX, e.clientY);
        handlePointerMove(world, e.clientX, e.clientY, e.shiftKey);
    });

    canvas.addEventListener("mouseup", () => stopAllInteractions());
    canvas.addEventListener("mouseleave", () => stopAllInteractions());

    // Scroll wheel zoom (desktop)
    canvas.addEventListener("wheel", (e) => {
        e.preventDefault();

        const rect = getCanvasRect();
        const scale = camera.scale || 1;
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;

        const worldX = camera.x + sx / scale;
        const worldY = camera.y + sy / scale;

        const zoomFactor = 1.1;
        const delta = e.deltaY < 0 ? 1 : -1;
        let newScale = delta > 0 ? scale * zoomFactor : scale / zoomFactor;

        newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
        camera.scale = newScale;

        camera.x = worldX - sx / newScale;
        camera.y = worldY - sy / newScale;

        render();
        if (currentTextEditor) {
            positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
        }
    }, { passive: false });

    // Touch helpers
    function distanceTouches(t1, t2) {
        const dx = t2.clientX - t1.clientX;
        const dy = t2.clientY - t1.clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // Touch handling (mobile)
    canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        commitCurrentTextEditor();

        const touches = e.touches;
        if (touches.length === 2) {
            // Start pinch zoom
            isPinching = true;
            isDrawing = false;
            isPanning = false;
            isDraggingSelection = false;

            const t1 = touches[0];
            const t2 = touches[1];
            pinchStartDistance = distanceTouches(t1, t2);
            pinchStartScale = camera.scale || 1;

            const centerX = (t1.clientX + t2.clientX) / 2;
            const centerY = (t1.clientY + t2.clientY) / 2;
            pinchCenterWorld = screenToWorld(centerX, centerY);
            return;
        }

        if (touches.length === 1) {
            const t = touches[0];
            const world = screenToWorld(t.clientX, t.clientY);

            // If hand tool, treat single finger as pan
            if (currentTool === "hand") {
                beginPan(t.clientX, t.clientY);
            } else {
                handlePrimaryDownAtWorld(world, t.clientX, t.clientY);
            }
        }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const touches = e.touches;

        if (isPinching && touches.length === 2) {
            const t1 = touches[0];
            const t2 = touches[1];
            const currentDistance = distanceTouches(t1, t2);
            if (pinchStartDistance <= 0) return;

            let newScale = pinchStartScale * (currentDistance / pinchStartDistance);
            newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
            camera.scale = newScale;

            // Keep the pinch center world point under the midpoint of the two fingers
            const centerX = (t1.clientX + t2.clientX) / 2;
            const centerY = (t1.clientY + t2.clientY) / 2;
            camera.x = pinchCenterWorld.x - (centerX - getCanvasRect().left) / newScale;
            camera.y = pinchCenterWorld.y - (centerY - getCanvasRect().top) / newScale;

            render();
            if (currentTextEditor) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
            return;
        }

        if (touches.length === 1) {
            const t = touches[0];
            const world = screenToWorld(t.clientX, t.clientY);
            handlePointerMove(world, t.clientX, t.clientY);
        }
    }, { passive: false });

    canvas.addEventListener("touchend", (e) => {
        e.preventDefault();
        const touches = e.touches;
        if (touches.length < 2) {
            isPinching = false;
        }
        if (touches.length === 0) {
            stopAllInteractions();
        }
    }, { passive: false });

    canvas.addEventListener("touchcancel", (e) => {
        e.preventDefault();
        isPinching = false;
        stopAllInteractions();
    }, { passive: false });

    // Double-click to edit text (desktop)
    canvas.addEventListener("dblclick", (e) => {
        const world = screenToWorld(e.clientX, e.clientY);
        const shape = hitTestShapes(world.x, world.y);
        if (!shape || shape.type !== "text") return;

        selectedShape = shape;
        updateControlVisibility();
        render();
        showTextEditor(shape);
    });

    // --- Image import ---
    insertImageButton.addEventListener("click", () => {
        imageFileInput.click();
    });

    function loadImageSource(src, onLoad) {
        const cached = imageCache.get(src);
        if (cached) {
            if (cached.loaded && cached.img) onLoad(cached.img);
            else if (!cached.error) cached.callbacks.push(onLoad);
            return;
        }

        const img = new Image();
        const entry = { img, loaded: false, error: false, callbacks: [onLoad] };
        imageCache.set(src, entry);
        img.onload = () => {
            entry.loaded = true;
            const callbacks = entry.callbacks.splice(0);
            callbacks.forEach(callback => callback(img));
        };
        img.onerror = () => {
            entry.img = null;
            entry.error = true;
            entry.callbacks.length = 0;
        };
        img.src = src;
    }

    function addImageSource(src) {
        loadImageSource(src, (img) => {
            const baseScale = camera.scale || 1;
            const maxDimension = Math.min(canvas.width, canvas.height) / baseScale * 0.5;
            const aspect = img.naturalWidth / img.naturalHeight;
            let width;
            let height;
            if (aspect >= 1) {
                width = maxDimension;
                height = maxDimension / aspect;
            } else {
                height = maxDimension;
                width = maxDimension * aspect;
            }

            const shape = {
                type: "image",
                x: camera.x + (canvas.width / 2) / baseScale,
                y: camera.y + (canvas.height / 2) / baseScale,
                width,
                height,
                rotation: 0,
                src,
            };
            shapes.push(shape);
            selectedShape = shape;
            pushHistory();
            switchToSelectTool();
            render();
        });
    }

    function addImageBlob(blob) {
        if (!blob || !blob.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = () => addImageSource(reader.result);
        reader.readAsDataURL(blob);
    }

    imageFileInput.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        addImageBlob(file);
        // Clear the input so the same file can be chosen again later.
        imageFileInput.value = "";
    });

    window.addEventListener("paste", (e) => {
        const target = e.target;
        if (target instanceof HTMLInputElement ||
            target instanceof HTMLTextAreaElement ||
            target?.isContentEditable) return;

        const items = Array.from(e.clipboardData?.items || []);
        const imageItem = items.find(item => item.kind === "file" && item.type.startsWith("image/"));
        const imageFile = imageItem?.getAsFile() ||
            Array.from(e.clipboardData?.files || []).find(file => file.type.startsWith("image/"));
        if (!imageFile) return;

        e.preventDefault();
        addImageBlob(imageFile);
    });

    // Initial history snapshot
    pushHistory();
    render();
</script>

<script>
    // ---- PWA: offline support and install prompt -------------------------
    (function () {
        const installButton = document.getElementById("install-app");
        const updateButton = document.getElementById("update-app");

        // Offer the browser's install prompt from our own toolbar button.
        let deferredInstallPrompt = null;

        window.addEventListener("beforeinstallprompt", e => {
            e.preventDefault();
            deferredInstallPrompt = e;
            installButton.classList.add("available");
        });

        installButton.addEventListener("click", async () => {
            if (!deferredInstallPrompt) return;
            installButton.classList.remove("available");
            const prompt = deferredInstallPrompt;
            deferredInstallPrompt = null;
            prompt.prompt();
            await prompt.userChoice;
        });

        window.addEventListener("appinstalled", () => {
            deferredInstallPrompt = null;
            installButton.classList.remove("available");
        });

        // Service worker: needs a real origin, so skip it on file:// URLs.
        if (!("serviceWorker" in navigator) || location.protocol === "file:") return;

        window.addEventListener("load", async () => {
            let registration;
            try {
                registration = await navigator.serviceWorker.register("sw.js");
            } catch (err) {
                console.warn("Service worker registration failed:", err);
                return;
            }

            const offerUpdate = worker => {
                if (!worker) return;
                updateButton.classList.add("available");
                updateButton.onclick = () => {
                    updateButton.classList.remove("available");
                    worker.postMessage({ type: "SKIP_WAITING" });
                };
            };

            // A new worker may already be waiting from a previous visit.
            if (registration.waiting && navigator.serviceWorker.controller) {
                offerUpdate(registration.waiting);
            }

            registration.addEventListener("updatefound", () => {
                const installing = registration.installing;
                if (!installing) return;
                installing.addEventListener("statechange", () => {
                    // A worker reaching "installed" while one is already in
                    // control means this is an update, not a first install.
                    if (installing.state === "installed" && navigator.serviceWorker.controller) {
                        offerUpdate(installing);
                    }
                });
            });

            let reloading = false;
            navigator.serviceWorker.addEventListener("controllerchange", () => {
                if (reloading) return;
                reloading = true;
                location.reload();
            });
        });
    })();
</script>
