<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Simple Drawing Pad</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Prevent page zoom; we handle zoom ourselves on the canvas -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="description" content="An in-browser drawing pad with pen, shapes, text and images. Works offline; drawings are saved on your device." />
    <meta name="theme-color" content="#fafafa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Drawing Pad" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
            background: #fafafa;
            font-size: 14px;
        }
        .toolbar button,
        .toolbar select,
        .toolbar input[type="text"],
        .toolbar input[type="number"],
        .toolbar input[type="color"],
        .toolbar input[type="range"] {
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .toolbar input[type="color"] {
            padding: 0;
            width: 36px;
            height: 28px;
        }
        .toolbar input[type="range"] {
            cursor: pointer;
        }
        .toolbar input[type="text"] {
            cursor: text;
            width: 150px;
        }
        .toolbar input[type="number"] {
            cursor: text;
            width: 58px;
        }
        .toolbar button.active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }
        .toolbar select:disabled {
            background: #f5f5f5;
            color: #888;
            cursor: default;
        }
        /* PWA controls: only revealed when the browser offers an install
           prompt, or when a new version is waiting to activate. */
        #install-app,
        #update-app {
            display: none;
        }
        #install-app.available,
        #update-app.available {
            display: inline-block;
        }
        #update-app.available {
            background: #28a745;
            border-color: #28a745;
            color: #fff;
        }
        #load-local.save-success {
            outline: 15px solid rgb(40 167 69 / 50%);
            outline-offset: 1px;
        }
        #load-local option.autosave-option {
            color: #006dcc;
        }
        .toolbar .group-label {
            font-weight: 600;
            margin-right: 4px;
        }
        .toolbar .divider {
            width: 1px;
            height: 24px;
            background: #ddd;
            margin: 0 6px;
        }
        .toolbar .spacer {
            flex: 1;
        }
        .toolbar .inline-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        #pen-size-container,
        #color-container,
        #fill-container,
        #layer-container,
        #text-size-container {
            display: none;
            align-items: center;
            gap: 4px;
        }
        #canvas {
            flex: 1;
            display: block;
            background: #fff;
            cursor: crosshair;
            touch-action: none; /* hint for some browsers */
        }
        #canvas.drawing-pad.rectangle-mode {
            cursor: url("./rectangle-cursor.svg") 16 16, crosshair;
        }
        #canvas.drawing-pad.pen-mode {
            cursor: url("./pen-cursor.svg") 5 27, crosshair;
        }
        #canvas.drawing-pad.text-mode {
            cursor: text;
        }
        #canvas.drawing-pad.circle-mode {
            cursor: url("./circle-cursor.svg") 16 16, crosshair;
        }
        #canvas.drawing-pad.arrow-mode {
            cursor: url("./arrow-cursor.svg") 8 8, crosshair;
        }
        #canvas.drawing-pad.eraser-mode {
            cursor: url("./eraser-cursor.svg") 7 26, crosshair;
        }
        .text-editor-overlay {
            position: absolute;
            border: 1px solid #007bff;
            border-radius: 4px;
            padding: 2px 4px;
            font-family: inherit;
            box-shadow: 0 0 0 1px rgba(0,123,255,0.2);
            outline: none;
            z-index: 10;
            line-height: 1.2;
            overflow: hidden;
            resize: none;
        }

        .toolbar>* {
            zoom: 0.6;
        }
    </style>
</head>
<body>
<div class="toolbar">
    <button data-tool="pen" class="active" title="Pen (P)">Pen</button>
    <button data-tool="text" title="Text (T)">Text</button>

    <div class="divider"></div>

    <button data-tool="rect" title="Rectangle (R)">Rect</button>
    <button data-tool="circle" title="Circle (C)">Circle</button>
    <button data-tool="arrow" title="Arrow (A)">Arrow</button>

    <div class="divider"></div>

    <button id="insert-image" title="Insert image (I) or paste one with Ctrl+V">Image</button>
    <input type="file" id="image-file-input" accept="image/*" style="display:none" />

    <div class="divider"></div>

    <button data-tool="eraser" title="Eraser (E)">Eraser</button>
    <button data-tool="select" title="Select / Move (V)">Select / Move</button>
    <button data-tool="hand" title="Hand / Pan (H)">Hand / Pan</button>

    <div class="divider"></div>

    <div id="color-container" class="inline-group">
        <label class="group-label" for="pen-color">Color:</label>
        <input type="color" id="pen-color" value="#000000" />
    </div>

    <div id="fill-container" class="inline-group">
        <label class="group-label" for="fill-enabled">
            <input type="checkbox" id="fill-enabled" /> Fill:
        </label>
        <input type="color" id="fill-color" value="#ffff00" disabled />
    </div>

    <div id="pen-size-container" class="inline-group">
        <label class="group-label" for="pen-size">Size:</label>
        <input type="range" id="pen-size" min="1" max="20" value="2" />
    </div>

    <div id="text-size-container" class="inline-group">
        <label class="group-label" for="text-size">Text size:</label>
        <input type="range" id="text-size" min="1" max="72" value="20" />
        <input type="number" id="text-size-value" min="1" step="1" value="20" aria-label="Text size value" />
    </div>

    <div id="layer-container" class="inline-group">
        <span class="group-label">Order:</span>
        <button id="send-to-back" title="Send selected item behind everything">Send to Back</button>
        <button id="bring-to-front" title="Bring selected item in front of everything">Bring to Front</button>
    </div>

    <div class="divider"></div>

    <span class="group-label">History:</span>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">Redo</button>

    <div class="divider"></div>

    <span class="group-label">Export:</span>
    <button id="export-png">PNG</button>
    <button id="export-json">JSON</button>
    <button id="import-json" title="Import a JSON drawing">Import JSON</button>
    <input type="file" id="json-file-input" accept="application/json,.json" style="display:none" />

    <div class="divider"></div>

    <span class="group-label">Local saves:</span>
    <input type="text" id="save-name" value="Drawing 1" aria-label="Save name" />
    <button id="save-local">Save</button>
    <select id="load-local" title="Previous saves"></select>

    <div class="spacer"></div>

    <button id="update-app" title="A new version is ready — reload to use it">Update</button>
    <button id="install-app" title="Install this app on your device">Install</button>
    <button id="clear">Clear</button>
</div>

<canvas id="canvas" class="drawing-pad pen-mode"></canvas>

<script>
    // Cache loaded images so we don't recreate them every frame
    const imageCache = new Map(); // src -> { img, loaded, error }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const toolbarButtons = document.querySelectorAll(".toolbar button[data-tool]");
    const clearButton = document.getElementById("clear");
    const undoButton = document.getElementById("undo");
    const redoButton = document.getElementById("redo");
    const exportPngButton = document.getElementById("export-png");
    const exportJsonButton = document.getElementById("export-json");
    const importJsonButton = document.getElementById("import-json");
    const jsonFileInput = document.getElementById("json-file-input");
    const saveLocalButton = document.getElementById("save-local");
    const saveNameInput = document.getElementById("save-name");
    const loadLocalSelect = document.getElementById("load-local");

    const insertImageButton = document.getElementById("insert-image");
    const imageFileInput = document.getElementById("image-file-input");

    const colorContainer = document.getElementById("color-container");
    const penColorInput = document.getElementById("pen-color");
    const fillContainer = document.getElementById("fill-container");
    const fillEnabledInput = document.getElementById("fill-enabled");
    const fillColorInput = document.getElementById("fill-color");
    const penSizeContainer = document.getElementById("pen-size-container");
    const penSizeInput = document.getElementById("pen-size");
    const textSizeContainer = document.getElementById("text-size-container");
    const textSizeInput = document.getElementById("text-size");
    const textSizeValueInput = document.getElementById("text-size-value");
    const layerContainer = document.getElementById("layer-container");
    const sendToBackButton = document.getElementById("send-to-back");
    const bringToFrontButton = document.getElementById("bring-to-front");

    const STORAGE_KEY = "drawingPad_saves_v1";
    const SAVE_DB_NAME = "drawingPadDatabase";
    const SAVE_STORE_NAME = "saves";

    // World / camera state (with zoom)
    let camera = { x: 0, y: 0, scale: 1 };
    const MIN_SCALE = 0.2;
    const MAX_SCALE = 5;

    // Shapes
    // stroke: { type: 'stroke', points: [{x,y},...], color, width }
    // text:   { type: 'text', x, y, text, fontSize, color }
    // rect:   { type: 'rect', x, y, width, height, rotation, strokeColor, fillColor, strokeWidth }
    // circle: { type: 'circle', x, y, rx, ry, rotation, strokeColor, fillColor, strokeWidth }
    // arrow:  { type: 'arrow', x, y, length, rotation, strokeColor, strokeWidth }
    // image:  { type: 'image', x, y, width, height, rotation, src }
    let shapes = [];
    let cleanShapesSnapshot = JSON.stringify(shapes);
    let isDirty = false;

    // History (undo/redo) – shapes only
    let history = [];
    let historyIndex = -1;

    function cloneShapes(value) {
        return JSON.parse(JSON.stringify(value));
    }

    function pushHistory() {
        const snapshot = JSON.stringify(shapes);
        if (historyIndex < history.length - 1) {
            history.splice(historyIndex + 1);
        }
        history.push(snapshot);
        historyIndex = history.length - 1;
        updateDirtyState();
        updateHistoryButtons();
    }

    function updateDirtyState() {
        isDirty = JSON.stringify(shapes) !== cleanShapesSnapshot;
    }

    function markCurrentDrawingClean() {
        cleanShapesSnapshot = JSON.stringify(shapes);
        updateDirtyState();
    }

    function restoreHistory(index) {
        shapes = JSON.parse(history[index] || "[]");
        selectedShape = null;
        historyIndex = index;
        updateDirtyState();
        updateHistoryButtons();
        updateControlVisibility();
        render();
    }

    function updateHistoryButtons() {
        undoButton.disabled = historyIndex <= 0;
        redoButton.disabled = historyIndex >= history.length - 1;
    }

    // Tools and interaction state
    let currentTool = "pen";
    let isDrawing = false;
    let isPanning = false;         // used for hand tool, middle mouse, and touch pan
    let isDraggingSelection = false;
    let isResizing = false;
    let isRotating = false;
    let activeHandle = null; // e.g. 'tl','tr','br','bl','t','r','b','l','rot'
    let panStartScreen = null;
    let panStartCamera = { x: 0, y: 0 };

    let currentStroke = null;
    let draftShape = null;
    let drawingStartWorld = null;

    let selectedShape = null;
    let dragStartWorld = null;
    let originalShapeData = null;
    let originalBounds = null; // for resize: { x, y, width, height, radius, rotation }
    let rotationCenter = null;
    let rotationStartAngle = 0;
    let shapeStartRotation = 0;

    // Pinch state
    let pinchStartDistance = 0;
    let pinchStartScale = 1;
    let pinchCenterWorld = null;
    let isPinching = false;

    let eraseChanged = false;
    let moveChanged = false;
    let resizeChanged = false;
    let rotateChanged = false;

    // Pen / text settings
    let penColor = "#000000";
    let penWidth = 2;
    let textSize = 20;
    let fillEnabled = false;
    let fillColor = "#ffff00";
    const ERASER_RADIUS = 10;   // screen px
    const HIT_TEST_RADIUS = 8;  // screen px

    // Text editing overlay state
    let currentTextEditor = null; // { input, shape, originalText }

    function destroyTextEditor() {
        if (!currentTextEditor) return;
        const { input } = currentTextEditor;
        if (input && input.parentNode) {
            input.parentNode.removeChild(input);
        }
        currentTextEditor = null;
    }

    function commitCurrentTextEditor() {
        currentTextEditor?.commit();
    }

    function positionTextEditor(shape, input) {
        const rect = getCanvasRect();
        const scale = camera.scale || 1;
        const fontSizeScreen = shape.fontSize * scale;
        const metrics = measureTextBlock(input.value, fontSizeScreen);

        const sx = (shape.x - camera.x) * scale + rect.left;
        const sy = (shape.y - camera.y) * scale + rect.top;

        input.style.left = `${sx}px`;
        input.style.top = `${sy}px`;
        input.style.fontSize = `${fontSizeScreen}px`;
        input.style.color = shape.color || "#000000";
        input.style.width = `${Math.max(60, metrics.width + 12)}px`;
        input.style.height = `${Math.max(fontSizeScreen * 1.2 + 8, metrics.height + 8)}px`;
    }

    function measureTextBlock(text, fontSize) {
        const lines = String(text ?? "").split(/\r?\n/);
        const lineHeight = fontSize * 1.2;
        ctx.save();
        ctx.font = `${fontSize}px sans-serif`;
        const width = lines.reduce((maxWidth, line) =>
            Math.max(maxWidth, ctx.measureText(line || " ").width), 0);
        ctx.restore();
        return { lines, lineHeight, width, height: lines.length * lineHeight };
    }

    function showTextEditor(shape, isNew = false) {
        commitCurrentTextEditor();

        const input = document.createElement("textarea");
        input.className = "text-editor-overlay";
        input.value = shape.text || "";

        document.body.appendChild(input);
        const editorState = { input, shape, originalText: shape.text, isNew, commit: null };
        currentTextEditor = editorState;

        positionTextEditor(shape, input);

        const commitAndClose = (push = true) => {
            if (currentTextEditor !== editorState) return;
            const newText = input.value || "";
            if (isNew && newText.trim() === "") {
                const shapeIndex = shapes.indexOf(shape);
                if (shapeIndex !== -1) shapes.splice(shapeIndex, 1);
                if (selectedShape === shape) selectedShape = null;
            } else {
                shape.text = newText;
            }
            const changed = isNew
                ? newText.trim() !== ""
                : newText !== editorState.originalText;
            if (push && changed) {
                pushHistory();
            }
            destroyTextEditor();
            updateControlVisibility();
            render();
        };
        editorState.commit = () => commitAndClose(true);

        input.addEventListener("blur", () => commitAndClose(true));
        input.addEventListener("input", () => positionTextEditor(shape, input));
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                commitAndClose(true);
            } else if (e.key === "Escape") {
                e.preventDefault();
                if (isNew) {
                    const shapeIndex = shapes.indexOf(shape);
                    if (shapeIndex !== -1) shapes.splice(shapeIndex, 1);
                    if (selectedShape === shape) selectedShape = null;
                }
                destroyTextEditor();
                updateControlVisibility();
                render();
            }
        });

        // Wait until the canvas click that created the editor has finished.
        // Otherwise that same mousedown can immediately blur and remove it.
        requestAnimationFrame(() => {
            if (currentTextEditor === editorState && input.isConnected) {
                input.focus({ preventScroll: true });
                input.select();
            }
        });
    }

    // Apply camera transform, shape position, and rotation, then invoke a callback
    // that draws in the shape's local coordinate system (0,0 at center, units in world units).
    function drawTransformedShape(shape, scale, drawLocalCallback) {
        const s = camera.scale || 1;
        const sx = (shape.x - camera.x) * s;
        const sy = (shape.y - camera.y) * s;
        const rot = shape.rotation || 0;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(rot);
        ctx.scale(s, s);
        drawLocalCallback();
        ctx.restore();
    }

    // Rendering
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const scale = camera.scale || 1;

        for (const s of shapes) {
            if (s.type === "stroke") {
                drawStroke(s, scale);
            } else if (s.type === "text") {
                drawTextShape(s, scale);
            } else if (s.type === "rect") {
                drawRectShape(s, scale);
            } else if (s.type === "circle") {
                drawCircleShape(s, scale);
            } else if (s.type === "arrow") {
                drawArrowShape(s, scale);
            } else if (s.type === "image") {
                drawImageShape(s, scale);
            }
        }

        if (selectedShape) {
            drawSelectionOutline(selectedShape, scale);
        }
    }

    // Helpers to draw shapes
    function drawStroke(stroke, scale) {
        const { points, color, width } = stroke;
        ctx.strokeStyle = color || "#000000";
        ctx.lineWidth = width * scale;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo((points[0].x - camera.x) * scale, (points[0].y - camera.y) * scale);
        for (let i = 1; i < points.length; i++) {
            const p = points[i];
            ctx.lineTo((p.x - camera.x) * scale, (p.y - camera.y) * scale);
        }
        ctx.stroke();
    }

    function drawTextShape(shape, scale) {
        const { x, y, text, fontSize, color } = shape;
        ctx.fillStyle = color || "#000000";
        ctx.font = `${fontSize * scale}px sans-serif`;
        ctx.textBaseline = "top";
        const metrics = measureTextBlock(text, fontSize * scale);

        const scaledX = (x - camera.x) * scale;
        const scaledY = (y - camera.y) * scale;

        metrics.lines.forEach((line, index) => {
            ctx.fillText(line, scaledX, scaledY + index * metrics.lineHeight);
        });
    }

    function drawRectShape(shape, scale) {
        const { x, y, width, height, rotation, strokeColor, fillColor, strokeWidth } = shape;
        const halfW = (width / 2) * scale;
        const halfH = (height / 2) * scale;

        ctx.save();
        ctx.translate((x - camera.x) * scale, (y - camera.y) * scale);
        ctx.rotate(rotation);
        ctx.strokeStyle = strokeColor || "#000000";
        ctx.fillStyle = fillColor || "transparent";
        ctx.lineWidth = strokeWidth * scale;

        ctx.beginPath();
        ctx.moveTo(-halfW, -halfH);
        ctx.lineTo(halfW, -halfH);
        ctx.lineTo(halfW, halfH);
        ctx.lineTo(-halfW, halfH);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    function drawCircleShape(shape, scale) {
        const { x, y, rx, ry, rotation, strokeColor, fillColor, strokeWidth } = shape;
        ctx.save();
        ctx.translate((x - camera.x) * scale, (y - camera.y) * scale);
        ctx.rotate(rotation);
        ctx.strokeStyle = strokeColor || "#000000";
        ctx.fillStyle = fillColor || "transparent";
        ctx.lineWidth = strokeWidth * scale;

        ctx.beginPath();
        ctx.ellipse(0, 0, rx * scale, ry * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    function drawArrowShape(shape, scale) {
        const len = shape.length ?? 0;
        if (len <= 0) return;
        const strokeWidth = shape.strokeWidth || 2;
        const headLength = Math.min(Math.max(10, strokeWidth * 4), len * 0.5);
        const half = len / 2;
        drawTransformedShape(shape, scale, () => {
            ctx.strokeStyle = shape.strokeColor || "#000000";
            ctx.lineWidth = strokeWidth;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(-half, 0);
            ctx.lineTo(half - headLength, 0);
            ctx.stroke();

            // arrowhead at end (right side)
            ctx.beginPath();
            ctx.moveTo(half, 0);
            ctx.lineTo(half - headLength, headLength / 2);
            ctx.lineTo(half - headLength, -headLength / 2);
            ctx.closePath();
            ctx.fillStyle = shape.strokeColor || "#000000";
            ctx.fill();
        });
    }

    function drawImageShape(shape, scale) {
        const { x, y, width, height, rotation, src } = shape;
        const cached = imageCache.get(src);
        if (!cached) {
            loadImageSource(src, render);
            return;
        }
        if (!cached.loaded || !cached.img) return;
        const img = cached.img;

        ctx.save();
        ctx.translate((x - camera.x) * scale, (y - camera.y) * scale);
        ctx.rotate(rotation);

        ctx.drawImage(img, -width / 2 * scale, -height / 2 * scale, width * scale, height * scale);

        ctx.restore();
    }

    function drawSelectionOutline(shape, scale) {
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#007bff";

        if (shape.type === "stroke") {
            const pts = shape.points;
            if (pts.length === 0) {
                ctx.restore();
                return;
            }
            let minX = pts[0].x, maxX = pts[0].x;
            let minY = pts[0].y, maxY = pts[0].y;
            for (const p of pts) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }
            const pad = 4;
            const sx = (minX - pad - camera.x) * scale;
            const sy = (minY - pad - camera.y) * scale;
            const w = (maxX - minX + pad * 2) * scale;
            const h = (maxY - minY + pad * 2) * scale;
            ctx.strokeRect(sx, sy, w, h);
        } else if (shape.type === "text") {
            const fontSizeScreen = shape.fontSize * scale;
            const metrics = measureTextBlock(shape.text, fontSizeScreen);
            const pad = 4;
            const sx = (shape.x - camera.x) * scale - pad;
            const sy = (shape.y - camera.y) * scale - pad;
            const w = metrics.width + pad * 2;
            const h = metrics.height + pad * 2;
            ctx.strokeRect(sx, sy, w, h);
        } else if (shape.type === "arrow") {
            const s = camera.scale || 1;
            const halfLength = (shape.length || 0) / 2 * s;
            ctx.save();
            ctx.translate((shape.x - camera.x) * s, (shape.y - camera.y) * s);
            ctx.rotate(shape.rotation || 0);
            ctx.beginPath();
            ctx.moveTo(-halfLength, 0);
            ctx.lineTo(halfLength, 0);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#007bff";
            [-halfLength, halfLength].forEach(endpointX => {
                ctx.beginPath();
                ctx.arc(endpointX, 0, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });
            ctx.restore();
        } else if (shape.type === "rect" || shape.type === "image" || shape.type === "circle") {
            const s = camera.scale || 1;
            const rot = shape.rotation || 0;
            let w, h;
            if (shape.type === "circle") {
                const rx = shape.rx ?? shape.radius ?? 0;
                const ry = shape.ry ?? shape.radius ?? 0;
                w = rx * 2;
                h = ry * 2;
            } else {
                w = shape.width || 0;
                h = shape.height || 0;
            }

            const cx = (shape.x - camera.x) * s;
            const cy = (shape.y - camera.y) * s;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rot);
            ctx.strokeRect(-w / 2 * s, -h / 2 * s, w * s, h * s);

            // Draw resize handles (4 corners)
            const hs = 8;
            const corners = [
                { id: "tl", x: -w / 2 * s, y: -h / 2 * s },
                { id: "tr", x: w / 2 * s, y: -h / 2 * s },
                { id: "br", x: w / 2 * s, y: h / 2 * s },
                { id: "bl", x: -w / 2 * s, y: h / 2 * s },
            ];
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#007bff";
            ctx.setLineDash([]);
            corners.forEach(c => {
                ctx.beginPath();
                ctx.rect(c.x - hs / 2, c.y - hs / 2, hs, hs);
                ctx.fill();
                ctx.stroke();
            });

            // Rotation handle above top-center
            const rotOffset = 20;
            const rx = 0;
            const ry = -h / 2 * s - rotOffset;
            ctx.beginPath();
            ctx.arc(rx, ry, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#007bff";
            ctx.fill();
            ctx.restore();
        }

        ctx.restore();
    }

    // Local saves
    let saves = {};
    let saveSuccessTimeout = null;
    let saveOperationQueue = Promise.resolve();
    let saveDatabasePromise = null;
    refreshSavesDropdown();
    const savesReady = initializeSaveStorage();

    // Resize canvas
    function resizeCanvas() {
        const toolbarHeight = document.querySelector(".toolbar").offsetHeight;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - toolbarHeight;
        render();
        if (currentTextEditor) {
            positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
        }
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // UI: visibility helpers
    function updatePenSizeVisibility() {
        const isSizedDrawingTool = currentTool === "pen" || currentTool === "rect" ||
            currentTool === "circle" || currentTool === "arrow";
        const widthProperty = getShapeWidthProperty(selectedShape);
        if (currentTool === "select" && widthProperty) {
            penWidth = selectedShape[widthProperty];
            penSizeInput.value = Math.min(20, Math.max(1, penWidth)).toString();
        }
        penSizeContainer.style.display =
            isSizedDrawingTool || widthProperty ? "inline-flex" : "none";
    }

    function updateTextSizeVisibility() {
        const hasSelectedText = selectedShape && selectedShape.type === "text";
        if (currentTool === "select" && hasSelectedText) {
            textSize = selectedShape.fontSize;
            textSizeInput.value = Math.min(72, Math.max(1, textSize)).toString();
            textSizeValueInput.value = textSize.toString();
        }
        textSizeContainer.style.display =
            currentTool === "text" || hasSelectedText ? "inline-flex" : "none";
    }

    function updateColorVisibility() {
        const isColorDrawingTool = currentTool === "pen" || currentTool === "text" ||
            currentTool === "rect" || currentTool === "circle" || currentTool === "arrow";
        const hasColorableSelection = !!getShapeColorProperty(selectedShape);
        colorContainer.style.display =
            isColorDrawingTool || hasColorableSelection ? "inline-flex" : "none";
    }

    function isFillableShape(shape) {
        return shape && (shape.type === "rect" || shape.type === "circle");
    }

    function updateFillVisibility() {
        const isFillDrawingTool = currentTool === "rect" || currentTool === "circle";
        if (currentTool === "select" && isFillableShape(selectedShape)) {
            fillEnabled = !!selectedShape.fillColor;
            fillEnabledInput.checked = fillEnabled;
            if (selectedShape.fillColor) {
                fillColor = selectedShape.fillColor;
                fillColorInput.value = fillColor;
            }
        }
        fillContainer.style.display = isFillDrawingTool || isFillableShape(selectedShape)
            ? "inline-flex"
            : "none";
        fillColorInput.disabled = !fillEnabledInput.checked;
    }

    function updateLayerVisibility() {
        const selectedIndex = selectedShape ? shapes.indexOf(selectedShape) : -1;
        layerContainer.style.display = selectedIndex === -1 ? "none" : "inline-flex";
        sendToBackButton.disabled = selectedIndex <= 0;
        bringToFrontButton.disabled = selectedIndex === -1 || selectedIndex >= shapes.length - 1;
    }

    function updateControlVisibility() {
        updatePenSizeVisibility();
        updateTextSizeVisibility();
        updateColorVisibility();
        updateFillVisibility();
        updateLayerVisibility();
    }

    function isTransformableShape(shape) {
        return shape && (shape.type === "rect" || shape.type === "circle" || shape.type === "arrow" || shape.type === "image");
    }

    const toolCursorClasses = {
        pen: "pen-mode",
        text: "text-mode",
        rect: "rectangle-mode",
        circle: "circle-mode",
        arrow: "arrow-mode",
        eraser: "eraser-mode",
    };

    function updateCanvasCursor() {
        Object.values(toolCursorClasses).forEach(className => canvas.classList.remove(className));
        const cursorClass = toolCursorClasses[currentTool];
        if (cursorClass) canvas.classList.add(cursorClass);

        if (isPanning) {
            canvas.style.cursor = "grabbing";
        } else if (currentTool === "hand") {
            canvas.style.cursor = "grab";
        } else if (currentTool === "select") {
            canvas.style.cursor = "default";
        } else {
            canvas.style.cursor = "";
        }
    }

    // Tool switching
    toolbarButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
            currentTool = btn.dataset.tool;
            toolbarButtons.forEach(b => b.classList.toggle("active", b === btn));

            updateCanvasCursor();
            updateControlVisibility();
        });
    });

    // Pen / text UI handlers — also update selected shape if present
    function getShapeColorProperty(shape) {
        if (!shape) return null;
        if (shape.type === "stroke" || shape.type === "text") return "color";
        if (shape.type === "rect" || shape.type === "circle" || shape.type === "arrow") {
            return "strokeColor";
        }
        return null;
    }

    function getShapeWidthProperty(shape) {
        if (!shape) return null;
        if (shape.type === "stroke") return "width";
        if (shape.type === "rect" || shape.type === "circle" || shape.type === "arrow") {
            return "strokeWidth";
        }
        return null;
    }

    penColorInput.addEventListener("input", () => {
        penColor = penColorInput.value || "#000000";

        const colorProperty = getShapeColorProperty(selectedShape);
        if (colorProperty) {
            selectedShape[colorProperty] = penColor;
            render();
        }
    });

    penColorInput.addEventListener("change", () => {
        if (getShapeColorProperty(selectedShape)) {
            pushHistory();
        }
    });

    fillEnabledInput.addEventListener("change", () => {
        fillEnabled = fillEnabledInput.checked;
        fillColorInput.disabled = !fillEnabled;
        if (isFillableShape(selectedShape)) {
            selectedShape.fillColor = fillEnabled ? fillColor : null;
            pushHistory();
            render();
        }
    });

    fillColorInput.addEventListener("input", () => {
        fillColor = fillColorInput.value || "#ffff00";
        if (fillEnabled && isFillableShape(selectedShape)) {
            selectedShape.fillColor = fillColor;
            render();
        }
    });

    fillColorInput.addEventListener("change", () => {
        if (fillEnabled && isFillableShape(selectedShape)) pushHistory();
    });

    penSizeInput.addEventListener("input", () => {
        const value = parseInt(penSizeInput.value, 10);
        penWidth = Number.isFinite(value) ? value : penWidth;

        const widthProperty = getShapeWidthProperty(selectedShape);
        if (widthProperty) {
            selectedShape[widthProperty] = penWidth;
            render();
        }
    });

    penSizeInput.addEventListener("change", () => {
        if (getShapeWidthProperty(selectedShape)) {
            pushHistory();
        }
    });

    function applyTextSize(value) {
        if (!Number.isFinite(value) || value < 1) return false;
        textSize = value;
        if (selectedShape && selectedShape.type === "text") {
            selectedShape.fontSize = textSize;
            if (currentTextEditor?.shape === selectedShape) {
                positionTextEditor(selectedShape, currentTextEditor.input);
            }
            render();
        }
        return true;
    }

    textSizeInput.addEventListener("input", () => {
        const value = Number(textSizeInput.value);
        if (applyTextSize(value)) textSizeValueInput.value = value.toString();
    });

    textSizeInput.addEventListener("change", () => {
        if (selectedShape && selectedShape.type === "text") {
            pushHistory();
        }
    });

    textSizeValueInput.addEventListener("input", () => {
        const value = Number(textSizeValueInput.value);
        if (applyTextSize(value)) {
            textSizeInput.value = Math.min(72, Math.max(1, value)).toString();
        }
    });

    textSizeValueInput.addEventListener("change", () => {
        const value = Number(textSizeValueInput.value);
        if (!applyTextSize(value)) {
            textSizeValueInput.value = textSize.toString();
            return;
        }
        if (selectedShape && selectedShape.type === "text") pushHistory();
    });

    // Initialize controls
    penColorInput.value = penColor;
    fillEnabledInput.checked = fillEnabled;
    fillColorInput.value = fillColor;
    penSizeInput.value = penWidth.toString();
    textSizeInput.value = textSize.toString();
    textSizeValueInput.value = textSize.toString();
    updateControlVisibility();

    sendToBackButton.addEventListener("click", () => {
        const selectedIndex = selectedShape ? shapes.indexOf(selectedShape) : -1;
        if (selectedIndex <= 0) return;
        shapes.splice(selectedIndex, 1);
        shapes.unshift(selectedShape);
        pushHistory();
        updateLayerVisibility();
        render();
    });

    bringToFrontButton.addEventListener("click", () => {
        const selectedIndex = selectedShape ? shapes.indexOf(selectedShape) : -1;
        if (selectedIndex === -1 || selectedIndex >= shapes.length - 1) return;
        shapes.splice(selectedIndex, 1);
        shapes.push(selectedShape);
        pushHistory();
        updateLayerVisibility();
        render();
    });

    // Clear, undo, redo
    clearButton.addEventListener("click", () => {
        shapes = [];
        selectedShape = null;
        destroyTextEditor();
        pushHistory();
        updateControlVisibility();
        render();
    });

    undoButton.addEventListener("click", () => {
        if (historyIndex > 0) {
            destroyTextEditor();
            restoreHistory(historyIndex - 1);
        }
    });

    redoButton.addEventListener("click", () => {
        if (historyIndex < history.length - 1) {
            destroyTextEditor();
            restoreHistory(historyIndex + 1);
        }
    });

    const toolHotkeys = {
        a: "arrow",
        c: "circle",
        e: "eraser",
        h: "hand",
        i: "image",
        p: "pen",
        r: "rect",
        t: "text",
        v: "select",
    };

    // Keyboard shortcuts
    window.addEventListener("keydown", (e) => {
        const targetIsEditable = e.target instanceof HTMLInputElement ||
            e.target instanceof HTMLTextAreaElement || e.target?.isContentEditable;

        if (e.key === "Escape") {
            e.preventDefault();
            stopAllInteractions(true);
            switchToSelectTool();
            render();
        } else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey &&
            e.key.toLowerCase() === "s") {
            e.preventDefault();
            exportPngButton.click();
        } else if (e.key === "Delete" && selectedShape && !targetIsEditable) {
            e.preventDefault();
            const selectedIndex = shapes.indexOf(selectedShape);
            if (selectedIndex !== -1) {
                shapes.splice(selectedIndex, 1);
                selectedShape = null;
                pushHistory();
                updateControlVisibility();
                render();
            }
        } else if (e.key === " " && !targetIsEditable && !currentTextEditor &&
            currentTool !== "text" && !(e.target instanceof HTMLSelectElement) &&
            !e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat) {
            e.preventDefault();
            zoomToFitShapes();
        } else if (!targetIsEditable && !e.ctrlKey && !e.metaKey && !e.altKey &&
            !e.repeat && toolHotkeys[e.key.toLowerCase()]) {
            e.preventDefault();
            stopAllInteractions(true);
            const tool = toolHotkeys[e.key.toLowerCase()];
            if (tool === "image") {
                insertImageButton.click();
            } else {
                const toolButton = Array.from(toolbarButtons)
                    .find(button => button.dataset.tool === tool);
                toolButton?.click();
            }
        } else if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === "z") {
            e.preventDefault();
            undoButton.click();
        } else if ((e.ctrlKey && e.key.toLowerCase() === "y") ||
            (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "z")) {
            e.preventDefault();
            redoButton.click();
        }
    });

    // Export PNG
    exportPngButton.addEventListener("click", () => {
        commitCurrentTextEditor();
        const dataUrl = canvas.toDataURL("image/png");
        const link = document.createElement("a");
        link.href = dataUrl;
        link.download = "drawing.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    // Export JSON
    exportJsonButton.addEventListener("click", () => {
        const data = JSON.stringify({ shapes, camera }, null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "drawing.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    function normalizeImportedDrawing(data) {
        if (!data || typeof data !== "object" || !Array.isArray(data.shapes)) {
            throw new Error("The file does not contain a drawing with a shapes array.");
        }

        const finite = (value, fallback = 0) => Number.isFinite(value) ? value : fallback;
        const positive = (value, fallback) => Number.isFinite(value) && value > 0 ? value : fallback;
        const normalizedShapes = data.shapes.map((shape, index) => {
            if (!shape || typeof shape !== "object" || typeof shape.type !== "string") {
                throw new Error(`Shape ${index + 1} is invalid.`);
            }

            if (shape.type === "stroke") {
                if (!Array.isArray(shape.points) || shape.points.length === 0 ||
                    shape.points.some(point => !Number.isFinite(point?.x) || !Number.isFinite(point?.y))) {
                    throw new Error(`Stroke ${index + 1} has invalid points.`);
                }
                return {
                    type: "stroke",
                    points: shape.points.map(point => ({ x: point.x, y: point.y })),
                    color: typeof shape.color === "string" ? shape.color : "#000000",
                    width: positive(shape.width, 2),
                };
            }

            if (shape.type === "text") {
                if (typeof shape.text !== "string") throw new Error(`Text shape ${index + 1} is invalid.`);
                return {
                    type: "text",
                    x: finite(shape.x),
                    y: finite(shape.y),
                    text: shape.text,
                    fontSize: positive(shape.fontSize, 20),
                    color: typeof shape.color === "string" ? shape.color : "#000000",
                };
            }

            const common = {
                type: shape.type,
                x: finite(shape.x),
                y: finite(shape.y),
                rotation: finite(shape.rotation),
            };
            if (shape.type === "rect") {
                return {
                    ...common,
                    width: positive(shape.width, 10),
                    height: positive(shape.height, 10),
                    strokeColor: typeof shape.strokeColor === "string" ? shape.strokeColor : "#000000",
                    fillColor: typeof shape.fillColor === "string" ? shape.fillColor : null,
                    strokeWidth: positive(shape.strokeWidth, 2),
                };
            }
            if (shape.type === "circle") {
                return {
                    ...common,
                    rx: positive(shape.rx ?? shape.radius, 5),
                    ry: positive(shape.ry ?? shape.radius, 5),
                    strokeColor: typeof shape.strokeColor === "string" ? shape.strokeColor : "#000000",
                    fillColor: typeof shape.fillColor === "string" ? shape.fillColor : null,
                    strokeWidth: positive(shape.strokeWidth, 2),
                };
            }
            if (shape.type === "arrow") {
                return {
                    ...common,
                    length: positive(shape.length, 10),
                    strokeColor: typeof shape.strokeColor === "string" ? shape.strokeColor : "#000000",
                    strokeWidth: positive(shape.strokeWidth, 2),
                };
            }
            if (shape.type === "image") {
                if (typeof shape.src !== "string" || !shape.src) {
                    throw new Error(`Image shape ${index + 1} has no image data.`);
                }
                return {
                    ...common,
                    width: positive(shape.width, 10),
                    height: positive(shape.height, 10),
                    src: shape.src,
                };
            }
            throw new Error(`Shape ${index + 1} uses unsupported type "${shape.type}".`);
        });

        const importedCamera = data.camera && typeof data.camera === "object" ? data.camera : {};
        return {
            shapes: normalizedShapes,
            camera: {
                x: finite(importedCamera.x),
                y: finite(importedCamera.y),
                scale: Math.max(0.2, Math.min(5, positive(importedCamera.scale, 1))),
            },
        };
    }

    importJsonButton.addEventListener("click", () => jsonFileInput.click());

    jsonFileInput.addEventListener("change", async () => {
        const file = jsonFileInput.files?.[0];
        if (!file) return;

        try {
            const imported = normalizeImportedDrawing(JSON.parse(await file.text()));
            if (!await autosaveIfDirty(true)) return;

            destroyTextEditor();
            shapes = imported.shapes;
            camera = imported.camera;
            selectedShape = null;
            history = [];
            historyIndex = -1;
            pushHistory();

            const baseName = file.name.replace(/\.json$/i, "") || "Imported drawing";
            saveNameInput.value = isAutosaveName(baseName) ? `Imported ${baseName}` : baseName;
            saveNameInput.setCustomValidity("");
            switchToSelectTool();
            render();
        } catch (error) {
            alert(`The drawing could not be imported. ${error.message || "Invalid JSON file."}`);
        } finally {
            jsonFileInput.value = "";
        }
    });

    // When loading from local saves, we might have image shapes with src values; lazily
    // loading via drawImageShape will fill the cache, so no special handling needed here.

    // Legacy localStorage reader used once to migrate existing saves to IndexedDB.
    function loadSavesFromStorage() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return {};
            const parsed = JSON.parse(raw);
            if (typeof parsed !== "object" || parsed === null) return {};
            return parsed;
        } catch {
            return {};
        }
    }

    function getSaveDatabase() {
        if (saveDatabasePromise) return saveDatabasePromise;
        saveDatabasePromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(SAVE_DB_NAME, 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains(SAVE_STORE_NAME)) {
                    db.createObjectStore(SAVE_STORE_NAME, { keyPath: "name" });
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
        return saveDatabasePromise;
    }

    async function runSaveTransaction(mode, operation) {
        const db = await getSaveDatabase();
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(SAVE_STORE_NAME, mode);
            operation(transaction.objectStore(SAVE_STORE_NAME));
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error);
            transaction.onabort = () => reject(transaction.error);
        });
    }

    async function readAllSaveRecords() {
        const db = await getSaveDatabase();
        return new Promise((resolve, reject) => {
            const request = db.transaction(SAVE_STORE_NAME, "readonly")
                .objectStore(SAVE_STORE_NAME).getAll();
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error);
        });
    }

    function writeSaveRecords(records) {
        return runSaveTransaction("readwrite", store => {
            records.forEach(record => store.put(record));
        });
    }

    function deleteSaveRecords(names) {
        if (names.length === 0) return Promise.resolve();
        return runSaveTransaction("readwrite", store => {
            names.forEach(name => store.delete(name));
        });
    }

    async function initializeSaveStorage() {
        try {
            let records = await readAllSaveRecords();
            const existingNames = new Set(records.map(record => record.name));
            const legacySaves = loadSavesFromStorage();
            const recordsToMigrate = Object.entries(legacySaves)
                .filter(([name]) => !existingNames.has(name))
                .map(([name, save]) => ({ name, ...save }));

            if (recordsToMigrate.length > 0) {
                await writeSaveRecords(recordsToMigrate);
                records = records.concat(recordsToMigrate);
            }
            if (Object.keys(legacySaves).length > 0) {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                } catch {
                    // Migration already succeeded; leaving the legacy copy is harmless.
                }
            }

            saves = {};
            records.forEach(({ name, ...save }) => {
                saves[name] = save;
            });
            const loadedNames = Object.keys(saves);
            pruneAutosaves(saves);
            await deleteSaveRecords(loadedNames.filter(name => !saves[name]));
            refreshSavesDropdown();
            return true;
        } catch (error) {
            console.error("Could not initialize drawing save storage", error);
            return false;
        }
    }

    function refreshSavesDropdown() {
        loadLocalSelect.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Previous saves…";
        placeholder.disabled = true;
        placeholder.selected = true;
        loadLocalSelect.appendChild(placeholder);

        const names = Object.keys(saves).sort((a, b) => a.localeCompare(b));
        for (const name of names) {
            const opt = document.createElement("option");
            opt.value = name;
            if (isAutosaveName(name)) opt.classList.add("autosave-option");
            opt.textContent = saves[name]?.updatedAt
                ? `${name} (${new Date(saves[name].updatedAt).toLocaleString()})`
                : name;
            loadLocalSelect.appendChild(opt);
        }
        loadLocalSelect.disabled = names.length === 0;
    }

    function isAutosaveName(name) {
        return /^autosave/i.test(name);
    }

    function pruneAutosaves(saveCollection) {
        const autosaveNames = Object.keys(saveCollection)
            .filter(isAutosaveName)
            .sort((a, b) => {
                const aTime = new Date(saveCollection[a]?.updatedAt || 0).getTime();
                const bTime = new Date(saveCollection[b]?.updatedAt || 0).getTime();
                return bTime - aTime;
            });

        autosaveNames.slice(10).forEach(name => delete saveCollection[name]);
    }

    function flashSaveSuccess() {
        loadLocalSelect.classList.add("save-success");
        if (saveSuccessTimeout) clearTimeout(saveSuccessTimeout);
        saveSuccessTimeout = setTimeout(() => {
            loadLocalSelect.classList.remove("save-success");
            saveSuccessTimeout = null;
        }, 1500);
    }

    function storeDrawing(name, options = {}) {
        const operation = () => performStoreDrawing(name, options);
        const result = saveOperationQueue.then(operation, operation);
        saveOperationQueue = result.then(() => undefined, () => undefined);
        return result;
    }

    async function performStoreDrawing(name, { showSuccess = false, showError = false } = {}) {
        if (!await savesReady) {
            if (showError) alert("Persistent drawing storage is unavailable in this browser.");
            return false;
        }

        const nextSaves = {
            ...saves,
            [name]: {
                shapes: cloneShapes(shapes),
                camera: { ...camera },
                updatedAt: new Date().toISOString(),
            },
        };
        pruneAutosaves(nextSaves);

        const removedSaveNames = Object.keys(saves)
            .filter(existingName => !nextSaves[existingName]);
        try {
            await writeSaveRecords([{ name, ...nextSaves[name] }]);
            await deleteSaveRecords(removedSaveNames);
        } catch (error) {
            console.error("Could not save drawing", error);
            if (showError) {
                alert("The drawing could not be saved. Your changes are still unsaved.");
            }
            return false;
        }

        saves = nextSaves;
        refreshSavesDropdown();
        markCurrentDrawingClean();
        if (showSuccess) flashSaveSuccess();
        return true;
    }

    async function autosaveIfDirty(showError = false) {
        if (currentTextEditor) {
            currentTextEditor.shape.text = currentTextEditor.input.value || "";
        }
        updateDirtyState();
        if (!isDirty) return true;
        const autosaveName = `Autosave (${new Date().toLocaleString()})`;
        return storeDrawing(autosaveName, { showError });
    }

    async function saveNamedDrawing() {
        commitCurrentTextEditor();
        const name = saveNameInput.value.trim();
        if (!name) {
            saveNameInput.focus();
            return;
        }
        if (isAutosaveName(name)) {
            saveNameInput.setCustomValidity('Save names cannot begin with "Autosave".');
            saveNameInput.reportValidity();
            saveNameInput.focus();
            return;
        }
        saveNameInput.setCustomValidity("");
        await storeDrawing(name, { showSuccess: true, showError: true });
    }

    saveLocalButton.addEventListener("click", saveNamedDrawing);

    saveNameInput.addEventListener("input", () => {
        saveNameInput.setCustomValidity("");
    });

    saveNameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            saveNamedDrawing();
        }
    });

    loadLocalSelect.addEventListener("change", async () => {
        const name = loadLocalSelect.value;
        if (!name || !saves[name]) return;

        if (!await autosaveIfDirty(true)) {
            loadLocalSelect.value = "";
            return;
        }

        destroyTextEditor();
        const save = saves[name];
        saveNameInput.value = name;
        saveNameInput.setCustomValidity("");
        shapes = cloneShapes(save.shapes || []);
        markCurrentDrawingClean();
        camera = save.camera ? { ...save.camera } : { x: 0, y: 0, scale: 1 };
        if (camera.scale == null) camera.scale = 1;
        selectedShape = null;

        history = [];
        historyIndex = -1;
        pushHistory();
        updateControlVisibility();
        render();
    });

    setInterval(() => autosaveIfDirty(false), 30000);
    window.addEventListener("beforeunload", () => autosaveIfDirty(false));
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") autosaveIfDirty(false);
    });

    // Coordinate helpers
    function getCanvasRect() {
        return canvas.getBoundingClientRect();
    }

    function screenToWorld(clientX, clientY) {
        const rect = getCanvasRect();
        const scale = camera.scale || 1;
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        const x = camera.x + sx / scale;
        const y = camera.y + sy / scale;
        return { x, y };
    }

    // Distance from point to segment
    function distPointToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        if (dx === 0 && dy === 0) {
            const ddx = px - x1;
            const ddy = py - y1;
            return Math.sqrt(ddx * ddx + ddy * ddy);
        }
        const t = ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy);
        const tt = Math.max(0, Math.min(1, t));
        const projX = x1 + tt * dx;
        const projY = y1 + tt * dy;
        const ddx = px - projX;
        const ddy = py - projY;
        return Math.sqrt(ddx * ddx + ddy * ddy);
    }

    // Hit-testing strokes and text
    function hitTestStroke(stroke, x, y, radiusWorld) {
        const pts = stroke.points;
        for (let i = 0; i < pts.length - 1; i++) {
            const p1 = pts[i];
            const p2 = pts[i + 1];
            if (distPointToSegment(x, y, p1.x, p1.y, p2.x, p2.y) <= radiusWorld) {
                return true;
            }
        }
        return false;
    }

    function hitTestText(shape, x, y, radiusWorld) {
        const metrics = measureTextBlock(shape.text, shape.fontSize);
        const left = shape.x;
        const top = shape.y;
        const right = shape.x + metrics.width;
        const bottom = shape.y + metrics.height;

        return x >= left - radiusWorld && x <= right + radiusWorld &&
            y >= top - radiusWorld && y <= bottom + radiusWorld;

    }

    // Hit-test axis-aligned or rotated rect-like shapes (rect/image/arrow) by
    // transforming the world point into the shape's local space and checking
    // against a padded half-width/half-height box.
    function hitTestRectLike(shape, wx, wy, radiusWorld) {
        const local = worldToLocalForShape(shape, wx, wy);
        const pad = radiusWorld || 0;
        const bounds = getShapeBounds(shape);
        const halfW = (bounds?.width || 0) / 2 + pad;
        const halfH = (bounds?.height || 0) / 2 + pad;
        return Math.abs(local.x) <= halfW && Math.abs(local.y) <= halfH;
    }

    // Hit-test circle/oval shapes by mapping the world point into the
    // shape's rotated local space and normalizing against rx/ry with
    // an extra padding radius.
    function hitTestCircleShape(shape, wx, wy, radiusWorld) {
        const local = worldToLocalForShape(shape, wx, wy);
        const rx = shape.rx ?? shape.radius ?? 0;
        const ry = shape.ry ?? shape.radius ?? 0;
        const pad = radiusWorld || 0;
        const nx = local.x / ((rx + pad) || 1e-6);
        const ny = local.y / ((ry + pad) || 1e-6);
        return (nx * nx + ny * ny) <= 1;
    }

    function hitTestShapes(x, y, radiusWorld) {
        const radius = radiusWorld != null
            ? radiusWorld
            : (HIT_TEST_RADIUS / (camera.scale || 1));

        for (let i = shapes.length - 1; i >= 0; i--) {
            const s = shapes[i];
            if (s.type === "stroke") {
                if (hitTestStroke(s, x, y, radius)) return s;
            } else if (s.type === "text") {
                if (hitTestText(s, x, y, radius)) return s;
            } else if (s.type === "rect" || s.type === "image" || s.type === "arrow") {
                if (hitTestRectLike(s, x, y, radius)) return s;
            } else if (s.type === "circle") {
                if (hitTestCircleShape(s, x, y, radius)) return s;
            }
        }
        return null;
    }

    function worldToLocalForShape(shape, wx, wy) {
        const dx = wx - shape.x;
        const dy = wy - shape.y;
        const rot = shape.rotation || 0;
        const cosR = Math.cos(-rot);
        const sinR = Math.sin(-rot);
        const lx = dx * cosR - dy * sinR;
        const ly = dx * sinR + dy * cosR;
        return { x: lx, y: ly };
    }

    function worldToLocalForBounds(bounds, wx, wy) {
        const dx = wx - bounds.x;
        const dy = wy - bounds.y;
        const rotation = bounds.rotation || 0;
        const cosR = Math.cos(-rotation);
        const sinR = Math.sin(-rotation);
        return {
            x: dx * cosR - dy * sinR,
            y: dx * sinR + dy * cosR,
        };
    }

    function localToWorldForBounds(bounds, lx, ly) {
        const rotation = bounds.rotation || 0;
        const cosR = Math.cos(rotation);
        const sinR = Math.sin(rotation);
        return {
            x: bounds.x + lx * cosR - ly * sinR,
            y: bounds.y + lx * sinR + ly * cosR,
        };
    }

    // Hit-test resize and rotation handles for transformable shapes.
    function getHandleHitTest(shape, worldX, worldY) {
        if (!isTransformableShape(shape)) return null;
        const bounds = getShapeBounds(shape);
        if (!bounds) return null;

        const scale = camera.scale || 1;
        const handleRadiusWorld = 10 / scale;

        if (shape.type === "arrow") {
            const local = worldToLocalForShape(shape, worldX, worldY);
            const halfLength = (shape.length || 0) / 2;
            if (Math.hypot(local.x + halfLength, local.y) <= handleRadiusWorld) {
                return { type: "resize", id: "start" };
            }
            if (Math.hypot(local.x - halfLength, local.y) <= handleRadiusWorld) {
                return { type: "resize", id: "end" };
            }
            return null;
        }

        const halfW = bounds.width / 2;
        const halfH = bounds.height / 2;

        // Check resize handles in world space using a fixed pixel radius
        const handleLocals = [
            { id: "tl", lx: -halfW, ly: -halfH },
            { id: "tr", lx: halfW,  ly: -halfH },
            { id: "br", lx: halfW,  ly: halfH },
            { id: "bl", lx: -halfW, ly: halfH },
        ];

        const rot = shape.rotation || 0;
        const cosR = Math.cos(rot);
        const sinR = Math.sin(rot);

        function localToWorld(lx, ly) {
            return {
                x: shape.x + (lx * cosR - ly * sinR),
                y: shape.y + (lx * sinR + ly * cosR),
            };
        }

        for (const h of handleLocals) {
            const p = localToWorld(h.lx, h.ly);
            const dx = worldX - p.x;
            const dy = worldY - p.y;
            if (dx * dx + dy * dy <= handleRadiusWorld * handleRadiusWorld) {
                return { type: "resize", id: h.id };
            }
        }

        // Rotation handle: use precise world position consistent with drawing
        const rotHandle = getRotationHandleWorld(shape);
        if (rotHandle) {
            const dx = worldX - rotHandle.x;
            const dy = worldY - rotHandle.y;
            const r = rotHandle.radiusWorld * 1.5; // slightly more generous
            if (dx * dx + dy * dy <= r * r) {
                return { type: "rotate", id: "rot" };
            }
        }

        return null;
    }

    function getShapeBounds(shape) {
        if (shape.type === "circle") {
            const rx = shape.rx ?? shape.radius ?? 0;
            const ry = shape.ry ?? shape.radius ?? 0;
            return { x: shape.x, y: shape.y, width: rx * 2, height: ry * 2 };
        } else if (shape.type === "rect" || shape.type === "image" || shape.type === "arrow") {
            if (shape.type === "arrow") {
                const len = shape.length || 0;
                const thickness = (shape.strokeWidth || 2) * 4; // visual thickness of selection box
                return { x: shape.x, y: shape.y, width: len, height: thickness };
            }
            return { x: shape.x, y: shape.y, width: shape.width || 0, height: shape.height || 0 };
        }
        return null;
    }

    // Axis-aligned world extent of a shape, including rotation and stroke width.
    function getShapeWorldExtent(shape) {
        if (shape.type === "stroke") {
            const points = shape.points || [];
            if (!points.length) return null;
            const pad = (shape.width || 0) / 2;
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const p of points) {
                minX = Math.min(minX, p.x);
                minY = Math.min(minY, p.y);
                maxX = Math.max(maxX, p.x);
                maxY = Math.max(maxY, p.y);
            }
            return { minX: minX - pad, minY: minY - pad, maxX: maxX + pad, maxY: maxY + pad };
        }

        if (shape.type === "text") {
            // Text is anchored at its top-left corner and is never rotated.
            const metrics = measureTextBlock(shape.text, shape.fontSize || 0);
            return {
                minX: shape.x,
                minY: shape.y,
                maxX: shape.x + metrics.width,
                maxY: shape.y + metrics.height,
            };
        }

        const bounds = getShapeBounds(shape);
        if (!bounds) return null;

        const rotation = shape.rotation || 0;
        const cosR = Math.abs(Math.cos(rotation));
        const sinR = Math.abs(Math.sin(rotation));
        const halfBoxW = bounds.width / 2;
        const halfBoxH = bounds.height / 2;

        let halfW;
        let halfH;
        if (shape.type === "circle") {
            halfW = Math.hypot(halfBoxW * cosR, halfBoxH * sinR);
            halfH = Math.hypot(halfBoxW * sinR, halfBoxH * cosR);
        } else {
            halfW = halfBoxW * cosR + halfBoxH * sinR;
            halfH = halfBoxW * sinR + halfBoxH * cosR;
        }

        const pad = (shape.strokeWidth || 0) / 2;
        return {
            minX: bounds.x - halfW - pad,
            minY: bounds.y - halfH - pad,
            maxX: bounds.x + halfW + pad,
            maxY: bounds.y + halfH + pad,
        };
    }

    function getShapesWorldExtent() {
        let extent = null;
        for (const shape of shapes) {
            const shapeExtent = getShapeWorldExtent(shape);
            if (!shapeExtent) continue;
            if (![shapeExtent.minX, shapeExtent.minY, shapeExtent.maxX, shapeExtent.maxY]
                .every(Number.isFinite)) continue;
            if (!extent) {
                extent = shapeExtent;
                continue;
            }
            extent.minX = Math.min(extent.minX, shapeExtent.minX);
            extent.minY = Math.min(extent.minY, shapeExtent.minY);
            extent.maxX = Math.max(extent.maxX, shapeExtent.maxX);
            extent.maxY = Math.max(extent.maxY, shapeExtent.maxY);
        }
        return extent;
    }

    // Zoom and pan so every placed shape is visible with a small margin.
    function zoomToFitShapes() {
        const extent = getShapesWorldExtent();
        if (!extent) return; // nothing placed – leave the camera alone

        const viewWidth = canvas.width;
        const viewHeight = canvas.height;
        if (viewWidth <= 0 || viewHeight <= 0) return;

        const margin = Math.min(40, viewWidth / 4, viewHeight / 4); // screen px
        const contentWidth = Math.max(extent.maxX - extent.minX, 1e-6);
        const contentHeight = Math.max(extent.maxY - extent.minY, 1e-6);

        const fitScale = Math.min(
            (viewWidth - margin * 2) / contentWidth,
            (viewHeight - margin * 2) / contentHeight,
        );
        const scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, fitScale));

        camera.scale = scale;
        camera.x = (extent.minX + extent.maxX) / 2 - viewWidth / (2 * scale);
        camera.y = (extent.minY + extent.maxY) / 2 - viewHeight / (2 * scale);
        render();
    }

    // Return world-space coordinates of the rotation handle center and a radius
    // in world units that matches the drawn blue circle in screen space.
    function getRotationHandleWorld(shape) {
        const bounds = getShapeBounds(shape);
        if (!bounds) return null;
        const scale = camera.scale || 1;

        const halfH = bounds.height / 2;
        const rotOffsetScreen = 20; // matches drawSelectionOutline rotOffset
        const rotOffsetWorld = rotOffsetScreen / scale;

        const localX = 0;
        const localY = -halfH - rotOffsetWorld;

        const rot = shape.rotation || 0;
        const cosR = Math.cos(rot);
        const sinR = Math.sin(rot);

        const wx = shape.x + (localX * cosR - localY * sinR);
        const wy = shape.y + (localX * sinR + localY * cosR);

        const radiusWorld = 6 / scale; // 6px circle in screen space
        return { x: wx, y: wy, radiusWorld };
    }

    // Erasing
    function eraseAt(x, y) {
        const scale = camera.scale || 1;
        const radiusWorld = ERASER_RADIUS / scale;

        for (let i = shapes.length - 1; i >= 0; i--) {
            const s = shapes[i];
            let hit = false;

            if (s.type === "stroke") {
                hit = hitTestStroke(s, x, y, radiusWorld);
            } else if (s.type === "text") {
                hit = hitTestText(s, x, y, radiusWorld);
            } else if (s.type === "rect" || s.type === "image" || s.type === "arrow") {
                hit = hitTestRectLike(s, x, y, radiusWorld);
            } else if (s.type === "circle") {
                hit = hitTestCircleShape(s, x, y, radiusWorld);
            }

            if (hit) {
                shapes.splice(i, 1);
                if (selectedShape === s) selectedShape = null;
                eraseChanged = true;
                break;
            }
        }
    }

    // Shared interaction helpers
    function beginPan(screenX, screenY) {
        isPanning = true;
        panStartScreen = { x: screenX, y: screenY };
        panStartCamera = { x: camera.x, y: camera.y };
        updateCanvasCursor();
    }

    // Start a resize interaction for a transformable shape and remember original bounds.
    function beginResize(shape, handleInfo, world) {
        isResizing = true;
        activeHandle = handleInfo.id;
        resizeChanged = false;
        const b = getShapeBounds(shape);
        originalBounds = {
            x: shape.x,
            y: shape.y,
            width: b ? b.width : 0,
            height: b ? b.height : 0,
            radius: shape.radius || 0,
            rotation: shape.rotation || 0,
        };
        dragStartWorld = { ...world };
    }

    function resizeArrowEndpoint(shape, bounds, world, minLength) {
        const halfLength = bounds.width / 2;
        const start = localToWorldForBounds(bounds, -halfLength, 0);
        const end = localToWorldForBounds(bounds, halfLength, 0);
        const pointerDx = world.x - dragStartWorld.x;
        const pointerDy = world.y - dragStartWorld.y;

        let nextStart = start;
        let nextEnd = end;
        if (activeHandle === "start") {
            nextStart = { x: start.x + pointerDx, y: start.y + pointerDy };
        } else {
            nextEnd = { x: end.x + pointerDx, y: end.y + pointerDy };
        }

        let dx = nextEnd.x - nextStart.x;
        let dy = nextEnd.y - nextStart.y;
        let length = Math.hypot(dx, dy);
        const angle = length > 0 ? Math.atan2(dy, dx) : bounds.rotation;
        if (length < minLength) {
            const ux = Math.cos(angle);
            const uy = Math.sin(angle);
            length = minLength;
            if (activeHandle === "start") {
                nextStart = { x: nextEnd.x - ux * length, y: nextEnd.y - uy * length };
            } else {
                nextEnd = { x: nextStart.x + ux * length, y: nextStart.y + uy * length };
            }
            dx = nextEnd.x - nextStart.x;
            dy = nextEnd.y - nextStart.y;
        }

        shape.x = (nextStart.x + nextEnd.x) / 2;
        shape.y = (nextStart.y + nextEnd.y) / 2;
        shape.length = length;
        shape.rotation = Math.atan2(dy, dx);
    }

    function beginRotate(shape, world) {
        isRotating = true;
        activeHandle = "rot";
        rotateChanged = false;
        rotationCenter = { x: shape.x, y: shape.y };
        const dx = world.x - rotationCenter.x;
        const dy = world.y - rotationCenter.y;
        rotationStartAngle = Math.atan2(dy, dx);
        shapeStartRotation = shape.rotation || 0;
    }

    function isShapeDrawingTool(tool) {
        return tool === "rect" || tool === "circle" || tool === "arrow";
    }

    function switchToSelectTool() {
        currentTool = "select";
        toolbarButtons.forEach(b => b.classList.toggle("active", b.dataset.tool === "select"));
        updateCanvasCursor();
        updateControlVisibility();
    }

    function beginShapeDrawing(tool, world) {
        isDrawing = true;
        drawingStartWorld = { ...world };

        if (tool === "rect") {
            draftShape = {
                type: "rect",
                x: world.x,
                y: world.y,
                width: 0,
                height: 0,
                rotation: 0,
                strokeColor: penColor,
                fillColor: fillEnabled ? fillColor : null,
                strokeWidth: penWidth,
            };
        } else if (tool === "circle") {
            draftShape = {
                type: "circle",
                x: world.x,
                y: world.y,
                rx: 0,
                ry: 0,
                rotation: 0,
                strokeColor: penColor,
                fillColor: fillEnabled ? fillColor : null,
                strokeWidth: penWidth,
            };
        } else {
            draftShape = {
                type: "arrow",
                x: world.x,
                y: world.y,
                length: 0,
                rotation: 0,
                strokeColor: penColor,
                strokeWidth: penWidth,
            };
        }

        shapes.push(draftShape);
        selectedShape = null;
        updateControlVisibility();
        render();
    }

    function updateDraftShape(world) {
        if (!draftShape || !drawingStartWorld) return;

        const start = drawingStartWorld;
        const dx = world.x - start.x;
        const dy = world.y - start.y;
        draftShape.x = start.x + dx / 2;
        draftShape.y = start.y + dy / 2;

        if (draftShape.type === "rect") {
            draftShape.width = Math.abs(dx);
            draftShape.height = Math.abs(dy);
        } else if (draftShape.type === "circle") {
            draftShape.rx = Math.abs(dx) / 2;
            draftShape.ry = Math.abs(dy) / 2;
        } else if (draftShape.type === "arrow") {
            draftShape.length = Math.hypot(dx, dy);
            draftShape.rotation = Math.atan2(dy, dx);
        }
    }

    function handlePrimaryDownAtWorld(world, screenX, screenY) {
        if (currentTool === "pen") {
            isDrawing = true;
            currentStroke = {
                type: "stroke",
                points: [world],
                color: penColor,
                width: penWidth,
            };
            shapes.push(currentStroke);
            selectedShape = null;
            updateControlVisibility();
            render();
        } else if (currentTool === "eraser") {
            isDrawing = true;
            eraseChanged = false;
            eraseAt(world.x, world.y);
            render();
        } else if (currentTool === "select") {
            // First, if we have a selected transformable shape, check handles.
            // IMPORTANT: do this before any general hit-testing so we don't
            // immediately fall through into drag-selection when clicking a handle.
            if (selectedShape && isTransformableShape(selectedShape)) {
                const handleInfo = getHandleHitTest(selectedShape, world.x, world.y);
                if (handleInfo) {
                    if (handleInfo.type === "resize") {
                        beginResize(selectedShape, handleInfo, world);
                    } else if (handleInfo.type === "rotate") {
                        beginRotate(selectedShape, world);
                    }
                    return; // don't run hitTestShapes when a handle was hit
                }
            }

            const hit = hitTestShapes(world.x, world.y);
            selectedShape = hit;
            if (hit) {
                isDraggingSelection = true;
                dragStartWorld = { ...world };
                moveChanged = false;
                if (hit.type === "stroke") {
                    originalShapeData = hit.points.map(p => ({ x: p.x, y: p.y }));
                } else if (hit.type === "text") {
                    originalShapeData = { x: hit.x, y: hit.y };
                } else if (isTransformableShape(hit)) {
                    originalShapeData = { x: hit.x, y: hit.y };
                }
            } else {
                isDraggingSelection = false;
                originalShapeData = null;
            }
            updateControlVisibility();
            render();
        } else if (currentTool === "text") {
            const shape = {
                type: "text",
                x: world.x,
                y: world.y,
                text: "",
                fontSize: textSize,
                color: penColor,
            };
            shapes.push(shape);
            selectedShape = shape;
            updateControlVisibility();
            render();
            showTextEditor(shape, true);
        } else if (isShapeDrawingTool(currentTool)) {
            beginShapeDrawing(currentTool, world);
         } else if (currentTool === "hand") {
            beginPan(screenX, screenY);
        }
    }

    function handlePointerMove(world, screenX, screenY, keepAspectRatio = false) {
        if (currentTool === "pen" && isDrawing && currentStroke) {
            currentStroke.points.push(world);
            render();
        } else if (isShapeDrawingTool(currentTool) && isDrawing && draftShape) {
            updateDraftShape(world);
            render();
        } else if (currentTool === "eraser" && isDrawing) {
            eraseAt(world.x, world.y);
            render();
        } else if (currentTool === "select" && selectedShape && !isPanning) {
            if (isResizing && isTransformableShape(selectedShape) && originalBounds) {
                const b = originalBounds;
                const minSize = 10 / (camera.scale || 1);

                if (selectedShape.type === "arrow" &&
                    (activeHandle === "start" || activeHandle === "end")) {
                    resizeArrowEndpoint(selectedShape, b, world, minSize);
                    resizeChanged = true;
                    render();
                    return;
                }

                // Measure in the original rotated coordinate system. The shape's
                // center changes during this interaction, so using its live center
                // would make the dragged corner drift.
                const localStart = worldToLocalForBounds(b, dragStartWorld.x, dragStartWorld.y);
                const localNow = worldToLocalForBounds(b, world.x, world.y);
                const dxLocal = localNow.x - localStart.x;
                const dyLocal = localNow.y - localStart.y;

                const signX = activeHandle === "tr" || activeHandle === "br" ? 1 : -1;
                const signY = activeHandle === "bl" || activeHandle === "br" ? 1 : -1;
                const fixedX = -signX * b.width / 2;
                const fixedY = -signY * b.height / 2;
                const originalDraggedX = signX * b.width / 2;
