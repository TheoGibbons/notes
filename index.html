        cropDrawClickApplies = clickApplies;
    }

    function cropAxisFromDrag(anchor, pointer, minimum, maximum, minSize) {
        let low = Math.min(anchor, pointer);
        let high = Math.max(anchor, pointer);

        if (high - low < minSize) {
            if (pointer < anchor) {
                low = Math.max(minimum, anchor - minSize);
                high = anchor;
            } else {
                low = anchor;
                high = Math.min(maximum, anchor + minSize);
            }

            // If the anchor is too close to that edge, grow toward the other
            // side instead while keeping the box inside the source image.
            if (high - low < minSize) {
                low = Math.max(minimum, high - minSize);
                high = Math.min(maximum, low + minSize);
            }
        }

        return { low, high };
    }

    function updateCropDrag(world) {
        if (!cropSession || !cropDragHandle) return;

        let local = worldToLocalForBounds(getCropFrame(cropSession), world.x, world.y);
        const dx = local.x - cropDragStartLocal.x;
        const dy = local.y - cropDragStartLocal.y;
        const start = cropDragStartRect;
        const full = cropSession.full;
        const minSize = Math.min(
            20 / (camera.scale || 1),
            (full.right - full.left) / 2,
            (full.bottom - full.top) / 2
        );
        const next = { ...start };

        if (cropDragHandle === "draw") {
            local = clampPointToRect(local, full);
            const drawDx = local.x - cropDragStartLocal.x;
            const drawDy = local.y - cropDragStartLocal.y;
            const threshold = CROP_DRAW_THRESHOLD_SCREEN / (camera.scale || 1);

            if (!cropDrawActivated && Math.hypot(drawDx, drawDy) < threshold) return;
            cropDrawActivated = true;

            const horizontal = cropAxisFromDrag(
                cropDragStartLocal.x, local.x, full.left, full.right, minSize
            );
            const vertical = cropAxisFromDrag(
                cropDragStartLocal.y, local.y, full.top, full.bottom, minSize
            );
            next.left = horizontal.low;
            next.right = horizontal.high;
            next.top = vertical.low;
            next.bottom = vertical.high;
        } else if (cropDragHandle === "move") {
            const width = start.right - start.left;
            const height = start.bottom - start.top;
            next.left = Math.min(full.right - width, Math.max(full.left, start.left + dx));
            next.top = Math.min(full.bottom - height, Math.max(full.top, start.top + dy));
            next.right = next.left + width;
            next.bottom = next.top + height;
        } else {
            // Handle ids name the edges they move: "tl" moves top and left, and
            // so on. Each edge stops at the source image and at the minimum size.
            if (cropDragHandle.includes("l")) {
                next.left = Math.min(start.right - minSize, Math.max(full.left, start.left + dx));
            }
            if (cropDragHandle.includes("r")) {
                next.right = Math.max(start.left + minSize, Math.min(full.right, start.right + dx));
            }
            if (cropDragHandle.includes("t")) {
                next.top = Math.min(start.bottom - minSize, Math.max(full.top, start.top + dy));
            }
            if (cropDragHandle.includes("b")) {
                next.bottom = Math.max(start.top + minSize, Math.min(full.bottom, start.bottom + dy));
            }
        }

        cropSession.rect = next;
        render();
    }

    function drawCropOverlay() {
        const session = cropSession;
        const { shape, full, rect } = session;
        const scale = camera.scale || 1;
        const img = getLoadedImage(shape);

        ctx.save();
        ctx.translate((session.origin.x - camera.x) * scale, (session.origin.y - camera.y) * scale);
        ctx.rotate(session.origin.rotation);
        ctx.scale(scale, scale); // draw in local units from here on

        const fullWidth = full.right - full.left;
        const fullHeight = full.bottom - full.top;
        const rectWidth = rect.right - rect.left;
        const rectHeight = rect.bottom - rect.top;

        if (img) {
            // Whole source image dimmed, then the crop window at full strength.
            ctx.globalAlpha = 0.3;
            drawCroppedImage(img, FULL_CROP, full.left, full.top, fullWidth, fullHeight);
            ctx.globalAlpha = 1;
            drawCroppedImage(img, {
                x: (rect.left - full.left) / fullWidth,
                y: (rect.top - full.top) / fullHeight,
                width: rectWidth / fullWidth,
                height: rectHeight / fullHeight,
            }, rect.left, rect.top, rectWidth, rectHeight);
        }

        const pixel = 1 / scale; // one screen pixel, in local units
        ctx.strokeStyle = "#007bff";
        ctx.lineWidth = pixel;
        ctx.setLineDash([4 * pixel, 4 * pixel]);
        ctx.strokeRect(full.left, full.top, fullWidth, fullHeight);

        ctx.setLineDash([]);
        ctx.lineWidth = 2 * pixel;
        ctx.strokeRect(rect.left, rect.top, rectWidth, rectHeight);

        // Rule-of-thirds guides inside the crop window
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = pixel;
        ctx.beginPath();
        for (let i = 1; i <= 2; i++) {
            const guideX = rect.left + rectWidth * (i / 3);
            const guideY = rect.top + rectHeight * (i / 3);
            ctx.moveTo(guideX, rect.top);
            ctx.lineTo(guideX, rect.bottom);
            ctx.moveTo(rect.left, guideY);
            ctx.lineTo(rect.right, guideY);
        }
        ctx.stroke();

        const handleSize = CROP_HANDLE_SCREEN_SIZE / scale;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#007bff";
        ctx.lineWidth = pixel;
        getCropHandlePositions(rect).forEach(handle => {
            ctx.beginPath();
            ctx.rect(handle.x - handleSize / 2, handle.y - handleSize / 2, handleSize, handleSize);
            ctx.fill();
            ctx.stroke();
        });

        ctx.restore();
    }

    // Local saves
    let saves = {};
    let currentSaveName = "Drawing 1";
    // The autosave this session keeps overwriting. Null means the next
    // autosave starts a new entry: after a page load, opening another drawing,
    // or a Clear / big delete (see rollOverAutosave).
    let currentAutosaveName = null;
    const pendingSaveNames = new Set(); // queued writes not yet in `saves`
    let saveSuccessTimeout = null;
    let saveOperationQueue = Promise.resolve();
    let saveDatabasePromise = null;
    const SAVE_PREVIEW_DELAY_MS = 200;
    let pendingSavePreview = null; // { name, item, timer }
    let activeSavePreview = null;  // { name, item, save, textEditorVisibility? }
    // Declared here because the first refreshSavesMenu() below can already close
    // the Autosaves submenu, long before its handlers are wired up.
    let autosavesMenuPinned = false;
    refreshSavesMenu();
    const savesReady = initializeSaveStorage();

    // Resize canvas
    function resizeCanvas() {
        const toolbarHeight = toolbar.offsetHeight;
        document.documentElement.style.setProperty("--toolbar-height", `${toolbarHeight}px`);
        viewWidth = Math.max(1, window.innerWidth);
        viewHeight = Math.max(1, window.innerHeight - toolbarHeight);
        pixelRatio = Math.min(MAX_PIXEL_RATIO, Math.max(1, window.devicePixelRatio || 1));
        canvas.style.width = `${viewWidth}px`;
        canvas.style.height = `${viewHeight}px`;
        canvas.width = Math.round(viewWidth * pixelRatio);
        canvas.height = Math.round(viewHeight * pixelRatio);
        render();
        if (currentTextEditor) {
            positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
        }
        updateToolStripOverflow();
    }
    window.addEventListener("resize", resizeCanvas);

    // Moving the window to a screen with a different pixel density changes
    // devicePixelRatio, and doesn't always resize the window as well.
    function watchPixelRatio() {
        const query = window.matchMedia?.(`(resolution: ${window.devicePixelRatio || 1}dppx)`);
        query?.addEventListener?.("change", () => {
            resizeCanvas();
            watchPixelRatio();
        }, { once: true });
    }
    watchPixelRatio();
    resizeCanvas();

    // UI: visibility helpers
    function updatePenSizeVisibility() {
        const isSizedDrawingTool = currentTool === "pen" || currentTool === "rect" ||
            currentTool === "circle" || currentTool === "arrow" || currentTool === "line";
        // A mixed selection follows the first shape the control can affect.
        const sized = selectedShapesWith(s => getShapeWidthProperty(s));
        if (currentTool === "select" && sized.length) {
            penWidth = sized[0][getShapeWidthProperty(sized[0])];
            penSizeInput.value = Math.min(20, Math.max(1, penWidth)).toString();
            penSizeValueInput.value = penWidth.toString();
        }
        penSizeContainer.style.display =
            isSizedDrawingTool || sized.length ? "inline-flex" : "none";
    }

    function updateTextSizeVisibility() {
        const texts = selectedShapesWith(s => s.type === "text");
        if (currentTool === "select" && texts.length) {
            textSize = texts[0].fontSize;
            textSizeInput.value = Math.min(72, Math.max(1, textSize)).toString();
            textSizeValueInput.value = textSize.toString();
        }
        textSizeContainer.style.display =
            currentTool === "text" || texts.length ? "inline-flex" : "none";
    }

    function updateColorVisibility() {
        const isColorDrawingTool = currentTool === "pen" || currentTool === "text" ||
            currentTool === "rect" || currentTool === "circle" ||
            currentTool === "arrow" || currentTool === "line";
        const colorable = selectedShapesWith(s => getShapeColorProperty(s));
        if (currentTool === "select" && colorable.length) {
            const color = colorable[0][getShapeColorProperty(colorable[0])];
            if (isHexColor(color)) {
                penColor = color.toLowerCase();
                penColorInput.value = penColor;
            }
        }
        colorContainer.style.display =
            isColorDrawingTool || colorable.length ? "inline-flex" : "none";
        updateSwatchPressedState();
    }

    function isFillableShape(shape) {
        return shape && (shape.type === "rect" || shape.type === "circle" || shape.type === "text");
    }

    function updateFillVisibility() {
        const isFillDrawingTool = currentTool === "rect" || currentTool === "circle" || currentTool === "text";
        const fillable = selectedShapesWith(isFillableShape);
        if (currentTool === "select" && fillable.length) {
            fillEnabled = !!fillable[0].fillColor;
            fillEnabledInput.checked = fillEnabled;
            if (fillable[0].fillColor) {
                fillColor = fillable[0].fillColor;
                fillColorInput.value = fillColor;
            }
        }
        fillContainer.style.display = isFillDrawingTool || fillable.length
            ? "inline-flex"
            : "none";
        fillColorInput.disabled = !fillEnabledInput.checked;
        const hideUncheckedTextFill = currentTool === "text" && !fillEnabledInput.checked;
        fillColorInput.style.display = hideUncheckedTextFill ? "none" : "inline-block";
        fillColorSwatches.hidden = hideUncheckedTextFill;
        updateSwatchPressedState();
    }

    const STYLED_DRAWING_TOOLS = ["pen", "text", "rect", "circle", "arrow", "line"];
    const OUTLINED_DRAWING_TOOLS = ["pen", "rect", "circle", "arrow", "line"];

    function setPressed(buttons, datasetKey, value) {
        buttons.forEach(button => {
            button.setAttribute("aria-pressed", String(button.dataset[datasetKey] === value));
        });
    }

    function updateOpacityVisibility() {
        if (currentTool === "select" && selectedShapes.length) {
            shapeOpacity = getShapeOpacity(selectedShapes[0]);
        }
        opacityContainer.style.display =
            STYLED_DRAWING_TOOLS.includes(currentTool) || selectedShapes.length ? "inline-flex" : "none";
        const percent = Math.round(shapeOpacity * 100);
        opacityInput.value = String(percent);
        opacityValue.textContent = `${percent}%`;
    }

    function updateDashVisibility() {
        const dashable = selectedShapesWith(isDashableShape);
        if (currentTool === "select" && dashable.length) dashStyle = getDashStyle(dashable[0]);
        dashContainer.style.display =
            OUTLINED_DRAWING_TOOLS.includes(currentTool) || dashable.length ? "inline-flex" : "none";
        setPressed(dashButtons, "dash", dashStyle);
    }

    function updateCornerVisibility() {
        const rects = selectedShapesWith(s => s.type === "rect");
        if (currentTool === "select" && rects.length) cornerRadius = getCornerRadius(rects[0]);
        cornerContainer.style.display =
            currentTool === "rect" || rects.length ? "inline-flex" : "none";
        cornerRadiusInput.value = String(Math.min(50, Math.round(cornerRadius)));
        cornerRadiusValue.textContent = `${Math.round(cornerRadius)} px`;
    }

    function updateSmoothingVisibility() {
        const strokes = selectedShapesWith(s => s.type === "stroke");
        if (currentTool === "select" && strokes.length) penSmoothing = getStrokeSmoothing(strokes[0]);
        smoothingContainer.style.display =
            currentTool === "pen" || strokes.length ? "inline-flex" : "none";
        smoothingInput.value = String(penSmoothing);
        smoothingValue.textContent = `${penSmoothing}%`;
    }

    function updateEraserVisibility() {
        const isEraser = currentTool === "eraser";
        eraserModeContainer.style.display = isEraser ? "inline-flex" : "none";
        eraserSizeContainer.style.display = isEraser ? "inline-flex" : "none";
        setPressed(eraserModeButtons, "eraserMode", eraserMode);
        eraserSizeInput.value = String(eraserSize);
        eraserSizeValue.textContent = `${eraserSize} px`;
    }

    function updateArrowHeadVisibility() {
        const arrows = selectedShapesWith(s => s.type === "arrow");
        if (currentTool === "select" && arrows.length) {
            arrowHead = getArrowHeadStyle(arrows[0]);
        }
        arrowHeadContainer.style.display =
            currentTool === "arrow" || arrows.length ? "inline-flex" : "none";
        arrowHeadButtons.forEach(button => {
            button.setAttribute("aria-pressed", String(button.dataset.arrowHead === arrowHead));
        });
    }

    function updateLayerVisibility() {
        const indices = selectedShapes
            .map(s => shapes.indexOf(s))
            .filter(index => index !== -1)
            .sort((a, b) => a - b);
        layerContainer.style.display = indices.length === 0 ? "none" : "inline-flex";
        // Already at the far end of the stack means there is nothing to do.
        const atBack = indices.every((index, offset) => index === offset);
        const atFront = indices.every((index, offset) =>
            index === shapes.length - indices.length + offset);
        sendToBackButton.disabled = indices.length === 0 || atBack;
        bringToFrontButton.disabled = indices.length === 0 || atFront;
    }

    function updateCropVisibility() {
        const isCropping = !!cropSession;
        const hasImageSelected = !!selectedShape && selectedShape.type === "image";
        const showCropControls = isCropping || hasImageSelected;
        cropContainer.style.display = showCropControls ? "inline-flex" : "none";
        cropButton.style.display = isCropping ? "none" : "inline-block";
        [cropApplyButton, cropResetButton, cropCancelButton].forEach(button => {
            button.style.display = isCropping ? "inline-block" : "none";
        });
    }

    function updateSettingsPanelVisibility() {
        const settingGroups = [
            colorContainer,
            fillContainer,
            penSizeContainer,
            dashContainer,
            cornerContainer,
            smoothingContainer,
            opacityContainer,
            eraserModeContainer,
            eraserSizeContainer,
            arrowHeadContainer,
            textSizeContainer,
            layerContainer,
            cropContainer,
        ];
        settingsPanel.hidden = !settingGroups.some(group => group.style.display !== "none");
        const toolbarHeight = toolbar.offsetHeight;
        document.documentElement.style.setProperty("--toolbar-height", `${toolbarHeight}px`);
    }

    function updateControlVisibility() {
        updatePenSizeVisibility();
        updateTextSizeVisibility();
        updateColorVisibility();
        updateFillVisibility();
        updateDashVisibility();
        updateCornerVisibility();
        updateSmoothingVisibility();
        updateOpacityVisibility();
        updateEraserVisibility();
        updateArrowHeadVisibility();
        updateLayerVisibility();
        updateCropVisibility();
        updateSettingsPanelVisibility();
        updateEraserCursor();
    }

    function isTransformableShape(shape) {
        return shape && (shape.type === "stroke" || shape.type === "text" || shape.type === "rect" || shape.type === "circle" ||
            isSegmentShape(shape) || shape.type === "image");
    }

    const toolCursorClasses = {
        pen: "pen-mode",
        text: "text-mode",
        rect: "rectangle-mode",
        circle: "circle-mode",
        arrow: "arrow-mode",
        line: "line-mode",
        eraser: "eraser-mode",
    };

    function updateCanvasCursor() {
        Object.values(toolCursorClasses).forEach(className => canvas.classList.remove(className));
        const cursorClass = toolCursorClasses[currentTool];
        if (cursorClass) canvas.classList.add(cursorClass);

        if (cropSession) {
            canvas.style.cursor = "crosshair";
        } else if (isPanning) {
            canvas.style.cursor = "grabbing";
        } else if (currentTool === "hand") {
            canvas.style.cursor = "grab";
        } else if (currentTool === "select") {
            canvas.style.cursor = "default";
        } else {
            canvas.style.cursor = "";
        }
    }

    // Tool strip: when the window is too narrow for every tool, the strip
    // scrolls sideways, and whichever end has tools hidden past it fades out.
    const TOOL_STRIP_FADE = 28; // px; matches the fade in the CSS

    function updateToolStripOverflow() {
        const maxScroll = toolStrip.scrollWidth - toolStrip.clientWidth;
        const scrolled = toolStrip.scrollLeft;
        const wrap = toolStrip.parentElement;
        wrap.classList.toggle("more-before", maxScroll > 1 && scrolled > 1);
        wrap.classList.toggle("more-after", maxScroll > 1 && scrolled < maxScroll - 1);
    }

    // Bring a tool's button out from under the faded ends — e.g. when its
    // keyboard shortcut picks a tool that is scrolled out of sight.
    function revealToolButton(button) {
        if (toolStrip.scrollWidth <= toolStrip.clientWidth) return;
        const strip = toolStrip.getBoundingClientRect();
        const rect = button.getBoundingClientRect();
        let delta = 0;
        if (rect.left < strip.left + TOOL_STRIP_FADE) {
            delta = rect.left - strip.left - TOOL_STRIP_FADE;
        } else if (rect.right > strip.right - TOOL_STRIP_FADE) {
            delta = rect.right - strip.right + TOOL_STRIP_FADE;
        }
        if (delta) toolStrip.scrollBy({ left: delta, behavior: "smooth" });
    }

    toolStrip.addEventListener("scroll", updateToolStripOverflow, { passive: true });

    // A mouse wheel only scrolls up and down; turn it sideways for the strip.
    toolStrip.addEventListener("wheel", (e) => {
        if (toolStrip.scrollWidth <= toolStrip.clientWidth) return;
        if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return; // already sideways
        e.preventDefault();
        const step = e.deltaMode === WheelEvent.DOM_DELTA_LINE ? 16 : 1;
        toolStrip.scrollLeft += e.deltaY * step;
    }, { passive: false });

    // Tool switching
    function setActiveToolButton(tool) {
        toolbarButtons.forEach(button => {
            const isActive = button.dataset.tool === tool;
            button.classList.toggle("active", isActive);
            button.setAttribute("aria-pressed", String(isActive));
            if (isActive) revealToolButton(button);
        });
    }

    toolbarButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
            applyImageCrop();
            currentTool = btn.dataset.tool;
            setActiveToolButton(currentTool);

            updateCanvasCursor();
            updateControlVisibility();
        });
    });
    setActiveToolButton(currentTool);

    // Pen / text UI handlers — also update selected shape if present
    function getShapeColorProperty(shape) {
        if (!shape) return null;
        if (shape.type === "stroke" || shape.type === "text") return "color";
        if (shape.type === "rect" || shape.type === "circle" || isSegmentShape(shape)) {
            return "strokeColor";
        }
        return null;
    }

    function getShapeWidthProperty(shape) {
        if (!shape) return null;
        if (shape.type === "stroke") return "width";
        if (shape.type === "rect" || shape.type === "circle" || isSegmentShape(shape)) {
            return "strokeWidth";
        }
        return null;
    }

    penColorInput.addEventListener("input", () => {
        penColor = penColorInput.value || "#000000";

        const colorable = selectedShapesWith(s => getShapeColorProperty(s));
        if (colorable.length) {
            colorable.forEach(s => { s[getShapeColorProperty(s)] = penColor; });
            render();
        }
        updateSwatchPressedState();
    });

    penColorInput.addEventListener("change", () => {
        if (selectedShapes.some(s => getShapeColorProperty(s))) {
            pushHistory();
        }
    });

    fillEnabledInput.addEventListener("change", () => {
        fillEnabled = fillEnabledInput.checked;
        fillColorInput.disabled = !fillEnabled;
        const fillable = selectedShapesWith(isFillableShape);
        if (fillable.length) {
            fillable.forEach(s => { s.fillColor = fillEnabled ? fillColor : null; });
            if (currentTextEditor && fillable.includes(currentTextEditor.shape)) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
            pushHistory();
            render();
        }
        updateFillVisibility();
    });

    fillColorInput.addEventListener("input", () => {
        fillColor = fillColorInput.value || "#ffff00";
        updateSwatchPressedState();
        const fillable = fillEnabled ? selectedShapesWith(isFillableShape) : [];
        if (fillable.length) {
            fillable.forEach(s => { s.fillColor = fillColor; });
            if (currentTextEditor && fillable.includes(currentTextEditor.shape)) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
            render();
        }
    });

    fillColorInput.addEventListener("change", () => {
        if (fillEnabled && selectedShapes.some(isFillableShape)) pushHistory();
    });

    function applyPenSize(value) {
        if (!Number.isFinite(value) || value < 1) return false;
        penWidth = value;
        const sized = selectedShapesWith(s => getShapeWidthProperty(s));
        if (sized.length) {
            sized.forEach(s => { s[getShapeWidthProperty(s)] = penWidth; });
            render();
        }
        return true;
    }

    penSizeInput.addEventListener("input", () => {
        const value = Number(penSizeInput.value);
        if (applyPenSize(value)) penSizeValueInput.value = value.toString();
    });

    penSizeInput.addEventListener("change", () => {
        if (selectedShapes.some(s => getShapeWidthProperty(s))) {
            pushHistory();
        }
    });

    penSizeValueInput.addEventListener("input", () => {
        const value = Number(penSizeValueInput.value);
        if (applyPenSize(value)) {
            penSizeInput.value = Math.min(20, Math.max(1, value)).toString();
        }
    });

    penSizeValueInput.addEventListener("change", () => {
        const value = Number(penSizeValueInput.value);
        if (!applyPenSize(value)) {
            penSizeValueInput.value = penWidth.toString();
            return;
        }
        if (selectedShapes.some(s => getShapeWidthProperty(s))) pushHistory();
    });

    arrowHeadButtons.forEach(button => {
        button.addEventListener("click", () => {
            arrowHead = button.dataset.arrowHead;
            const changed = selectedShapesWith(s =>
                s.type === "arrow" && getArrowHeadStyle(s) !== arrowHead);
            if (changed.length) {
                changed.forEach(s => { s.arrowHead = arrowHead; });
                pushHistory();
                render();
            }
            updateArrowHeadVisibility();
        });
    });

    function applyTextSize(value) {
        if (!Number.isFinite(value) || value < 1) return false;
        textSize = value;
        const texts = selectedShapesWith(s => s.type === "text");
        if (texts.length) {
            texts.forEach(s => { s.fontSize = textSize; });
            if (currentTextEditor && texts.includes(currentTextEditor.shape)) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
            render();
        }
        return true;
    }

    textSizeInput.addEventListener("input", () => {
        const value = Number(textSizeInput.value);
        if (applyTextSize(value)) textSizeValueInput.value = value.toString();
    });

    textSizeInput.addEventListener("change", () => {
        if (selectedShapes.some(s => s.type === "text")) {
            pushHistory();
        }
    });

    textSizeValueInput.addEventListener("input", () => {
        const value = Number(textSizeValueInput.value);
        if (applyTextSize(value)) {
            textSizeInput.value = Math.min(72, Math.max(1, value)).toString();
        }
    });

    textSizeValueInput.addEventListener("change", () => {
        const value = Number(textSizeValueInput.value);
        if (!applyTextSize(value)) {
            textSizeValueInput.value = textSize.toString();
            return;
        }
        if (selectedShapes.some(s => s.type === "text")) pushHistory();
    });

    // Style controls. Each edits the matching property on every selected shape
    // that has it; dragging a slider previews live and its release is one undo.
    opacityInput.addEventListener("input", () => {
        shapeOpacity = Number(opacityInput.value) / 100;
        opacityValue.textContent = `${opacityInput.value}%`;
        if (selectedShapes.length) {
            selectedShapes.forEach(s => { s.opacity = shapeOpacity; });
            render();
        }
    });
    opacityInput.addEventListener("change", () => {
        if (selectedShapes.length) pushHistory();
    });

    cornerRadiusInput.addEventListener("input", () => {
        cornerRadius = Number(cornerRadiusInput.value);
        cornerRadiusValue.textContent = `${cornerRadius} px`;
        const rects = selectedShapesWith(s => s.type === "rect");
        if (rects.length) {
            rects.forEach(s => { s.cornerRadius = cornerRadius; });
            render();
        }
    });
    cornerRadiusInput.addEventListener("change", () => {
        if (selectedShapes.some(s => s.type === "rect")) pushHistory();
    });

    smoothingInput.addEventListener("input", () => {
        penSmoothing = Number(smoothingInput.value);
        smoothingValue.textContent = `${penSmoothing}%`;
        const strokes = selectedShapesWith(s => s.type === "stroke");
        if (strokes.length) {
            strokes.forEach(s => { s.smoothing = penSmoothing; });
            render();
        }
    });
    smoothingInput.addEventListener("change", () => {
        if (selectedShapes.some(s => s.type === "stroke")) pushHistory();
    });

    dashButtons.forEach(button => {
        button.addEventListener("click", () => {
            dashStyle = button.dataset.dash;
            const changed = selectedShapesWith(s => isDashableShape(s) && getDashStyle(s) !== dashStyle);
            if (changed.length) {
                changed.forEach(s => { s.dash = dashStyle; });
                pushHistory();
                render();
            }
            updateDashVisibility();
        });
    });

    eraserModeButtons.forEach(button => {
        button.addEventListener("click", () => {
            eraserMode = button.dataset.eraserMode;
            updateEraserVisibility();
        });
    });

    eraserSizeInput.addEventListener("input", () => {
        eraserSize = Number(eraserSizeInput.value);
        eraserSizeValue.textContent = `${eraserSize} px`;
        updateEraserCursor();
    });

    // Colour swatches: a fixed palette plus the colours used most recently.
    const COLOR_PRESETS = [
        "#000000", "#868e96", "#ffffff", "#e03131", "#f08c00",
        "#fab005", "#2f9e44", "#1971c2", "#7048e8", "#c2255c",
    ];
    const FILL_PRESETS = [
        "#ffffff", "#e9ecef", "#ffc9c9", "#ffd8a8", "#ffec99",
        "#ffff00", "#b2f2bb", "#a5d8ff", "#d0bfff", "#fcc2d7",
    ];
    const RECENT_COLORS_KEY = "drawingPad_recentColors_v1";
    const MAX_RECENT_COLORS = 8;
    let recentColors = loadRecentColors();

    function isHexColor(value) {
        return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);
    }

    function loadRecentColors() {
        try {
            const parsed = JSON.parse(localStorage.getItem(RECENT_COLORS_KEY) || "[]");
            return Array.isArray(parsed)
                ? parsed.filter(isHexColor).map(color => color.toLowerCase()).slice(0, MAX_RECENT_COLORS)
                : [];
        } catch {
            return [];
        }
    }

    function rememberColor(color) {
        if (!isHexColor(color)) return;
        const normalized = color.toLowerCase();
        if (recentColors[0] === normalized) return;
        recentColors = [normalized, ...recentColors.filter(c => c !== normalized)]
            .slice(0, MAX_RECENT_COLORS);
        try {
            localStorage.setItem(RECENT_COLORS_KEY, JSON.stringify(recentColors));
        } catch {
            // Recent colours are a convenience; without storage they last the session.
        }
        renderSwatches();
    }

    function renderSwatchRow(container, presets) {
        container.textContent = "";
        const addSwatch = (color, label) => {
            const swatch = document.createElement("button");
            swatch.type = "button";
            swatch.className = "swatch";
            swatch.dataset.color = color;
            swatch.style.setProperty("--swatch", color);
            swatch.title = label;
            swatch.setAttribute("aria-label", label);
            container.appendChild(swatch);
        };
        presets.forEach(color => addSwatch(color, color));
        const recents = recentColors.filter(color => !presets.includes(color));
        if (recents.length) {
            const divider = document.createElement("span");
            divider.className = "swatch-divider";
            divider.setAttribute("aria-hidden", "true");
            container.appendChild(divider);
            recents.forEach(color => addSwatch(color, `Recent: ${color}`));
        }
    }

    function renderSwatches() {
        renderSwatchRow(penColorSwatches, COLOR_PRESETS);
        renderSwatchRow(fillColorSwatches, FILL_PRESETS);
        updateSwatchPressedState();
    }

    function updateSwatchPressedState() {
        const current = penColor.toLowerCase();
        penColorSwatches.querySelectorAll("button.swatch").forEach(swatch => {
            swatch.setAttribute("aria-pressed", String(swatch.dataset.color === current));
        });
        const currentFill = fillEnabled ? fillColor.toLowerCase() : null;
        fillColorSwatches.querySelectorAll("button.swatch").forEach(swatch => {
            swatch.setAttribute("aria-pressed", String(swatch.dataset.color === currentFill));
        });
    }

    function pickPenColor(color) {
        penColor = color;
        penColorInput.value = color;
        const colorable = selectedShapesWith(s => getShapeColorProperty(s));
        if (colorable.length) {
            colorable.forEach(s => { s[getShapeColorProperty(s)] = color; });
            if (currentTextEditor && colorable.includes(currentTextEditor.shape)) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
            pushHistory();
            render();
        }
        rememberColor(color);
        updateSwatchPressedState();
    }

    // Picking a fill swatch also switches the fill on.
    function pickFillColor(color) {
        fillColor = color;
        fillColorInput.value = color;
        fillEnabled = true;
        fillEnabledInput.checked = true;
        const fillable = selectedShapesWith(isFillableShape);
        if (fillable.length) {
            fillable.forEach(s => { s.fillColor = color; });
            if (currentTextEditor && fillable.includes(currentTextEditor.shape)) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
            pushHistory();
            render();
        }
        rememberColor(color);
        updateFillVisibility();
    }

    penColorSwatches.addEventListener("click", (e) => {
        const swatch = e.target.closest("button.swatch");
        if (swatch) pickPenColor(swatch.dataset.color);
    });
    fillColorSwatches.addEventListener("click", (e) => {
        const swatch = e.target.closest("button.swatch");
        if (swatch) pickFillColor(swatch.dataset.color);
    });
    penColorInput.addEventListener("change", () => rememberColor(penColorInput.value));
    fillColorInput.addEventListener("change", () => rememberColor(fillColorInput.value));
    renderSwatches();

    // Initialize controls
    penColorInput.value = penColor;
    fillEnabledInput.checked = fillEnabled;
    fillColorInput.value = fillColor;
    penSizeInput.value = penWidth.toString();
    penSizeValueInput.value = penWidth.toString();
    textSizeInput.value = textSize.toString();
    textSizeValueInput.value = textSize.toString();
    updateControlVisibility();

    cropButton.addEventListener("click", () => {
        if (selectedShape && selectedShape.type === "image") beginImageCrop(selectedShape);
    });
    cropApplyButton.addEventListener("click", () => applyImageCrop());
    cropResetButton.addEventListener("click", () => resetImageCrop());
    cropCancelButton.addEventListener("click", () => cancelImageCrop());

    // Move the whole selection to one end of the stack, keeping the shapes in
    // the same order relative to each other as they were before.
    function moveSelectionToStackEnd(toFront) {
        const moving = shapes.filter(isShapeSelected);
        if (!moving.length) return;
        const rest = shapes.filter(s => !isShapeSelected(s));
        const reordered = toFront ? [...rest, ...moving] : [...moving, ...rest];
        if (reordered.every((s, index) => s === shapes[index])) return;
        shapes = reordered;
        pushHistory();
        updateLayerVisibility();
        render();
    }

    sendToBackButton.addEventListener("click", () => moveSelectionToStackEnd(false));
    bringToFrontButton.addEventListener("click", () => moveSelectionToStackEnd(true));

    // Clear, undo, redo
    clearButton.addEventListener("click", () => {
        cancelImageCrop();
        shapes = [];
        clearSelection();
        destroyTextEditor();
        pushHistory();
        updateControlVisibility();
        render();
    });

    undoButton.addEventListener("click", () => {
        if (historyIndex > 0) {
            destroyTextEditor();
            restoreHistory(historyIndex - 1);
        }
    });

    redoButton.addEventListener("click", () => {
        if (historyIndex < history.length - 1) {
            destroyTextEditor();
            restoreHistory(historyIndex + 1);
        }
    });

    const toolHotkeys = {
        a: "arrow",
        c: "circle",
        e: "eraser",
        h: "hand",
        i: "image",
        l: "line",
        p: "pen",
        r: "rect",
        t: "text",
        v: "select",
    };

    function deleteSelectedShapes() {
        if (!selectedShapes.length) return;
        cancelImageCrop();
        const doomed = selectedShapes;
        const remaining = shapes.filter(s => !doomed.includes(s));
        clearSelection();
        if (remaining.length !== shapes.length) {
            shapes = remaining;
            pushHistory();
        }
        updateControlVisibility();
        render();
    }

    // Keyboard shortcuts. Ctrl and Cmd are interchangeable throughout, so the
    // same shortcuts work on Windows, Linux and macOS.
    window.addEventListener("keydown", (e) => {
        const targetIsEditable = e.target instanceof HTMLInputElement ||
            e.target instanceof HTMLTextAreaElement || e.target?.isContentEditable;
        const targetIsButton = e.target instanceof HTMLButtonElement;
        const targetIsSelect = e.target instanceof HTMLSelectElement;
        const mod = e.ctrlKey || e.metaKey;
        const key = e.key.toLowerCase();

        // Open dialogs own the keyboard, so canvas shortcuts cannot fire
        // behind them (Enter submits the Save Image form as usual).
        if (isSaveImageDialogOpen()) {
            if (e.key === "Escape") {
                e.preventDefault();
                closeSaveImageDialog();
            }
            return;
        }
        if (isHelpOpen()) {
            if (e.key === "Escape" || e.key === "?") {
                e.preventDefault();
                closeHelp();
            }
            return;
        }
        if (isContextMenuOpen()) {
            handleContextMenuKey(e);
            return;
        }

        if (e.key === "Escape") {
            e.preventDefault();
            if (isSaveMenuOpen()) {
                closeSaveMenu();
                return;
            }
            if (cropSession) {
                cancelImageCrop();
                return;
            }
            stopAllInteractions(true);
            if (selectedShapes.length) {
                clearSelection();
                updateControlVisibility();
            } else {
                switchToSelectTool();
            }
            render();
        } else if (e.key === "Enter" && cropSession && !targetIsEditable && !targetIsButton) {
            e.preventDefault();
            applyImageCrop();
        } else if (mod && !e.shiftKey && !e.altKey && key === "s") {
            // The shortcut is the quick path: straight to PNG, no padding, no
            // dialog. Use the menu item when those need to change.
            e.preventDefault();
            closeSaveMenu();
            saveImage();
        } else if (mod && !e.shiftKey && !e.altKey && key === "a" && !targetIsEditable) {
            e.preventDefault();
            selectAllShapes();
        } else if (mod && !e.shiftKey && !e.altKey && key === "c" && !targetIsEditable &&
            selectedShapes.length) {
            e.preventDefault();
            copySelection();
        } else if (mod && !e.shiftKey && !e.altKey && key === "x" && !targetIsEditable &&
            selectedShapes.length) {
            e.preventDefault();
            cutSelection();
        } else if (mod && !e.shiftKey && !e.altKey && key === "d" && !targetIsEditable) {
            // Always swallow the key, selection or not, so the browser's
            // bookmark dialog never opens over the canvas.
            e.preventDefault();
            duplicateSelectedShapes();
        } else if (mod && !e.shiftKey && !e.altKey && key === "n" && !targetIsEditable) {
            // Start a blank page. Undo still brings the drawing back, since
            // Clear pushes the empty canvas onto the history stack.
            e.preventDefault();
            closeSaveMenu();
            clearButton.click();
        } else if (mod && !e.altKey && (e.key === "=" || e.key === "+") && !targetIsEditable) {
            e.preventDefault();
            zoomBy(ZOOM_STEP);
        } else if (mod && !e.altKey && (e.key === "-" || e.key === "_") && !targetIsEditable) {
            e.preventDefault();
            zoomBy(1 / ZOOM_STEP);
        } else if (mod && !e.altKey && e.key === "0" && !targetIsEditable) {
            e.preventDefault();
            setZoom(1);
        } else if ((e.key === "Delete" || e.key === "Backspace") && selectedShapes.length &&
            !targetIsEditable && !targetIsSelect) {
            // Backspace too: it is the delete key on a Mac keyboard.
            e.preventDefault();
            deleteSelectedShapes();
        } else if (NUDGE_DIRECTIONS[e.key] && selectedShapes.length && !targetIsEditable &&
            !targetIsSelect && !currentTextEditor && !cropSession &&
            !hasActiveMouseInteraction() && !mod && !e.altKey) {
            // Skipped mid-drag: the drag positions shapes from where it started
            // and would undo the nudge on the next mouse move anyway.
            e.preventDefault();
            nudgeSelectedShapes(NUDGE_DIRECTIONS[e.key], e.shiftKey, e.repeat);
        } else if (e.key === " " && !targetIsEditable && !targetIsButton && !currentTextEditor &&
            currentTool !== "text" && !targetIsSelect && !mod && !e.altKey && !e.repeat) {
            e.preventDefault();
            zoomToFitShapes();
        } else if (e.key === "?" && !targetIsEditable && !mod && !e.altKey) {
            e.preventDefault();
            openHelp();
        } else if (!targetIsEditable && !mod && !e.altKey && !e.repeat && toolHotkeys[key]) {
            e.preventDefault();
            stopAllInteractions(true);
            const tool = toolHotkeys[key];
            if (tool === "image") {
                insertImageButton.click();
            } else {
                const toolButton = Array.from(toolbarButtons)
                    .find(button => button.dataset.tool === tool);
                toolButton?.click();
            }
        } else if (mod && !e.shiftKey && !e.altKey && key === "z" && !targetIsEditable) {
            e.preventDefault();
            undoButton.click();
        } else if (mod && !e.altKey && !targetIsEditable &&
            ((!e.shiftKey && key === "y") || (e.shiftKey && key === "z"))) {
            e.preventDefault();
            redoButton.click();
        }
    });

    // Save Image
    const DEFAULT_IMAGE_EXPORT_SCALE = 2;
    const IMAGE_FORMATS = {
        png: { mime: "image/png", extension: "png", transparency: true },
        jpeg: { mime: "image/jpeg", extension: "jpg", transparency: false, quality: 0.98 },
        webp: { mime: "image/webp", extension: "webp", transparency: true, quality: 0.98 },
        // Vector: resolution doesn't apply.
        svg: { mime: "image/svg+xml", extension: "svg", transparency: true, vector: true },
        // One page holding the drawing as a high-quality JPEG; no PDF library
        // needed. JPEG has no transparency, so the page gets a background.
        pdf: { mime: "application/pdf", extension: "pdf", transparency: false },
    };

    function getImageFormat(name) {
        return IMAGE_FORMATS[name] || IMAGE_FORMATS.png;
    }

    function getImageExportScale(value) {
        const scale = Number(value);
        return Number.isFinite(scale) ? Math.max(1, Math.min(4, scale)) : DEFAULT_IMAGE_EXPORT_SCALE;
    }

    // Pixel size of the saved image: the drawing's own bounds at the requested
    // resolution, plus padding on every side. Padding remains an output-pixel
    // measurement, so asking for 20 px still produces 20 px at every scale.
    function getSaveImageSize(padding = 0, scale = DEFAULT_IMAGE_EXPORT_SCALE, shapeList = shapes) {
        const extent = getShapesWorldExtent(shapeList);
        if (!extent) return null;
        const pad = Number.isFinite(padding) ? Math.max(0, padding) : 0;
        const outputScale = getImageExportScale(scale);
        return {
            extent,
            pad,
            scale: outputScale,
            width: Math.max(1, Math.ceil((extent.maxX - extent.minX) * outputScale + pad * 2)),
            height: Math.max(1, Math.ceil((extent.maxY - extent.minY) * outputScale + pad * 2)),
        };
    }

    // Redraw every shape cropped to the drawing's bounds and return a data URL.
    // The visible canvas is reused (and restored straight after) because the
    // draw helpers all target it directly; nothing repaints part-way through a
    // task, so the resized canvas never reaches the screen.
    function renderDrawingToDataUrl({
        padding = 0,
        scale = DEFAULT_IMAGE_EXPORT_SCALE,
        format = "png",
        background = null,
        shapeList = shapes,
    }) {
        const size = getSaveImageSize(padding, scale, shapeList);
        if (!size) return null;
        const spec = getImageFormat(format);

        const savedCamera = camera;
        const savedShapes = shapes;
        const savedSelection = selectedShapes;
        const savedPreview = activeSavePreview;
        const savedWidth = canvas.width;
        const savedHeight = canvas.height;
        const savedView = { viewWidth, viewHeight, pixelRatio };

        try {
            shapes = shapeList;
            selectedShapes = []; // selection outlines are UI, not artwork
            activeSavePreview = null;
            // One bitmap pixel per unit: the export scale is already in `size`.
            viewWidth = size.width;
            viewHeight = size.height;
            pixelRatio = 1;
            canvas.width = size.width;
            canvas.height = size.height;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            camera = {
                x: size.extent.minX - size.pad / size.scale,
                y: size.extent.minY - size.pad / size.scale,
                scale: size.scale,
            };
            render();
            if (background) {
                // Fill behind what was just drawn rather than before it, so the
                // shapes do not have to be rendered twice.
                ctx.save();
                ctx.globalCompositeOperation = "destination-over";
                ctx.fillStyle = background;
                ctx.fillRect(0, 0, size.width, size.height);
                ctx.restore();
            }
            return canvas.toDataURL(spec.mime, spec.quality);
        } finally {
            selectedShapes = savedSelection;
            activeSavePreview = savedPreview;
            shapes = savedShapes;
            camera = savedCamera;
            ({ viewWidth, viewHeight, pixelRatio } = savedView);
            canvas.width = savedWidth;
            canvas.height = savedHeight;
            render();
        }
    }

    function dataUrlToBlob(dataUrl) {
        const comma = dataUrl.indexOf(",");
        const header = dataUrl.slice(0, comma);
        const mimeMatch = header.match(/^data:([^;,]+)/);
        const binary = atob(dataUrl.slice(comma + 1));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new Blob([bytes], { type: mimeMatch?.[1] || "image/png" });
    }

    // --- Copy, cut and paste ------------------------------------------------
    // Copying puts a PNG of the selection on the system clipboard, for pasting
    // into other apps, and keeps the shapes themselves here so pasting back
    // into the drawing gives editable shapes rather than a picture of them.
    //
    // The system clipboard can't carry the shapes alongside the PNG without
    // other apps pasting the wrong one, so a paste decides which to use: our
    // shapes if nothing else can have been copied since (the page never lost
    // focus), or if the clipboard still holds an image the size of our PNG.
    let shapeClipboard = null; // { shapes, imageSize, maybeStale }

    // Copying anything else — in another app (the window loses focus) or from
    // a text field on this page — means the clipboard may not be ours any more.
    function markShapeClipboardStale() {
        if (shapeClipboard) shapeClipboard.maybeStale = true;
    }
    window.addEventListener("blur", markShapeClipboardStale);
    document.addEventListener("copy", markShapeClipboardStale);
    document.addEventListener("cut", markShapeClipboardStale);

    function writeShapesImageToClipboard(shapeList) {
        if (!navigator.clipboard?.write || typeof ClipboardItem === "undefined") return;
        try {
            const dataUrl = renderDrawingToDataUrl({ format: "png", shapeList });
            if (!dataUrl) return;
            navigator.clipboard.write([
                new ClipboardItem({ "image/png": dataUrlToBlob(dataUrl) }),
            ]).catch(error => {
                console.error("Could not copy the selection to the clipboard as an image", error);
            });
        } catch (error) {
            console.error("Could not copy the selection to the clipboard as an image", error);
        }
    }

    function copySelection() {
        commitCurrentTextEditor();
        // A pending crop is part of what the user sees and expects to copy.
        applyImageCrop();

        const shapeList = shapes.filter(isShapeSelected);
        if (!shapeList.length) return false;
        const imageSize = getSaveImageSize(0, DEFAULT_IMAGE_EXPORT_SCALE, shapeList);
        shapeClipboard = {
            shapes: cloneShapes(shapeList),
            imageSize: imageSize ? { width: imageSize.width, height: imageSize.height } : null,
            maybeStale: false,
        };
        writeShapesImageToClipboard(shapeList);
        return true;
    }

    function cutSelection() {
        if (copySelection()) deleteSelectedShapes();
    }

    // Where pasted things land: under the mouse when it is over the canvas,
    // otherwise the middle of the view.
    function getPasteTarget() {
        const rect = getCanvasRect();
        const pointer = lastPointerClient;
        if (pointer && pointerOverCanvas &&
            pointer.x >= rect.left && pointer.x <= rect.right &&
            pointer.y >= rect.top && pointer.y <= rect.bottom) {
            return screenToWorld(pointer.x, pointer.y);
        }
        return screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }

    function pasteShapes(list, target = getPasteTarget()) {
        commitCurrentTextEditor();
        applyImageCrop();
        const copies = cloneShapes(list);
        const extent = getShapesWorldExtent(copies);
        if (!extent) return;
        const dx = target.x - (extent.minX + extent.maxX) / 2;
        const dy = target.y - (extent.minY + extent.maxY) / 2;
        for (const copy of copies) translateShape(copy, dx, dy);

        shapes.push(...copies);
        setSelection(copies);
        switchToSelectTool();
        pushHistory();
        updateControlVisibility();
        render();
    }

    function pasteText(text, target = getPasteTarget()) {
        const content = String(text).replace(/\r\n?/g, "\n").replace(/\t/g, "    ").replace(/\s+$/, "");
        if (!content.trim()) return false;
        commitCurrentTextEditor();
        applyImageCrop();
        const metrics = measureTextBlock(content, textSize);
        const shape = {
            type: "text",
            x: target.x - metrics.width / 2,
            y: target.y - metrics.height / 2,
            text: content,
            fontSize: textSize,
            color: penColor,
            fillColor: null,
            rotation: 0,
            opacity: shapeOpacity,
        };
        shapes.push(shape);
        setSelection([shape]);
        switchToSelectTool();
        pushHistory();
        updateControlVisibility();
        render();
        return true;
    }

    async function imageMatchesSize(blob, size) {
        if (!size || typeof createImageBitmap !== "function") return false;
        try {
            const bitmap = await createImageBitmap(blob);
            const matches = bitmap.width === size.width && bitmap.height === size.height;
            bitmap.close?.();
            return matches;
        } catch {
            return false;
        }
    }

    // Paste an image from the clipboard: our own copied shapes if it is the
    // PNG we put there, otherwise the image itself.
    async function pasteClipboardImage(blob, target) {
        const clip = shapeClipboard;
        if (clip && await imageMatchesSize(blob, clip.imageSize)) {
            pasteShapes(clip.shapes, target);
        } else {
            addImageBlob(blob, target);
        }
    }

    // The right-click menu's Paste has no paste event to read, so it asks the
    // async Clipboard API (the browser may ask permission the first time).
    async function pasteFromMenu(target) {
        if (shapeClipboard && !shapeClipboard.maybeStale) {
            pasteShapes(shapeClipboard.shapes, target);
            return;
        }
        try {
            if (navigator.clipboard?.read) {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const imageType = item.types.find(type => type.startsWith("image/"));
                    if (imageType) {
                        await pasteClipboardImage(await item.getType(imageType), target);
                        return;
                    }
                    if (item.types.includes("text/plain")) {
                        const text = await (await item.getType("text/plain")).text();
                        if (pasteText(text, target)) return;
                    }
                }
            } else if (navigator.clipboard?.readText) {
                if (pasteText(await navigator.clipboard.readText(), target)) return;
            }
        } catch (error) {
            console.warn("Could not read the clipboard", error);
        }
        if (shapeClipboard) {
            pasteShapes(shapeClipboard.shapes, target);
            return;
        }
        alert(`The clipboard could not be read here. Press ${MOD_KEY_LABEL}+V to paste instead.`);
    }

    function saveImage({
        padding = 0,
        scale = DEFAULT_IMAGE_EXPORT_SCALE,
        format = "png",
        background = null,
        fileName = "drawing",
    } = {}) {
        commitCurrentTextEditor();
        // Commit any crop first so its overlay is not baked into the image.
        applyImageCrop();

        const base = (fileName || "").trim().replace(/[\\/:*?"<>|]+/g, "-") || "drawing";
        const downloadName = `${base}.${getImageFormat(format).extension}`;

        if (format === "svg") {
            const svg = buildSvgDocument({ padding, background });
            if (!svg) return false;
            downloadBlob(new Blob([svg], { type: "image/svg+xml" }), downloadName);
            return true;
        }
        if (format === "pdf") {
            const size = getSaveImageSize(padding, scale);
            const dataUrl = renderDrawingToDataUrl({
                padding, scale, format: "jpeg", background: background || "#ffffff",
            });
            if (!size || !dataUrl) return false;
            // Page size in points (1/72 in) for the drawing at 1× (96 px/in).
            const pageWidth = size.width / size.scale * 0.75;
            const pageHeight = size.height / size.scale * 0.75;
            downloadBlob(
                buildPdfFromJpeg(dataUrlToBytes(dataUrl), size.width, size.height, pageWidth, pageHeight),
                downloadName,
            );
            return true;
        }

        const dataUrl = renderDrawingToDataUrl({ padding, scale, format, background });
        if (!dataUrl) return false;
        downloadUrl(dataUrl, downloadName);
        return true;
    }

    function downloadUrl(url, fileName) {
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function downloadBlob(blob, fileName) {
        const url = URL.createObjectURL(blob);
        downloadUrl(url, fileName);
        // Give the download a moment to start before releasing the data.
        setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function dataUrlToBytes(dataUrl) {
        const binary = atob(dataUrl.slice(dataUrl.indexOf(",") + 1));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    // A minimal one-page PDF showing a JPEG across the whole page. PDF can
    // embed JPEG data as-is (DCTDecode), so no encoder or library is needed.
    function buildPdfFromJpeg(jpegBytes, pixelWidth, pixelHeight, pageWidth, pageHeight) {
        const encoder = new TextEncoder();
        const chunks = [];
        const offsets = [];
        let length = 0;
        const add = (data) => {
            const bytes = typeof data === "string" ? encoder.encode(data) : data;
            chunks.push(bytes);
            length += bytes.length;
        };
        const object = (id, body) => {
            offsets[id] = length;
            add(`${id} 0 obj\n${body}\nendobj\n`);
        };
        const width = pageWidth.toFixed(2);
        const height = pageHeight.toFixed(2);

        add("%PDF-1.4\n");
        object(1, "<< /Type /Catalog /Pages 2 0 R >>");
        object(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
        object(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${width} ${height}] ` +
            "/Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
        offsets[4] = length;
        add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pixelWidth} /Height ${pixelHeight} ` +
            `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
        add(jpegBytes);
        add("\nendstream\nendobj\n");
        const content = `q\n${width} 0 0 ${height} 0 0 cm\n/Im0 Do\nQ\n`;
        object(5, `<< /Length ${content.length} >>\nstream\n${content}endstream`);

        const xrefOffset = length;
        let xref = "xref\n0 6\n0000000000 65535 f \n";
        for (let id = 1; id <= 5; id++) xref += `${String(offsets[id]).padStart(10, "0")} 00000 n \n`;
        add(xref);
        add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`);
        return new Blob(chunks, { type: "application/pdf" });
    }

    // --- SVG export ---------------------------------------------------------
    // The drawing as vector shapes in world units, matching what the canvas
    // draws: same dashes, corners, smoothing, opacity, crops and rotations.
    function svgNumber(value) {
        return String(Math.round(value * 100) / 100);
    }

    function escapeXml(value) {
        return String(value)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
    }

    // Canvas draws text from the top of the em box; SVG places text on its
    // baseline. Measure the gap once (per 100 px) and scale it.
    let textBaselineRatio = null;
    function getTextBaselineOffset(fontSize) {
        if (textBaselineRatio === null) {
            ctx.save();
            ctx.font = "100px sans-serif";
            ctx.textBaseline = "top";
            const fromTop = ctx.measureText("H").actualBoundingBoxAscent;
            ctx.textBaseline = "alphabetic";
            const fromBaseline = ctx.measureText("H").actualBoundingBoxAscent;
            ctx.restore();
            const ratio = (fromBaseline - fromTop) / 100;
            textBaselineRatio = Number.isFinite(ratio) && ratio > 0 ? ratio : 0.8;
        }
        return textBaselineRatio * fontSize;
    }

    // Dashes always use round caps; `roundCapsAlready` skips repeating the
    // attribute on elements that set it themselves.
    function svgDashAttributes(shape, lineWidth, roundCapsAlready = false) {
        const pattern = getDashPattern(getDashStyle(shape), lineWidth);
        if (!pattern.length) return "";
        return ` stroke-dasharray="${pattern.map(svgNumber).join(" ")}"` +
            (roundCapsAlready ? "" : ` stroke-linecap="round"`);
    }

    function svgStrokePath(stroke) {
        const points = stroke.points;
        const coords = getSmoothedStrokeCoords(stroke);
        const x = i => svgNumber(coords ? coords[i * 2] : points[i].x);
        const y = i => svgNumber(coords ? coords[i * 2 + 1] : points[i].y);
        const xs = i => coords ? coords[i * 2] : points[i].x;
        const ys = i => coords ? coords[i * 2 + 1] : points[i].y;
        let d = `M${x(0)} ${y(0)}`;
        if (points.length === 1) return `${d}L${x(0)} ${y(0)}`;
        if (!coords) {
            for (let i = 1; i < points.length; i++) d += `L${x(i)} ${y(i)}`;
            return d;
        }
        for (let i = 1; i < points.length - 1; i++) {
            d += `Q${x(i)} ${y(i)} ${svgNumber((xs(i) + xs(i + 1)) / 2)} ${svgNumber((ys(i) + ys(i + 1)) / 2)}`;
        }
        return `${d}L${x(points.length - 1)} ${y(points.length - 1)}`;
    }

    function shapeToSvg(shape) {
        const opacity = getShapeOpacity(shape);
        const opacityAttribute = opacity < 1 ? ` opacity="${svgNumber(opacity)}"` : "";
        const degrees = svgNumber((shape.rotation || 0) * 180 / Math.PI);
        const place = (x, y) => ` transform="translate(${svgNumber(x)} ${svgNumber(y)}) rotate(${degrees})"`;

        if (shape.type === "stroke") {
            const bounds = getShapeBounds(shape);
            if (!bounds || !shape.points.length) return "";
            const rotate = shape.rotation
                ? ` transform="rotate(${degrees} ${svgNumber(bounds.x)} ${svgNumber(bounds.y)})"`
                : "";
            return `<path d="${svgStrokePath(shape)}" fill="none" stroke="${escapeXml(shape.color || "#000000")}"` +
                ` stroke-width="${svgNumber(shape.width)}" stroke-linecap="round" stroke-linejoin="round"` +
                `${svgDashAttributes(shape, shape.width, true)}${opacityAttribute}${rotate}/>`;
        }

        if (shape.type === "rect" || shape.type === "circle") {
            const fill = shape.fillColor ? escapeXml(shape.fillColor) : "none";
            const paint = ` fill="${fill}" stroke="${escapeXml(shape.strokeColor || "#000000")}"` +
                ` stroke-width="${svgNumber(shape.strokeWidth)}"${svgDashAttributes(shape, shape.strokeWidth)}`;
            if (shape.type === "circle") {
                return `<ellipse cx="0" cy="0" rx="${svgNumber(shape.rx)}" ry="${svgNumber(shape.ry)}"` +
                    `${paint}${opacityAttribute}${place(shape.x, shape.y)}/>`;
            }
            const radius = Math.min(getCornerRadius(shape), shape.width / 2, shape.height / 2);
            const corners = radius > 0 ? ` rx="${svgNumber(radius)}" ry="${svgNumber(radius)}"` : "";
            return `<rect x="${svgNumber(-shape.width / 2)}" y="${svgNumber(-shape.height / 2)}"` +
                ` width="${svgNumber(shape.width)}" height="${svgNumber(shape.height)}"${corners}` +
                `${paint}${opacityAttribute}${place(shape.x, shape.y)}/>`;
        }

        if (isSegmentShape(shape)) {
            const half = (shape.length || 0) / 2;
            const color = escapeXml(shape.strokeColor || "#000000");
            const headStyle = shape.type === "arrow" ? getArrowHeadStyle(shape) : null;
            const hasStartHead = headStyle === "start" || headStyle === "both";
            const hasEndHead = headStyle === "end" || headStyle === "both";
            const headLength = getArrowHeadLength(shape);
            const parts = [
                `<line x1="${svgNumber(-half + (hasStartHead ? headLength : 0))}" y1="0"` +
                ` x2="${svgNumber(half - (hasEndHead ? headLength : 0))}" y2="0" stroke="${color}"` +
                ` stroke-width="${svgNumber(shape.strokeWidth)}" stroke-linecap="round"` +
                `${svgDashAttributes(shape, shape.strokeWidth, true)}/>`,
            ];
            const head = (direction) => {
                const tip = half * direction;
                const base = tip - headLength * direction;
                return `<polygon points="${svgNumber(tip)},0 ${svgNumber(base)},${svgNumber(headLength / 2)}` +
                    ` ${svgNumber(base)},${svgNumber(-headLength / 2)}" fill="${color}"/>`;
            };
            if (hasStartHead) parts.push(head(-1));
            if (hasEndHead) parts.push(head(1));
            return `<g${opacityAttribute}${place(shape.x, shape.y)}>${parts.join("")}</g>`;
        }

        if (shape.type === "text") {
            const metrics = measureTextBlock(shape.text, shape.fontSize);
            const halfWidth = metrics.width / 2;
            const halfHeight = metrics.height / 2;
            const baseline = getTextBaselineOffset(shape.fontSize);
            const background = shape.fillColor
                ? `<rect x="${svgNumber(-halfWidth)}" y="${svgNumber(-halfHeight)}" width="${svgNumber(metrics.width)}"` +
                  ` height="${svgNumber(metrics.height)}" fill="${escapeXml(shape.fillColor)}"/>`
                : "";
            const lines = metrics.lines.map((line, index) =>
                `<tspan x="${svgNumber(-halfWidth)}" y="${svgNumber(-halfHeight + index * metrics.lineHeight + baseline)}">` +
                `${escapeXml(line)}</tspan>`).join("");
            return `<g${opacityAttribute}${place(shape.x + halfWidth, shape.y + halfHeight)}>${background}` +
                `<text font-family="sans-serif" font-size="${svgNumber(shape.fontSize)}"` +
                ` fill="${escapeXml(shape.color || "#000000")}" xml:space="preserve">${lines}</text></g>`;
        }

        if (shape.type === "image") {
            // A nested <svg> whose viewBox is the crop window, over the image
            // stretched to a 1×1 square, shows exactly the cropped part.
            const crop = getImageCrop(shape);
            return `<g${opacityAttribute}${place(shape.x, shape.y)}>` +
                `<svg x="${svgNumber(-shape.width / 2)}" y="${svgNumber(-shape.height / 2)}"` +
                ` width="${svgNumber(shape.width)}" height="${svgNumber(shape.height)}"` +
                ` viewBox="${crop.x} ${crop.y} ${crop.width} ${crop.height}" preserveAspectRatio="none">` +
                `<image width="1" height="1" preserveAspectRatio="none" xlink:href="${escapeXml(shape.src)}"/>` +
                `</svg></g>`;
        }
        return "";
    }

    function buildSvgDocument({ padding = 0, background = null, shapeList = shapes } = {}) {
        const extent = getShapesWorldExtent(shapeList);
        if (!extent) return null;
        const pad = Number.isFinite(padding) ? Math.max(0, padding) : 0;
        const x = extent.minX - pad;
        const y = extent.minY - pad;
        const width = extent.maxX - extent.minX + pad * 2;
        const height = extent.maxY - extent.minY + pad * 2;
        const parts = [
            `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"` +
            ` width="${svgNumber(width)}" height="${svgNumber(height)}"` +
            ` viewBox="${svgNumber(x)} ${svgNumber(y)} ${svgNumber(width)} ${svgNumber(height)}">`,
        ];
        if (background) {
            parts.push(`<rect x="${svgNumber(x)}" y="${svgNumber(y)}" width="${svgNumber(width)}"` +
                ` height="${svgNumber(height)}" fill="${escapeXml(background)}"/>`);
        }
        for (const shape of shapeList) {
            const markup = shapeToSvg(shape);
            if (markup) parts.push(markup);
        }
        parts.push("</svg>");
        return `<?xml version="1.0" encoding="UTF-8"?>\n${parts.join("\n")}\n`;
    }

    // Remembers the transparency choice across formats that cannot keep it:
    // picking JPEG forces a solid background, but going back to PNG should not.
    let saveImageWantsTransparency = true;

    function isSaveImageDialogOpen() {
        return !saveImageBackdrop.hidden;
    }

    function getSaveImageBackground() {
        const spec = getImageFormat(saveImageFormatSelect.value);
        if (spec.transparency && saveImageTransparentInput.checked) return null;
        return saveImageBgColorInput.value;
    }

    function updateSaveImageDialog() {
        const spec = getImageFormat(saveImageFormatSelect.value);
        saveImageTransparentInput.disabled = !spec.transparency;
        saveImageTransparentInput.checked = spec.transparency && saveImageWantsTransparency;
        saveImageBgColorInput.disabled = saveImageTransparentInput.checked;

        // Resolution means nothing for a vector file.
        saveImageScaleSelect.disabled = !!spec.vector;

        const padding = Number(saveImagePaddingInput.value);
        const size = getSaveImageSize(padding, spec.vector ? 1 : Number(saveImageScaleSelect.value));
        saveImageConfirmButton.disabled = !size;
        if (!size) {
            saveImageNote.textContent = "Nothing drawn yet.";
        } else if (spec.vector) {
            saveImageNote.textContent = `Output: vector, ${size.width} × ${size.height} px at 100%`;
        } else if (saveImageFormatSelect.value === "pdf") {
            const pageWidth = Math.round(size.width / size.scale * 0.75);
            const pageHeight = Math.round(size.height / size.scale * 0.75);
            saveImageNote.textContent =
                `Output: one ${pageWidth} × ${pageHeight} pt page, drawn at ${size.scale}×`;
        } else {
            saveImageNote.textContent = `Output: ${size.width} × ${size.height} px at ${size.scale}×`;
        }
    }

    function openSaveImageDialog() {
        closeSaveMenu();
        // Measure what will actually be saved: text still being typed, and an
        // open crop, are not part of the drawing until they are committed.
        commitCurrentTextEditor();
        applyImageCrop();
        updateSaveImageDialog();
        saveImageBackdrop.hidden = false;
        saveImageNameInput.focus();
        saveImageNameInput.select();
    }

    function closeSaveImageDialog() {
        saveImageBackdrop.hidden = true;
    }

    saveImageButton.addEventListener("click", openSaveImageDialog);
    saveImageCancelButton.addEventListener("click", closeSaveImageDialog);
    saveImageFormatSelect.addEventListener("change", updateSaveImageDialog);
    saveImagePaddingInput.addEventListener("input", updateSaveImageDialog);
    saveImageScaleSelect.addEventListener("change", updateSaveImageDialog);
    saveImageTransparentInput.addEventListener("change", () => {
        saveImageWantsTransparency = saveImageTransparentInput.checked;
        updateSaveImageDialog();
    });

    // A click that starts and ends on the backdrop itself dismisses the dialog;
    // one that merely drags out of the panel does not.
    saveImageBackdrop.addEventListener("mousedown", (e) => {
        if (e.target === saveImageBackdrop) closeSaveImageDialog();
    });

    saveImageDialog.addEventListener("submit", (e) => {
        e.preventDefault();
        const saved = saveImage({
            padding: Number(saveImagePaddingInput.value),
            scale: Number(saveImageScaleSelect.value),
            format: saveImageFormatSelect.value,
            background: getSaveImageBackground(),
            fileName: saveImageNameInput.value,
        });
        if (saved) closeSaveImageDialog();
        else updateSaveImageDialog();
    });

    // Export JSON
    exportJsonButton.addEventListener("click", () => {
        closeSaveMenu();
        applyImageCrop();
        const data = JSON.stringify({ shapes, camera }, null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "drawing.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    // Carry over the optional style properties that are valid for the shape,
    // leaving them out when they hold their defaults.
    function copyImportedStyle(source, shape) {
        const opacity = Number(source.opacity);
        if (Number.isFinite(opacity) && opacity < 1) shape.opacity = Math.max(MIN_OPACITY, opacity);
        if (isDashableShape(shape) && DASH_STYLES.includes(source.dash) && source.dash !== "solid") {
            shape.dash = source.dash;
        }
        const radius = Number(source.cornerRadius);
        if (shape.type === "rect" && Number.isFinite(radius) && radius > 0) shape.cornerRadius = radius;
        const smoothing = Number(source.smoothing);
        if (shape.type === "stroke" && Number.isFinite(smoothing) && smoothing > 0) {
            shape.smoothing = Math.min(100, smoothing);
        }
        return shape;
    }

    function normalizeImportedDrawing(data) {
        if (!data || typeof data !== "object" || !Array.isArray(data.shapes)) {
            throw new Error("The file does not contain a drawing with a shapes array.");
        }

        const finite = (value, fallback = 0) => Number.isFinite(value) ? value : fallback;
        const positive = (value, fallback) => Number.isFinite(value) && value > 0 ? value : fallback;
        const normalizedShapes = data.shapes.map((shape, index) => {
            if (!shape || typeof shape !== "object" || typeof shape.type !== "string") {
                throw new Error(`Shape ${index + 1} is invalid.`);
            }

            if (shape.type === "stroke") {
                if (!Array.isArray(shape.points) || shape.points.length === 0 ||
                    shape.points.some(point => !Number.isFinite(point?.x) || !Number.isFinite(point?.y))) {
                    throw new Error(`Stroke ${index + 1} has invalid points.`);
                }
                return {
                    type: "stroke",
                    points: shape.points.map(point => ({ x: point.x, y: point.y })),
                    color: typeof shape.color === "string" ? shape.color : "#000000",
                    width: positive(shape.width, 2),
                    rotation: finite(shape.rotation),
                };
            }

            if (shape.type === "text") {
                if (typeof shape.text !== "string") throw new Error(`Text shape ${index + 1} is invalid.`);
                return {
                    type: "text",
                    x: finite(shape.x),
                    y: finite(shape.y),
                    text: shape.text,
                    fontSize: positive(shape.fontSize, 20),
                    color: typeof shape.color === "string" ? shape.color : "#000000",
                    fillColor: typeof shape.fillColor === "string" ? shape.fillColor : null,
                    rotation: finite(shape.rotation),
                };
            }

            const common = {
                type: shape.type,
                x: finite(shape.x),
                y: finite(shape.y),
                rotation: finite(shape.rotation),
            };
            if (shape.type === "rect") {
                return {
                    ...common,
                    width: positive(shape.width, 10),
                    height: positive(shape.height, 10),
                    strokeColor: typeof shape.strokeColor === "string" ? shape.strokeColor : "#000000",
                    fillColor: typeof shape.fillColor === "string" ? shape.fillColor : null,
                    strokeWidth: positive(shape.strokeWidth, 2),
                };
            }
            if (shape.type === "circle") {
                return {
                    ...common,
                    rx: positive(shape.rx ?? shape.radius, 5),
                    ry: positive(shape.ry ?? shape.radius, 5),
                    strokeColor: typeof shape.strokeColor === "string" ? shape.strokeColor : "#000000",
                    fillColor: typeof shape.fillColor === "string" ? shape.fillColor : null,
                    strokeWidth: positive(shape.strokeWidth, 2),
                };
            }
            if (shape.type === "arrow" || shape.type === "line") {
                const segment = {
                    ...common,
                    length: positive(shape.length, 10),
                    strokeColor: typeof shape.strokeColor === "string" ? shape.strokeColor : "#000000",
                    strokeWidth: positive(shape.strokeWidth, 2),
                };
                if (shape.type === "arrow") segment.arrowHead = getArrowHeadStyle(shape);
                return segment;
            }
            if (shape.type === "image") {
                if (typeof shape.src !== "string" || !shape.src) {
                    throw new Error(`Image shape ${index + 1} has no image data.`);
                }
                const imageShape = {
                    ...common,
                    width: positive(shape.width, 10),
                    height: positive(shape.height, 10),
                    src: shape.src,
                };
                const crop = sanitizeCrop(shape.crop);
                if (crop) imageShape.crop = crop;
                return imageShape;
            }
            throw new Error(`Shape ${index + 1} uses unsupported type "${shape.type}".`);
        }).map((shape, index) => copyImportedStyle(data.shapes[index], shape));

        const importedCamera = data.camera && typeof data.camera === "object" ? data.camera : {};
        return {
            shapes: normalizedShapes,
            camera: {
                x: finite(importedCamera.x),
                y: finite(importedCamera.y),
                scale: Math.max(MIN_SCALE, Math.min(MAX_SCALE, positive(importedCamera.scale, 1))),
            },
        };
    }

    importJsonButton.addEventListener("click", () => {
        closeSaveMenu();
        jsonFileInput.click();
    });

    // Open a drawing exported as JSON, from Import JSON or dropped on the canvas.
    async function importDrawingFile(file) {
        try {
            const imported = normalizeImportedDrawing(JSON.parse(await file.text()));
            if (!await autosaveIfDirty(true)) return;

            cancelImageCrop();
            destroyTextEditor();
            shapes = imported.shapes;
            camera = imported.camera;
            clearSelection();
            currentAutosaveName = null; // a different drawing gets its own autosave
            resetHistory();
            pushHistory();

            const baseName = file.name.replace(/\.json$/i, "") || "Imported drawing";
            currentSaveName = isAutosaveName(baseName) ? `Imported ${baseName}` : baseName;
            switchToSelectTool();
            render();
        } catch (error) {
            alert(`The drawing could not be imported. ${error.message || "Invalid JSON file."}`);
        }
    }

    jsonFileInput.addEventListener("change", async () => {
        const file = jsonFileInput.files?.[0];
        if (!file) return;
        try {
            await importDrawingFile(file);
        } finally {
            jsonFileInput.value = "";
        }
    });
