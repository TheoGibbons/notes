            const { changed, originals } = groupTransform;
            groupTransform = null;
            if (changed && cancelDrawing) {
                // Escape mid-drag puts the group back where it started.
                for (const { shape, geometry } of originals) {
                    if (shape.type === "stroke") {
                        geometry.points.forEach((p, i) => {
                            shape.points[i].x = p.x;
                            shape.points[i].y = p.y;
                        });
                        shape.rotation = geometry.rotation;
                    } else {
                        const { points, center, ...fields } = geometry;
                        for (const [key, value] of Object.entries(fields)) {
                            if (value !== undefined && key in shape) shape[key] = value;
                        }
                    }
                }
            } else if (changed) {
                pushHistory();
            }
            render();
        }

        isDrawing = false;
        lastEraserWorld = null;
        resizeStartPoints = null;
        isPanning = false;
        isDraggingSelection = false;
        collapseSelectionTo = null;
        isResizing = false;
        isRotating = false;
        currentStroke = null;
        draftShape = null;
        drawingStartWorld = null;
        dragStartWorld = null;
        originalShapeData = null;
        originalBounds = null;
        rotationCenter = null;
        activeHandle = null;
        eraseChanged = false;
        moveChanged = false;
        resizeChanged = false;
        rotateChanged = false;

        updateCanvasCursor();
    }

    // Mouse handling
    canvas.addEventListener("mousedown", (e) => {
        closeContextMenu();
        // On a Mac, Ctrl+click is a right-click: leave it to the context menu.
        if (IS_MAC && e.ctrlKey && e.button === 0) return;
        commitCurrentTextEditor();
        lastPointerClient = { x: e.clientX, y: e.clientY };

        // Middle mouse: always pan
        if (e.button === 1) {
            e.preventDefault();
            beginPan(e.clientX, e.clientY);
            return;
        }

        // Only handle left button for drawing/selecting
        if (e.button !== 0) return;

        const world = screenToWorld(e.clientX, e.clientY);
        // Ctrl/Cmd or Shift extends the selection instead of replacing it.
        const addToSelection = e.ctrlKey || e.metaKey || e.shiftKey;
        handlePrimaryDownAtWorld(world, e.clientX, e.clientY, addToSelection, e.shiftKey);
    });

    function hasActiveMouseInteraction() {
        return isDrawing || isPanning || isDraggingSelection || isResizing ||
            isRotating || isMarqueeSelecting || Boolean(cropDragHandle) || Boolean(groupTransform);
    }

    // Tracked on the window so a drag keeps following the mouse when it leaves
    // the canvas (or the browser window) and only ends on a real mouse up.
    window.addEventListener("mousemove", (e) => {
        lastPointerClient = { x: e.clientX, y: e.clientY };
        pointerOverCanvas = e.target === canvas;
        if (currentTool === "eraser") updateEraserCursor();
        if (!hasActiveMouseInteraction()) return;

        // The button was released outside the window: end the interaction
        // instead of resuming it when the mouse comes back.
        if (e.buttons === 0) {
            stopAllInteractions();
            return;
        }

        const world = screenToWorld(e.clientX, e.clientY);
        handlePointerMove(world, e.clientX, e.clientY, e.shiftKey);
    });

    window.addEventListener("mouseup", () => {
        if (!hasActiveMouseInteraction()) return;
        stopAllInteractions();
        updateEraserCursor();
    });

    canvas.addEventListener("mouseleave", () => {
        pointerOverCanvas = false;
        updateEraserCursor();
    });

    // Pressing or releasing Shift mid-drag re-applies the constraint at once,
    // without waiting for the mouse to move.
    function refreshConstrainedDrag(shiftKey) {
        if (!lastPointerClient) return;
        const constrainable = (isDrawing && draftShape) || isResizing || isRotating || groupTransform;
        if (!constrainable) return;
        const { x, y } = lastPointerClient;
        handlePointerMove(screenToWorld(x, y), x, y, shiftKey);
    }
    window.addEventListener("keydown", (e) => {
        if (e.key === "Shift" && !e.repeat) refreshConstrainedDrag(true);
    });
    window.addEventListener("keyup", (e) => {
        if (e.key === "Shift") refreshConstrainedDrag(false);
    });

    // --- Zoom ---------------------------------------------------------------
    const ZOOM_STEP = 1.2;          // buttons and Ctrl/Cmd +/−
    const WHEEL_ZOOM_STEP = 1.1;    // one notch of a mouse wheel
    const PINCH_ZOOM_SPEED = 0.01;  // trackpad pinch, per unit of deltaY

    function repositionTextEditor() {
        if (currentTextEditor) positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
    }

    // Zoom to `nextScale`, keeping the world point under (screenX, screenY) —
    // canvas pixels, the view's centre by default — where it is.
    function setZoom(nextScale, screenX = viewWidth / 2, screenY = viewHeight / 2) {
        const scale = camera.scale || 1;
        const clamped = Math.max(MIN_SCALE, Math.min(MAX_SCALE, nextScale));
        const worldX = camera.x + screenX / scale;
        const worldY = camera.y + screenY / scale;
        camera.scale = clamped;
        camera.x = worldX - screenX / clamped;
        camera.y = worldY - screenY / clamped;
        closeContextMenu();
        render();
        repositionTextEditor();
    }

    function zoomBy(factor, screenX, screenY) {
        setZoom((camera.scale || 1) * factor, screenX, screenY);
    }

    function updateZoomLabel() {
        const label = `${Math.round((camera.scale || 1) * 100)}%`;
        if (zoomResetButton.textContent !== label) zoomResetButton.textContent = label;
    }

    zoomInButton.addEventListener("click", () => zoomBy(ZOOM_STEP));
    zoomOutButton.addEventListener("click", () => zoomBy(1 / ZOOM_STEP));
    zoomResetButton.addEventListener("click", () => setZoom(1));
    zoomFitButton.addEventListener("click", () => zoomToFitShapes());

    // A notched mouse wheel zooms a step at a time. Trackpads send a stream
    // of small, often diagonal, deltas: two fingers pan and a pinch (which
    // browsers report as Ctrl+wheel) zooms smoothly.
    function looksLikeMouseWheel(e) {
        if (e.deltaMode !== 0) return true;            // whole lines or pages (Firefox)
        if (e.deltaX !== 0) return false;              // sideways movement: a trackpad
        const legacyDelta = e.wheelDeltaY;
        if (typeof legacyDelta === "number" && legacyDelta !== 0) {
            if (legacyDelta === -3 * e.deltaY) return false; // macOS trackpad (Chrome, Safari)
            return legacyDelta % 120 === 0;            // wheel notches come in steps of 120
        }
        return Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 50;
    }

    // One gesture produces many events; classify the first and stick with it,
    // so a stray event mid-swipe can't flip a pan into a zoom.
    let lastWheelGesture = { time: 0, isMouse: false };
    let safariGestureStartScale = null;

    canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        closeContextMenu();

        const now = performance.now();
        const continuing = now - lastWheelGesture.time < 150;
        const isMouse = continuing ? lastWheelGesture.isMouse : looksLikeMouseWheel(e);
        lastWheelGesture = { time: now, isMouse };

        const rect = getCanvasRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;

        if (isMouse) {
            if (e.deltaY === 0) return;
            zoomBy(e.deltaY < 0 ? WHEEL_ZOOM_STEP : 1 / WHEEL_ZOOM_STEP, sx, sy);
            return;
        }

        if (e.ctrlKey || e.metaKey) {
            // Safari reports pinches as gesture events, handled below.
            if (safariGestureStartScale !== null) return;
            const factor = Math.min(2, Math.max(0.5, Math.exp(-e.deltaY * PINCH_ZOOM_SPEED)));
            zoomBy(factor, sx, sy);
            return;
        }

        let dx = e.deltaX;
        let dy = e.deltaY;
        if (e.shiftKey && dx === 0) {
            dx = dy;
            dy = 0;
        }
        const scale = camera.scale || 1;
        camera.x += dx / scale;
        camera.y += dy / scale;
        render();
        repositionTextEditor();
    }, { passive: false });

    // Safari's trackpad pinch.
    canvas.addEventListener("gesturestart", (e) => {
        e.preventDefault();
        safariGestureStartScale = camera.scale || 1;
    });
    canvas.addEventListener("gesturechange", (e) => {
        e.preventDefault();
        if (safariGestureStartScale === null) return;
        const rect = getCanvasRect();
        setZoom(safariGestureStartScale * e.scale, e.clientX - rect.left, e.clientY - rect.top);
    });
    canvas.addEventListener("gestureend", (e) => {
        e.preventDefault();
        safariGestureStartScale = null;
    });

    // Touch helpers
    function distanceTouches(t1, t2) {
        const dx = t2.clientX - t1.clientX;
        const dy = t2.clientY - t1.clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // Touch handling (mobile)
    canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        commitCurrentTextEditor();

        const touches = e.touches;
        if (touches.length === 2) {
            // Start pinch zoom
            isPinching = true;
            isDrawing = false;
            isPanning = false;
            isDraggingSelection = false;
            endMarquee(true);   // a second finger means zoom, not selection

            const t1 = touches[0];
            const t2 = touches[1];
            pinchStartDistance = distanceTouches(t1, t2);
            pinchStartScale = camera.scale || 1;

            const centerX = (t1.clientX + t2.clientX) / 2;
            const centerY = (t1.clientY + t2.clientY) / 2;
            pinchCenterWorld = screenToWorld(centerX, centerY);
            return;
        }

        if (touches.length === 1) {
            const t = touches[0];
            const world = screenToWorld(t.clientX, t.clientY);

            // If hand tool, treat single finger as pan
            if (currentTool === "hand") {
                beginPan(t.clientX, t.clientY);
            } else {
                handlePrimaryDownAtWorld(world, t.clientX, t.clientY, false, false, true);
            }
        }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const touches = e.touches;

        if (isPinching && touches.length === 2) {
            const t1 = touches[0];
            const t2 = touches[1];
            const currentDistance = distanceTouches(t1, t2);
            if (pinchStartDistance <= 0) return;

            let newScale = pinchStartScale * (currentDistance / pinchStartDistance);
            newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
            camera.scale = newScale;

            // Keep the pinch center world point under the midpoint of the two fingers
            const centerX = (t1.clientX + t2.clientX) / 2;
            const centerY = (t1.clientY + t2.clientY) / 2;
            camera.x = pinchCenterWorld.x - (centerX - getCanvasRect().left) / newScale;
            camera.y = pinchCenterWorld.y - (centerY - getCanvasRect().top) / newScale;

            render();
            if (currentTextEditor) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
            return;
        }

        if (touches.length === 1) {
            const t = touches[0];
            const world = screenToWorld(t.clientX, t.clientY);
            handlePointerMove(world, t.clientX, t.clientY);
        }
    }, { passive: false });

    canvas.addEventListener("touchend", (e) => {
        e.preventDefault();
        const touches = e.touches;
        if (touches.length < 2) {
            isPinching = false;
        }
        if (touches.length === 0) {
            stopAllInteractions();
        }
    }, { passive: false });

    canvas.addEventListener("touchcancel", (e) => {
        e.preventDefault();
        isPinching = false;
        stopAllInteractions();
    }, { passive: false });

    // Double-click to edit text or crop an image (desktop)
    canvas.addEventListener("dblclick", (e) => {
        if (cropSession) return;

        const world = screenToWorld(e.clientX, e.clientY);
        const shape = hitTestShapes(world.x, world.y);
        if (!shape) return;

        if (shape.type === "image") {
            beginImageCrop(shape);
            return;
        }
        if (shape.type !== "text") return;

        setSelection([shape]);
        updateControlVisibility();
        render();
        showTextEditor(shape);
    });

    // --- Image import ---
    insertImageButton.addEventListener("click", () => {
        applyImageCrop();
        imageFileInput.click();
    });

    function loadImageSource(src, onLoad) {
        const cached = imageCache.get(src);
        if (cached) {
            if (cached.loaded && cached.img) onLoad(cached.img);
            else if (!cached.error) cached.callbacks.push(onLoad);
            return;
        }

        const img = new Image();
        const entry = { img, loaded: false, error: false, callbacks: [onLoad] };
        imageCache.set(src, entry);
        img.onload = () => {
            entry.loaded = true;
            const callbacks = entry.callbacks.splice(0);
            callbacks.forEach(callback => callback(img));
        };
        img.onerror = () => {
            entry.img = null;
            entry.error = true;
            entry.callbacks.length = 0;
        };
        img.src = src;
    }

    function addImageSource(src, placementWorld = null) {
        loadImageSource(src, (img) => {
            applyImageCrop();
            const baseScale = camera.scale || 1;
            // Size the image as if the view were at its initial 100% zoom, so the
            // same picture always lands at the same size on the page no matter how
            // far the view happens to be zoomed in or out.
            const maxDimension = Math.min(viewWidth, viewHeight) * 0.5;
            const aspect = img.naturalWidth / img.naturalHeight;
            let width;
            let height;
            if (aspect >= 1) {
                width = maxDimension;
                height = maxDimension / aspect;
            } else {
                height = maxDimension;
                width = maxDimension * aspect;
            }

            const shape = {
                type: "image",
                x: Number.isFinite(placementWorld?.x)
                    ? placementWorld.x
                    : camera.x + (viewWidth / 2) / baseScale,
                y: Number.isFinite(placementWorld?.y)
                    ? placementWorld.y
                    : camera.y + (viewHeight / 2) / baseScale,
                width,
                height,
                rotation: 0,
                src,
            };
            shapes.push(shape);
            setSelection([shape]);
            pushHistory();
            switchToSelectTool();
            // Match the spacebar shortcut for the first object added to an
            // empty scene. Later images keep the current camera unchanged.
            if (shapes.length === 1) zoomToFitShapes();
            else render();
        });
    }

    function addImageBlob(blob, placementWorld = null) {
        if (!blob || !blob.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = () => addImageSource(reader.result, placementWorld);
        reader.readAsDataURL(blob);
    }

    imageFileInput.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        addImageBlob(file);
        // Clear the input so the same file can be chosen again later.
        imageFileInput.value = "";
    });

    window.addEventListener("paste", (e) => {
        const target = e.target;
        if (target instanceof HTMLInputElement ||
            target instanceof HTMLTextAreaElement ||
            target?.isContentEditable) return;

        const items = Array.from(e.clipboardData?.items || []);
        const imageItem = items.find(item => item.kind === "file" && item.type.startsWith("image/"));
        const imageFile = imageItem?.getAsFile() ||
            Array.from(e.clipboardData?.files || []).find(file => file.type.startsWith("image/"));
        const text = e.clipboardData?.getData("text/plain") || "";
        const at = getPasteTarget();
        const clip = shapeClipboard;

        // Nothing else can have been copied while the page kept focus, so the
        // clipboard still holds our own copy: paste the shapes.
        if (clip && !clip.maybeStale) {
            e.preventDefault();
            pasteShapes(clip.shapes, at);
        } else if (imageFile) {
            e.preventDefault();
            pasteClipboardImage(imageFile, at);
        } else if (text.trim()) {
            e.preventDefault();
            pasteText(text, at);
        } else if (clip) {
            e.preventDefault();
            pasteShapes(clip.shapes, at);
        }
    });

    // Drag and drop: an image is added where it lands; a drawing exported as
    // JSON is opened in place of the current one.
    function isJsonFile(file) {
        return file.type === "application/json" || /\.json$/i.test(file.name || "");
    }

    function getDroppedFile(dataTransfer) {
        const files = Array.from(dataTransfer?.files || []);
        return files.find(file => file.type.startsWith("image/")) || files.find(isJsonFile) || null;
    }

    // While dragging, only the type is known (and it may be blank for .json).
    function mayBeDroppableFile(dataTransfer) {
        return Array.from(dataTransfer?.items || []).some(item => item.kind === "file" &&
            (item.type.startsWith("image/") || item.type === "application/json" || item.type === ""));
    }

    canvas.addEventListener("dragover", (e) => {
        if (!mayBeDroppableFile(e.dataTransfer)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
        canvas.classList.add("image-drop-target");
    });

    canvas.addEventListener("dragleave", () => {
        canvas.classList.remove("image-drop-target");
    });

    canvas.addEventListener("drop", (e) => {
        canvas.classList.remove("image-drop-target");
        const file = getDroppedFile(e.dataTransfer);
        if (!file) return;
        e.preventDefault();
        if (file.type.startsWith("image/")) addImageBlob(file, screenToWorld(e.clientX, e.clientY));
        else importDrawingFile(file);
    });

    // --- Right-click menu ----------------------------------------------------
    let contextMenuWorld = null; // where the menu was opened, for Paste

    function isContextMenuOpen() {
        return !contextMenu.hidden;
    }

    function closeContextMenu() {
        if (contextMenu.hidden) return;
        contextMenu.hidden = true;
        contextMenu.textContent = "";
    }

    function getContextMenuItems() {
        const hasSelection = selectedShapes.length > 0;
        const canPaste = !!shapeClipboard || !!navigator.clipboard?.read || !!navigator.clipboard?.readText;
        const mod = MOD_KEY_LABEL;
        return [
            { label: "Cut", shortcut: `${mod}+X`, enabled: hasSelection, run: cutSelection },
            { label: "Copy", shortcut: `${mod}+C`, enabled: hasSelection, run: copySelection },
            { label: "Paste", shortcut: `${mod}+V`, enabled: canPaste, run: () => pasteFromMenu(contextMenuWorld) },
            { label: "Duplicate", shortcut: `${mod}+D`, enabled: hasSelection, run: duplicateSelectedShapes },
            { label: "Delete", shortcut: IS_MAC ? "⌫" : "Del", enabled: hasSelection, run: deleteSelectedShapes },
            null,
            {
                label: "Bring to Front", enabled: hasSelection && !bringToFrontButton.disabled,
                run: () => moveSelectionToStackEnd(true),
            },
            {
                label: "Send to Back", enabled: hasSelection && !sendToBackButton.disabled,
                run: () => moveSelectionToStackEnd(false),
            },
            null,
            { label: "Select All", shortcut: `${mod}+A`, enabled: shapes.length > 0, run: selectAllShapes },
            { label: "Zoom to Fit", shortcut: "Space", enabled: shapes.length > 0, run: zoomToFitShapes },
            { label: "Keyboard Shortcuts", shortcut: "?", enabled: true, run: openHelp },
        ];
    }

    function openContextMenu(clientX, clientY) {
        contextMenu.textContent = "";
        for (const item of getContextMenuItems()) {
            if (!item) {
                const separator = document.createElement("div");
                separator.className = "menu-separator";
                separator.setAttribute("role", "separator");
                contextMenu.appendChild(separator);
                continue;
            }
            const button = document.createElement("button");
            button.type = "button";
            button.setAttribute("role", "menuitem");
            button.disabled = !item.enabled;
            const label = document.createElement("span");
            label.textContent = item.label;
            button.appendChild(label);
            if (item.shortcut) {
                const shortcut = document.createElement("span");
                shortcut.className = "shortcut";
                shortcut.textContent = item.shortcut;
                button.appendChild(shortcut);
            }
            button.addEventListener("click", () => {
                closeContextMenu();
                item.run();
            });
            contextMenu.appendChild(button);
        }

        contextMenu.hidden = false;
        // Open at the pointer, but keep the whole menu on screen.
        const { width, height } = contextMenu.getBoundingClientRect();
        contextMenu.style.left = `${Math.max(4, Math.min(clientX, window.innerWidth - width - 4))}px`;
        contextMenu.style.top = `${Math.max(4, Math.min(clientY, window.innerHeight - height - 4))}px`;
        contextMenu.querySelector("button:not(:disabled)")?.focus({ preventScroll: true });
    }

    function handleContextMenuKey(e) {
        const items = Array.from(contextMenu.querySelectorAll("button:not(:disabled)"));
        const index = items.indexOf(document.activeElement);
        if (e.key === "Escape" || e.key === "Tab") {
            e.preventDefault();
            closeContextMenu();
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            items[(index + 1) % items.length]?.focus();
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            items[index <= 0 ? items.length - 1 : index - 1]?.focus();
        } else if (e.key === "Home" || e.key === "End") {
            e.preventDefault();
            items[e.key === "Home" ? 0 : items.length - 1]?.focus();
        }
        // Enter and Space activate the focused item as ordinary button presses.
    }

    canvas.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        if (cropSession || hasActiveMouseInteraction()) return;
        commitCurrentTextEditor();
        const world = screenToWorld(e.clientX, e.clientY);
        contextMenuWorld = world;
        lastPointerClient = { x: e.clientX, y: e.clientY };

        // Right-clicking an item acts on it; inside the current selection's
        // box acts on the selection; anywhere else starts with nothing selected.
        const hit = hitTestShapes(world.x, world.y);
        if (hit) {
            if (!isShapeSelected(hit)) setSelection([hit]);
        } else {
            const extent = getShapesWorldExtent(selectedShapes);
            const insideSelection = extent && world.x >= extent.minX && world.x <= extent.maxX &&
                world.y >= extent.minY && world.y <= extent.maxY;
            if (!insideSelection) clearSelection();
        }
        updateControlVisibility();
        render();
        openContextMenu(e.clientX, e.clientY);
    });

    document.addEventListener("pointerdown", (e) => {
        if (isContextMenuOpen() && !contextMenu.contains(e.target)) closeContextMenu();
    });
    window.addEventListener("blur", closeContextMenu);
    window.addEventListener("resize", closeContextMenu);

    // --- Keyboard shortcuts dialog --------------------------------------------
    function getShortcutGroups() {
        const mod = MOD_KEY_LABEL;
        return [
            {
                title: "Tools",
                rows: [
                    ["P", "Pen"], ["T", "Text"], ["R", "Rectangle"], ["C", "Circle"],
                    ["A", "Arrow"], ["L", "Line"], ["I", "Insert an image"], ["E", "Eraser"],
                    ["V", "Select / Move"], ["H", "Hand / Pan"],
                ],
            },
            {
                title: "Editing",
                rows: [
                    [`${mod}+Z`, "Undo"],
                    [`${mod}+Shift+Z / ${mod}+Y`, "Redo"],
                    [`${mod}+C`, "Copy (other apps get a picture)"],
                    [`${mod}+X`, "Cut"],
                    [`${mod}+V`, "Paste shapes, an image or text"],
                    [`${mod}+D`, "Duplicate"],
                    [IS_MAC ? "⌫" : "Delete / Backspace", "Delete the selection"],
                    [`${mod}+A`, "Select everything"],
                    ["←↑→↓", "Nudge (with Shift: 10 px)"],
                    ["Esc", "Deselect, then switch to Select"],
                    [`${mod}+Enter`, "Finish editing text"],
                ],
            },
            {
                title: "Mouse and trackpad",
                rows: [
                    [`${mod}+click`, "Add to or remove from the selection"],
                    ["Shift+drag", "Square, circle, or a 15° line or arrow"],
                    ["Shift+rotate", "Rotate in 15° steps"],
                    ["Shift+resize", "Keep proportions"],
                    ["Right-click", "Actions for the item under the pointer", true],
                    ["Double-click", "Edit text or crop an image", true],
                ],
            },
            {
                title: "View",
                rows: [
                    ["Space", "Zoom to fit everything"],
                    [`${mod}+= / ${mod}+−`, "Zoom in / out"],
                    [`${mod}+0`, "Zoom to 100%"],
                    ["Mouse wheel", "Zoom", true],
                    ["Two-finger scroll", "Pan (trackpad)", true],
                    ["Pinch", "Zoom (trackpad)", true],
                    ["Middle-drag", "Pan", true],
                ],
            },
            {
                title: "File",
                rows: [
                    [`${mod}+S`, "Save as a PNG image"],
                    [`${mod}+N`, "Clear for a new drawing"],
                    ["?", "Show this list"],
                ],
            },
        ];
    }

    // "Ctrl+Shift+Z / Ctrl+Y" → <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> or …
    function renderShortcutKeys(container, text, isGesture) {
        if (isGesture) {
            container.textContent = text;
            return;
        }
        text.split(" / ").forEach((combo, comboIndex) => {
            if (comboIndex > 0) container.append(" or ");
            combo.split("+").forEach((key, keyIndex) => {
                if (keyIndex > 0) container.append("+");
                // Mouse actions ("click", "drag") are words, not keys.
                if (/^[a-z]{2,}$/.test(key)) {
                    container.append(key);
                    return;
                }
                const kbd = document.createElement("kbd");
                kbd.textContent = key;
                container.appendChild(kbd);
            });
        });
    }

    function renderHelp() {
        helpContent.textContent = "";
        for (const group of getShortcutGroups()) {
            const section = document.createElement("section");
            const heading = document.createElement("h3");
            heading.textContent = group.title;
            const list = document.createElement("dl");
            for (const [keys, description, isGesture] of group.rows) {
                const term = document.createElement("dt");
                renderShortcutKeys(term, keys, isGesture);
                const detail = document.createElement("dd");
                detail.textContent = description;
                list.append(term, detail);
            }
            section.append(heading, list);
            helpContent.appendChild(section);
        }
    }

    function isHelpOpen() {
        return !helpBackdrop.hidden;
    }

    function openHelp() {
        closeContextMenu();
        closeSaveMenu();
        if (!helpContent.childElementCount) renderHelp();
        helpBackdrop.hidden = false;
        helpCloseButton.focus({ preventScroll: true });
    }

    function closeHelp() {
        helpBackdrop.hidden = true;
    }

    showHelpButton.addEventListener("click", openHelp);
    helpCloseButton.addEventListener("click", closeHelp);

    // On narrow screens the toolbar's Clear and shortcut-list buttons are
    // hidden, and these menu items stand in for them.
    menuShortcutsButton.addEventListener("click", openHelp);
    menuClearButton.addEventListener("click", () => {
        closeSaveMenu();
        clearButton.click();
    });
    helpBackdrop.addEventListener("mousedown", (e) => {
        if (e.target === helpBackdrop) closeHelp();
    });

    // Tooltips are written with Ctrl; show the Command key on a Mac.
    if (IS_MAC) {
        document.querySelectorAll("[title]").forEach(element => {
            element.title = element.title.replace(/\bCtrl\+/g, "⌘");
        });
    }

    // Initial history snapshot
    pushHistory();
    render();
</script>

<script>
    // ---- PWA: offline support and install prompt -------------------------
    (function () {
        const installButton = document.getElementById("install-app");
        const updateButton = document.getElementById("update-app");

        // Offer the browser's install prompt from our own toolbar button.
        let deferredInstallPrompt = null;

        window.addEventListener("beforeinstallprompt", e => {
            e.preventDefault();
            deferredInstallPrompt = e;
            installButton.classList.add("available");
        });

        installButton.addEventListener("click", async () => {
            if (!deferredInstallPrompt) return;
            installButton.classList.remove("available");
            const prompt = deferredInstallPrompt;
            deferredInstallPrompt = null;
            prompt.prompt();
            await prompt.userChoice;
        });

        window.addEventListener("appinstalled", () => {
            deferredInstallPrompt = null;
            installButton.classList.remove("available");
        });

        // Service worker: needs a real origin, so skip it on file:// URLs.
        if (!("serviceWorker" in navigator) || location.protocol === "file:") return;

        window.addEventListener("load", async () => {
            let registration;
            try {
                registration = await navigator.serviceWorker.register("sw.js");
            } catch (err) {
                console.warn("Service worker registration failed:", err);
                return;
            }

            const offerUpdate = worker => {
                if (!worker) return;
                updateButton.classList.add("available");
                updateButton.onclick = () => {
                    updateButton.classList.remove("available");
                    worker.postMessage({ type: "SKIP_WAITING" });
                };
            };

            // A new worker may already be waiting from a previous visit.
            if (registration.waiting && navigator.serviceWorker.controller) {
                offerUpdate(registration.waiting);
            }

            registration.addEventListener("updatefound", () => {
                const installing = registration.installing;
                if (!installing) return;
                installing.addEventListener("statechange", () => {
                    // A worker reaching "installed" while one is already in
                    // control means this is an update, not a first install.
                    if (installing.state === "installed" && navigator.serviceWorker.controller) {
                        offerUpdate(installing);
                    }
                });
            });

            let reloading = false;
            navigator.serviceWorker.addEventListener("controllerchange", () => {
                if (reloading) return;
                reloading = true;
                location.reload();
            });
        });
    })();
</script>
