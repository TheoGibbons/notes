    // When loading from local saves, we might have image shapes with src values; lazily
    // loading via drawImageShape will fill the cache, so no special handling needed here.

    // Legacy localStorage reader used once to migrate existing saves to IndexedDB.
    function loadSavesFromStorage() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return {};
            const parsed = JSON.parse(raw);
            if (typeof parsed !== "object" || parsed === null) return {};
            return parsed;
        } catch {
            return {};
        }
    }

    function getSaveDatabase() {
        if (saveDatabasePromise) return saveDatabasePromise;
        saveDatabasePromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(SAVE_DB_NAME, 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains(SAVE_STORE_NAME)) {
                    db.createObjectStore(SAVE_STORE_NAME, { keyPath: "name" });
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
        return saveDatabasePromise;
    }

    async function runSaveTransaction(mode, operation) {
        const db = await getSaveDatabase();
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(SAVE_STORE_NAME, mode);
            operation(transaction.objectStore(SAVE_STORE_NAME));
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error);
            transaction.onabort = () => reject(transaction.error);
        });
    }

    async function readAllSaveRecords() {
        const db = await getSaveDatabase();
        return new Promise((resolve, reject) => {
            const request = db.transaction(SAVE_STORE_NAME, "readonly")
                .objectStore(SAVE_STORE_NAME).getAll();
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error);
        });
    }

    function writeSaveRecords(records) {
        return runSaveTransaction("readwrite", store => {
            records.forEach(record => store.put(record));
        });
    }

    function deleteSaveRecords(names) {
        if (names.length === 0) return Promise.resolve();
        return runSaveTransaction("readwrite", store => {
            names.forEach(name => store.delete(name));
        });
    }

    async function initializeSaveStorage() {
        try {
            let records = await readAllSaveRecords();
            const existingNames = new Set(records.map(record => record.name));
            const legacySaves = loadSavesFromStorage();
            const recordsToMigrate = Object.entries(legacySaves)
                .filter(([name]) => !existingNames.has(name))
                .map(([name, save]) => ({ name, ...save }));

            if (recordsToMigrate.length > 0) {
                await writeSaveRecords(recordsToMigrate);
                records = records.concat(recordsToMigrate);
            }
            if (Object.keys(legacySaves).length > 0) {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                } catch {
                    // Migration already succeeded; leaving the legacy copy is harmless.
                }
            }

            saves = {};
            records.forEach(({ name, ...save }) => {
                saves[name] = save;
            });
            const loadedNames = Object.keys(saves);
            pruneAutosaves(saves);
            await deleteSaveRecords(loadedNames.filter(name => !saves[name]));
            refreshSavesMenu();
            return true;
        } catch (error) {
            console.error("Could not initialize drawing save storage", error);
            return false;
        }
    }

    function cancelPendingSavePreview(name = null) {
        if (!pendingSavePreview || (name && pendingSavePreview.name !== name)) return;
        clearTimeout(pendingSavePreview.timer);
        pendingSavePreview = null;
    }

    function clearSavePreview(name = null) {
        cancelPendingSavePreview(name);
        if (!activeSavePreview || (name && activeSavePreview.name !== name)) return;

        const preview = activeSavePreview;
        activeSavePreview = null;
        preview.item?.classList.remove("save-preview-active");
        if (preview.textEditorInput?.isConnected) {
            preview.textEditorInput.style.visibility = preview.textEditorVisibility;
        }
        render();
    }

    function beginSavePreview(name, item) {
        const save = saves[name];
        if (!save || !item.isConnected || !isSaveMenuOpen()) return;
        if (activeSavePreview?.name === name) return;

        clearSavePreview();
        const textEditorInput = currentTextEditor?.input || null;
        activeSavePreview = {
            name,
            item,
            save,
            textEditorInput,
            textEditorVisibility: textEditorInput?.style.visibility || "",
        };
        item.classList.add("save-preview-active");
        if (textEditorInput) textEditorInput.style.visibility = "hidden";
        render();
    }

    function queueSavePreview(name, item) {
        cancelPendingSavePreview();
        if (activeSavePreview?.name === name) return;
        const timer = setTimeout(() => {
            pendingSavePreview = null;
            beginSavePreview(name, item);
        }, SAVE_PREVIEW_DELAY_MS);
        pendingSavePreview = { name, item, timer };
    }

    function clearAutosavePreview() {
        if (pendingSavePreview && isAutosaveName(pendingSavePreview.name)) {
            cancelPendingSavePreview(pendingSavePreview.name);
        }
        if (activeSavePreview && isAutosaveName(activeSavePreview.name)) {
            clearSavePreview(activeSavePreview.name);
        }
    }

    // Lists every save in the menu: autosaves behind their own submenu, named
    // saves directly in the panel.
    function refreshSavesMenu() {
        // Refreshing replaces the row elements, so end any preview tied to one.
        clearSavePreview();
        localSavesList.innerHTML = "";
        autosavesList.innerHTML = "";

        const names = Object.keys(saves);
        const autosaveNames = names.filter(isAutosaveName).sort(newestFirst(saves));
        const namedSaves = names.filter(name => !isAutosaveName(name))
            .sort((a, b) => a.localeCompare(b));

        autosavesMenu.hidden = autosaveNames.length === 0;
        if (autosavesMenu.hidden) closeAutosavesMenu();
        autosaveNames.forEach(name => autosavesList.appendChild(createSaveItem(name)));

        if (names.length === 0) {
            const empty = document.createElement("div");
            empty.className = "menu-empty";
            empty.textContent = "No saved drawings yet.";
            localSavesList.appendChild(empty);
            return;
        }

        namedSaves.forEach(name => localSavesList.appendChild(createSaveItem(name)));
    }

    // One row per save: its name loads it, and the two small buttons beside
    // it rename (or, for an autosave, keep it under a name) and delete it.
    function createSaveItem(name) {
        const row = document.createElement("div");
        row.className = "menu-save-row";
        row.appendChild(createSaveLoadButton(name));

        const autosave = isAutosaveName(name);
        const actions = [
            {
                text: "✎",
                label: autosave ? `Keep "${name}" as a named save` : `Rename "${name}"`,
                run: () => renameSave(name),
            },
            { text: "✕", label: `Delete "${name}"`, run: () => deleteSave(name), danger: true },
        ];
        for (const action of actions) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "menu-save-action";
            if (action.danger) button.classList.add("danger");
            button.textContent = action.text;
            button.title = action.label;
            button.setAttribute("aria-label", action.label);
            button.addEventListener("click", (e) => {
                e.stopPropagation();
                action.run();
            });
            row.appendChild(button);
        }
        return row;
    }

    function createSaveLoadButton(name) {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "menu-save-load";
        item.setAttribute("role", "menuitem");
        if (isAutosaveName(name)) item.classList.add("autosave-option");
        // Autosave names already carry their timestamp — don't repeat it.
        const label = saves[name]?.updatedAt && !isAutosaveName(name)
            ? `${name} (${formatSaveTimestamp(saves[name].updatedAt)})`
            : name;
        item.textContent = label;
        // Rows are clipped to keep the panel narrow, so the tooltip carries
        // the full text.
        item.title = label;
        item.setAttribute("aria-label", `${label}. Focus to preview; activate to load.`);
        item.addEventListener("pointerenter", (event) => {
            if (event.pointerType === "mouse") queueSavePreview(name, item);
        });
        item.addEventListener("pointerleave", (event) => {
            if (event.pointerType === "mouse") clearSavePreview(name);
        });
        item.addEventListener("focus", () => queueSavePreview(name, item));
        item.addEventListener("blur", () => clearSavePreview(name));
        item.addEventListener("click", () => {
            clearSavePreview();
            loadNamedDrawing(name);
        });
        return item;
    }

    // "2026-08-03 4:07:59 PM" — sortable date, readable clock.
    function formatSaveTimestamp(value) {
        const date = value instanceof Date ? value : new Date(value);
        const pad = number => String(number).padStart(2, "0");
        const hours = date.getHours() % 12 || 12;
        const meridiem = date.getHours() < 12 ? "AM" : "PM";
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`
            + ` ${hours}:${pad(date.getMinutes())}:${pad(date.getSeconds())} ${meridiem}`;
    }

    function isAutosaveName(name) {
        return /^autosave/i.test(name);
    }

    function newestFirst(saveCollection) {
        return (a, b) => {
            const aTime = new Date(saveCollection[a]?.updatedAt || 0).getTime();
            const bTime = new Date(saveCollection[b]?.updatedAt || 0).getTime();
            return bTime - aTime;
        };
    }

    function pruneAutosaves(saveCollection) {
        Object.keys(saveCollection)
            .filter(isAutosaveName)
            .sort(newestFirst(saveCollection))
            .slice(10)
            .forEach(name => delete saveCollection[name]);
    }

    function flashSaveSuccess() {
        saveMenuButton.classList.add("save-success");
        if (saveSuccessTimeout) clearTimeout(saveSuccessTimeout);
        saveSuccessTimeout = setTimeout(() => {
            saveMenuButton.classList.remove("save-success");
            saveSuccessTimeout = null;
        }, 1500);
    }

    // Storage work runs one operation at a time, in the order it was asked for.
    function queueSaveOperation(operation) {
        const result = saveOperationQueue.then(operation, operation);
        saveOperationQueue = result.then(() => undefined, () => undefined);
        return result;
    }

    // Save the drawing as it is right now (or `snapshotJson`, an earlier
    // state) under `name`. `replaces` names a save this one supersedes.
    function storeDrawing(name, { snapshotJson = JSON.stringify(shapes), ...options } = {}) {
        // Take the snapshot now: the queue may only run this once the drawing
        // has moved on.
        const snapshot = { json: snapshotJson, camera: { ...camera } };
        pendingSaveNames.add(name);
        return queueSaveOperation(() => performStoreDrawing(name, snapshot, options))
            .finally(() => pendingSaveNames.delete(name));
    }

    async function performStoreDrawing(name, snapshot, {
        showSuccess = false,
        showError = false,
        replaces = null,
    } = {}) {
        if (!await savesReady) {
            if (showError) alert("Persistent drawing storage is unavailable in this browser.");
            return false;
        }

        const nextSaves = {
            ...saves,
            [name]: {
                shapes: JSON.parse(snapshot.json),
                camera: snapshot.camera,
                updatedAt: new Date().toISOString(),
            },
        };
        if (replaces && replaces !== name) delete nextSaves[replaces];
        pruneAutosaves(nextSaves);

        const removedSaveNames = Object.keys(saves)
            .filter(existingName => !nextSaves[existingName]);
        try {
            await writeSaveRecords([{ name, ...nextSaves[name] }]);
            await deleteSaveRecords(removedSaveNames);
        } catch (error) {
            console.error("Could not save drawing", error);
            if (showError) {
                alert("The drawing could not be saved. Your changes are still unsaved.");
            }
            return false;
        }

        saves = nextSaves;
        refreshSavesMenu();
        // Clean means "matches what was saved", which the drawing may already
        // have moved on from.
        cleanShapesSnapshot = snapshot.json;
        updateDirtyState();
        if (showSuccess) flashSaveSuccess();
        return true;
    }

    // Autosave names carry their time; two in the same second get a number.
    function nextAutosaveName(replacing = null) {
        const base = `Autosave (${formatSaveTimestamp(new Date())})`;
        let name = base;
        for (let n = 2; name !== replacing && (saves[name] || pendingSaveNames.has(name)); n++) {
            name = `${base} ${n}`;
        }
        return name;
    }

    // Each autosave overwrites the previous one from this session, so the
    // list holds one entry per drawing session rather than one per 30 s.
    function writeAutosave(snapshotJson, showError = false) {
        const replaces = currentAutosaveName;
        const name = nextAutosaveName(replaces);
        currentAutosaveName = name;
        return storeDrawing(name, { snapshotJson, replaces, showError });
    }

    async function autosaveIfDirty(showError = false) {
        if (currentTextEditor) {
            currentTextEditor.shape.text = currentTextEditor.input.value || "";
        }
        updateDirtyState();
        // An empty board has nothing worth keeping.
        if (!isDirty || shapes.length === 0) return true;
        return writeAutosave(JSON.stringify(shapes), showError);
    }

    // Called when most of the board disappears in one step. `previousJson` is
    // the board just before: it goes into the current autosave (if that
    // doesn't already have it), and the next autosave starts a new entry.
    function rollOverAutosave(previousJson) {
        if (previousJson && previousJson !== "[]" && previousJson !== cleanShapesSnapshot) {
            writeAutosave(previousJson);
        }
        currentAutosaveName = null;
    }

    async function renameSave(oldName) {
        clearSavePreview();
        let suggestion = isAutosaveName(oldName) ? "" : oldName;
        for (;;) {
            const entered = prompt(
                isAutosaveName(oldName)
                    ? "Keep this autosave as a named save called:"
                    : `Rename "${oldName}" to:`,
                suggestion,
            );
            if (entered === null) return; // cancelled
            const name = entered.trim();
            if (!name) {
                alert("Please enter a name for the save.");
                suggestion = "";
                continue;
            }
            if (isAutosaveName(name)) {
                alert('Save names cannot begin with "Autosave".');
                suggestion = name;
                continue;
            }
            if (name === oldName) return;
            if (saves[name] && !confirm(`There is already a save called "${name}". Replace it?`)) {
                suggestion = name;
                continue;
            }

            try {
                await queueSaveOperation(async () => {
                    const record = saves[oldName];
                    if (!record) return;
                    await writeSaveRecords([{ ...record, name }]);
                    await deleteSaveRecords([oldName]);
                    const nextSaves = { ...saves, [name]: record };
                    delete nextSaves[oldName];
                    saves = nextSaves;
                });
            } catch (error) {
                console.error("Could not rename the save", error);
                alert("The save could not be renamed.");
                return;
            }
            if (currentSaveName === oldName) currentSaveName = name;
            // A renamed autosave is a named save now; autosaving starts afresh.
            if (currentAutosaveName === oldName) currentAutosaveName = null;
            refreshSavesMenu();
            return;
        }
    }

    async function deleteSave(name) {
        clearSavePreview();
        if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
        try {
            await queueSaveOperation(async () => {
                await deleteSaveRecords([name]);
                const nextSaves = { ...saves };
                delete nextSaves[name];
                saves = nextSaves;
            });
        } catch (error) {
            console.error("Could not delete the save", error);
            alert("The save could not be deleted.");
            return;
        }
        if (currentAutosaveName === name) currentAutosaveName = null;
        refreshSavesMenu();
    }

    async function saveNamedDrawing() {
        closeSaveMenu();
        commitCurrentTextEditor();

        let suggestion = isAutosaveName(currentSaveName) ? "" : currentSaveName;
        for (;;) {
            const entered = prompt("Name for this save:", suggestion);
            if (entered === null) return; // cancelled
            const name = entered.trim();
            if (!name) {
                alert("Please enter a name for the save.");
                suggestion = "";
                continue;
            }
            if (isAutosaveName(name)) {
                alert('Save names cannot begin with "Autosave".');
                suggestion = name;
                continue;
            }
            currentSaveName = name;
            await storeDrawing(name, { showSuccess: true, showError: true });
            return;
        }
    }

    async function loadNamedDrawing(name) {
        if (!saves[name]) return;
        closeSaveMenu();

        // Autosaving can prune old autosaves, so re-check the save afterwards.
        if (!await autosaveIfDirty(true)) return;
        const save = saves[name];
        if (!save) return;

        cancelImageCrop();
        destroyTextEditor();
        currentSaveName = name;
        shapes = cloneShapes(save.shapes || []);
        markCurrentDrawingClean();
        camera = save.camera ? { ...save.camera } : { x: 0, y: 0, scale: 1 };
        if (camera.scale == null) camera.scale = 1;
        clearSelection();
        // Carrying on with an autosave keeps writing to it; any other drawing
        // starts its own autosave the first time it changes.
        currentAutosaveName = isAutosaveName(name) ? name : null;

        resetHistory();
        pushHistory();
        updateControlVisibility();
        render();
    }

    saveLocalButton.addEventListener("click", saveNamedDrawing);

    // The toolbar menu (save, export, import) opens on hover and stays open
    // once clicked.
    let saveMenuPinned = false;
    let saveMenuCloseTimer = null;

    function isSaveMenuOpen() {
        return !saveMenuPanel.hidden;
    }

    function cancelPendingSaveMenuClose() {
        if (!saveMenuCloseTimer) return;
        clearTimeout(saveMenuCloseTimer);
        saveMenuCloseTimer = null;
    }

    function openSaveMenu(pin = false) {
        cancelPendingSaveMenuClose();
        if (pin) saveMenuPinned = true;
        saveMenuPanel.hidden = false;
        saveMenuButton.setAttribute("aria-expanded", "true");
    }

    function closeSaveMenu() {
        cancelPendingSaveMenuClose();
        clearSavePreview();
        closeAutosavesMenu();
        saveMenuPinned = false;
        saveMenuPanel.hidden = true;
        saveMenuButton.setAttribute("aria-expanded", "false");
    }

    // The Autosaves submenu follows the same hover-to-open, click-to-pin rules.
    function openAutosavesMenu(pin = false) {
        if (autosavesMenu.hidden) return;
        if (pin) autosavesMenuPinned = true;
        autosavesList.hidden = false;
        autosavesButton.setAttribute("aria-expanded", "true");
        // Flip to the left of the parent panel when the window can't fit it.
        autosavesList.classList.remove("flip-left");
        if (autosavesList.getBoundingClientRect().right > window.innerWidth - 8) {
            autosavesList.classList.add("flip-left");
        }
    }

    function closeAutosavesMenu() {
        clearAutosavePreview();
        autosavesMenuPinned = false;
        autosavesList.hidden = true;
        autosavesButton.setAttribute("aria-expanded", "false");
    }

    autosavesMenu.addEventListener("pointerenter", (e) => {
        if (e.pointerType === "mouse") openAutosavesMenu();
    });

    autosavesMenu.addEventListener("pointerleave", (e) => {
        if (e.pointerType === "mouse" && !autosavesMenuPinned) closeAutosavesMenu();
    });

    autosavesButton.addEventListener("click", () => {
        if (!autosavesList.hidden && autosavesMenuPinned) closeAutosavesMenu();
        else openAutosavesMenu(true);
    });

    // Hovering another row in the parent panel dismisses the submenu.
    saveMenuPanel.addEventListener("pointerover", (e) => {
        if (autosavesMenuPinned || autosavesMenu.contains(e.target)) return;
        closeAutosavesMenu();
    });

    saveMenu.addEventListener("pointerenter", (e) => {
        if (e.pointerType === "mouse") openSaveMenu();
    });

    // Closing on a grace delay forgives a pointer that clips a corner of the
    // menu on its way to an item.
    saveMenu.addEventListener("pointerleave", (e) => {
        if (e.pointerType !== "mouse" || saveMenuPinned) return;
        cancelPendingSaveMenuClose();
        saveMenuCloseTimer = setTimeout(() => {
            saveMenuCloseTimer = null;
            if (!saveMenuPinned) closeSaveMenu();
        }, 400);
    });

    saveMenuButton.addEventListener("click", () => {
        if (isSaveMenuOpen() && saveMenuPinned) closeSaveMenu();
        else openSaveMenu(true);
    });

    document.addEventListener("pointerdown", (e) => {
        if (isSaveMenuOpen() && !saveMenu.contains(e.target)) closeSaveMenu();
    });

    setInterval(() => autosaveIfDirty(false), 30000);
    window.addEventListener("beforeunload", () => autosaveIfDirty(false));
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") autosaveIfDirty(false);
    });

    // Coordinate helpers
    function getCanvasRect() {
        return canvas.getBoundingClientRect();
    }

    function screenToWorld(clientX, clientY) {
        const rect = getCanvasRect();
        const scale = camera.scale || 1;
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        const x = camera.x + sx / scale;
        const y = camera.y + sy / scale;
        return { x, y };
    }

    // Distance from point to segment
    function distPointToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        if (dx === 0 && dy === 0) {
            const ddx = px - x1;
            const ddy = py - y1;
            return Math.sqrt(ddx * ddx + ddy * ddy);
        }
        const t = ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy);
        const tt = Math.max(0, Math.min(1, t));
        const projX = x1 + tt * dx;
        const projY = y1 + tt * dy;
        const ddx = px - projX;
        const ddy = py - projY;
        return Math.sqrt(ddx * ddx + ddy * ddy);
    }

    // Hit-testing strokes and text
    function hitTestStroke(stroke, x, y, radiusWorld) {
        const pts = stroke.points;
        const bounds = getShapeBounds(stroke);
        if (!bounds) return false;
        if (stroke.rotation) {
            const local = worldToLocalForBounds(
                { ...bounds, rotation: stroke.rotation },
                x,
                y,
            );
            x = bounds.x + local.x;
            y = bounds.y + local.y;
        }
        for (let i = 0; i < pts.length - 1; i++) {
            const p1 = pts[i];
            const p2 = pts[i + 1];
            if (distPointToSegment(x, y, p1.x, p1.y, p2.x, p2.y) <= radiusWorld) {
                return true;
            }
        }
        return false;
    }

    function hitTestText(shape, x, y, radiusWorld) {
        const bounds = getShapeBounds(shape);
        if (!bounds) return false;
        const local = worldToLocalForBounds(
            { ...bounds, rotation: shape.rotation || 0 },
            x,
            y,
        );
        const pad = radiusWorld || 0;
        return Math.abs(local.x) <= bounds.width / 2 + pad &&
            Math.abs(local.y) <= bounds.height / 2 + pad;
    }

    // Hit-test axis-aligned or rotated rect-like shapes (rect/image/arrow) by
    // transforming the world point into the shape's local space and checking
    // against a padded half-width/half-height box.
    function hitTestRectLike(shape, wx, wy, radiusWorld) {
        const local = worldToLocalForShape(shape, wx, wy);
        const pad = radiusWorld || 0;
        const bounds = getShapeBounds(shape);
        const halfW = (bounds?.width || 0) / 2 + pad;
        const halfH = (bounds?.height || 0) / 2 + pad;
        return Math.abs(local.x) <= halfW && Math.abs(local.y) <= halfH;
    }

    // Hit-test circle/oval shapes by mapping the world point into the
    // shape's rotated local space and normalizing against rx/ry with
    // an extra padding radius.
    function hitTestCircleShape(shape, wx, wy, radiusWorld) {
        const local = worldToLocalForShape(shape, wx, wy);
        const rx = shape.rx ?? shape.radius ?? 0;
        const ry = shape.ry ?? shape.radius ?? 0;
        const pad = radiusWorld || 0;
        const nx = local.x / ((rx + pad) || 1e-6);
        const ny = local.y / ((ry + pad) || 1e-6);
        return (nx * nx + ny * ny) <= 1;
    }

    function hitTestShapes(x, y, radiusWorld) {
        const radius = radiusWorld != null
            ? radiusWorld
            : (HIT_TEST_RADIUS / (camera.scale || 1));

        for (let i = shapes.length - 1; i >= 0; i--) {
            const s = shapes[i];
            if (s.type === "stroke") {
                if (hitTestStroke(s, x, y, radius)) return s;
            } else if (s.type === "text") {
                if (hitTestText(s, x, y, radius)) return s;
            } else if (s.type === "rect" || s.type === "image" || isSegmentShape(s)) {
                if (hitTestRectLike(s, x, y, radius)) return s;
            } else if (s.type === "circle") {
                if (hitTestCircleShape(s, x, y, radius)) return s;
            }
        }
        return null;
    }

    function worldToLocalForShape(shape, wx, wy) {
        const dx = wx - shape.x;
        const dy = wy - shape.y;
        const rot = shape.rotation || 0;
        const cosR = Math.cos(-rot);
        const sinR = Math.sin(-rot);
        const lx = dx * cosR - dy * sinR;
        const ly = dx * sinR + dy * cosR;
        return { x: lx, y: ly };
    }

    function worldToLocalForBounds(bounds, wx, wy) {
        const dx = wx - bounds.x;
        const dy = wy - bounds.y;
        const rotation = bounds.rotation || 0;
        const cosR = Math.cos(-rotation);
        const sinR = Math.sin(-rotation);
        return {
            x: dx * cosR - dy * sinR,
            y: dx * sinR + dy * cosR,
        };
    }

    function localToWorldForBounds(bounds, lx, ly) {
        const rotation = bounds.rotation || 0;
        const cosR = Math.cos(rotation);
        const sinR = Math.sin(rotation);
        return {
            x: bounds.x + lx * cosR - ly * sinR,
            y: bounds.y + lx * sinR + ly * cosR,
        };
    }

    // Hit-test resize and rotation handles for transformable shapes.
    function getHandleHitTest(shape, worldX, worldY, preferCoarse = false) {
        if (!isTransformableShape(shape)) return null;
        if (currentTextEditor && currentTextEditor.shape === shape) return null;
        const bounds = getShapeBounds(shape);
        if (!bounds) return null;

        const scale = camera.scale || 1;
        const handleMetrics = getTransformHandleMetrics(preferCoarse);
        const handleRadiusWorld = handleMetrics.resizeHitRadius / scale;

        if (isSegmentShape(shape)) {
            const local = worldToLocalForShape(shape, worldX, worldY);
            const halfLength = (shape.length || 0) / 2;
            if (Math.hypot(local.x + halfLength, local.y) <= handleRadiusWorld) {
                return { type: "resize", id: "start" };
            }
            if (Math.hypot(local.x - halfLength, local.y) <= handleRadiusWorld) {
                return { type: "resize", id: "end" };
            }
            return null;
        }

        // Pen strokes draw their corner handles on a slightly padded box.
        const strokePad = shape.type === "stroke" ? getStrokeHandlePad(shape) : 0;
        const halfW = bounds.width / 2 + strokePad;
        const halfH = bounds.height / 2 + strokePad;

        // Text size has its own setting, so text gets rotation without corner
        // handles. Everything else box-like has all four corners.
        const handleLocals = [
            { id: "tl", lx: -halfW, ly: -halfH },
            { id: "tr", lx: halfW,  ly: -halfH },
            { id: "br", lx: halfW,  ly: halfH },
            { id: "bl", lx: -halfW, ly: halfH },
        ];

        const rot = shape.rotation || 0;
        const cosR = Math.cos(rot);
        const sinR = Math.sin(rot);

        function localToWorld(lx, ly) {
            return {
                x: bounds.x + (lx * cosR - ly * sinR),
                y: bounds.y + (lx * sinR + ly * cosR),
            };
        }

        if (shape.type !== "text") {
            for (const h of handleLocals) {
                const p = localToWorld(h.lx, h.ly);
                const dx = worldX - p.x;
                const dy = worldY - p.y;
                if (dx * dx + dy * dy <= handleRadiusWorld * handleRadiusWorld) {
                    return { type: "resize", id: h.id };
                }
            }
        }

        // Rotation handle: use precise world position consistent with drawing
        const rotHandle = getRotationHandleWorld(shape);
        if (rotHandle) {
            const dx = worldX - rotHandle.x;
            const dy = worldY - rotHandle.y;
            const r = handleMetrics.rotationHitRadius / scale;
            if (dx * dx + dy * dy <= r * r) {
                return { type: "rotate", id: "rot" };
            }
        }

        return null;
    }

    // Gap, in world units, between a pen stroke and its selection box.
    function getStrokeHandlePad(shape) {
        return Math.max(4 / (camera.scale || 1), (shape.width || 0) / 2);
    }

    function getShapeBounds(shape) {
        if (shape.type === "stroke") {
            const points = shape.points || [];
            if (!points.length) return null;
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const point of points) {
                minX = Math.min(minX, point.x);
                minY = Math.min(minY, point.y);
                maxX = Math.max(maxX, point.x);
                maxY = Math.max(maxY, point.y);
            }
            return {
                x: (minX + maxX) / 2,
                y: (minY + maxY) / 2,
                width: maxX - minX,
                height: maxY - minY,
            };
        } else if (shape.type === "text") {
            const metrics = measureTextBlock(shape.text, shape.fontSize || 0);
            return {
                x: shape.x + metrics.width / 2,
                y: shape.y + metrics.height / 2,
                width: metrics.width,
                height: metrics.height,
            };
        } else if (shape.type === "circle") {
            const rx = shape.rx ?? shape.radius ?? 0;
            const ry = shape.ry ?? shape.radius ?? 0;
            return { x: shape.x, y: shape.y, width: rx * 2, height: ry * 2 };
        } else if (shape.type === "rect" || shape.type === "image" || isSegmentShape(shape)) {
            if (isSegmentShape(shape)) {
                const len = shape.length || 0;
                const thickness = Math.max(
                    (shape.strokeWidth || 2) * 4,
                    getArrowHeadLength(shape),
                ); // includes the arrowhead in selection/export bounds
                return { x: shape.x, y: shape.y, width: len, height: thickness };
            }
            return { x: shape.x, y: shape.y, width: shape.width || 0, height: shape.height || 0 };
        }
        return null;
    }

    // Axis-aligned world extent of a shape, including rotation and stroke width.
    function getShapeWorldExtent(shape) {
        const bounds = getShapeBounds(shape);
        if (!bounds) return null;

        const rotation = shape.rotation || 0;
        const cosR = Math.abs(Math.cos(rotation));
        const sinR = Math.abs(Math.sin(rotation));
        const halfBoxW = bounds.width / 2;
        const halfBoxH = bounds.height / 2;

        let halfW;
        let halfH;
        if (shape.type === "circle") {
            halfW = Math.hypot(halfBoxW * cosR, halfBoxH * sinR);
            halfH = Math.hypot(halfBoxW * sinR, halfBoxH * cosR);
        } else {
            halfW = halfBoxW * cosR + halfBoxH * sinR;
            halfH = halfBoxW * sinR + halfBoxH * cosR;
        }

        const pad = (shape.type === "stroke" ? shape.width : shape.strokeWidth || 0) / 2;
        return {
            minX: bounds.x - halfW - pad,
            minY: bounds.y - halfH - pad,
            maxX: bounds.x + halfW + pad,
            maxY: bounds.y + halfH + pad,
        };
    }

    function getShapesWorldExtent(list = shapes) {
        let extent = null;
        for (const shape of list) {
            const shapeExtent = getShapeWorldExtent(shape);
            if (!shapeExtent) continue;
            if (![shapeExtent.minX, shapeExtent.minY, shapeExtent.maxX, shapeExtent.maxY]
                .every(Number.isFinite)) continue;
            if (!extent) {
                extent = shapeExtent;
                continue;
            }
            extent.minX = Math.min(extent.minX, shapeExtent.minX);
            extent.minY = Math.min(extent.minY, shapeExtent.minY);
            extent.maxX = Math.max(extent.maxX, shapeExtent.maxX);
            extent.maxY = Math.max(extent.maxY, shapeExtent.maxY);
        }
        return extent;
    }

    // Calculate a camera that shows every supplied shape with a small margin.
    function getFitCameraForShapes(list = shapes, bottomSpace = 0) {
        const extent = getShapesWorldExtent(list);
        if (!extent) return null;

        const width = viewWidth;
        const height = Math.max(1, viewHeight - Math.max(0, bottomSpace));
        if (width <= 0 || height <= 0) return null;

        const margin = Math.min(40, width / 4, height / 4); // screen px
        const contentWidth = Math.max(extent.maxX - extent.minX, 1e-6);
        const contentHeight = Math.max(extent.maxY - extent.minY, 1e-6);

        const fitScale = Math.min(
            (width - margin * 2) / contentWidth,
            (height - margin * 2) / contentHeight,
        );
        const scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, fitScale));

        return {
            scale,
            x: (extent.minX + extent.maxX) / 2 - width / (2 * scale),
            y: (extent.minY + extent.maxY) / 2 - height / (2 * scale),
        };
    }

    // Zoom and pan so every placed shape is visible with a small margin.
    function zoomToFitShapes() {
        const fittedCamera = getFitCameraForShapes();
        if (!fittedCamera) return; // nothing placed – leave the camera alone

        camera.scale = fittedCamera.scale;
        camera.x = fittedCamera.x;
        camera.y = fittedCamera.y;
        render();
    }

    // Return world-space coordinates of the rotation handle center and a radius
    // in world units that matches the drawn blue circle in screen space.
    function getRotationHandleWorld(shape) {
        const bounds = getShapeBounds(shape);
        if (!bounds) return null;
        const scale = camera.scale || 1;
        const handleMetrics = getTransformHandleMetrics();

        const halfH = bounds.height / 2;
        const rotOffsetScreen = handleMetrics.rotationOffset;
        const rotOffsetWorld = rotOffsetScreen / scale;

        const localX = 0;
        const localY = -halfH - rotOffsetWorld;

        const rot = shape.rotation || 0;
        const cosR = Math.cos(rot);
        const sinR = Math.sin(rot);

        const wx = bounds.x + (localX * cosR - localY * sinR);
        const wy = bounds.y + (localX * sinR + localY * cosR);

        const radiusWorld = handleMetrics.visibleRadius / scale;
        return { x: wx, y: wy, radiusWorld };
    }

    // Erasing
    function hitTestShape(shape, x, y, radiusWorld) {
        if (shape.type === "stroke") return hitTestStroke(shape, x, y, radiusWorld);
        if (shape.type === "text") return hitTestText(shape, x, y, radiusWorld);
        if (shape.type === "rect" || shape.type === "image" || isSegmentShape(shape)) {
            return hitTestRectLike(shape, x, y, radiusWorld);
        }
        if (shape.type === "circle") return hitTestCircleShape(shape, x, y, radiusWorld);
        return false;
    }

    // A stroke's points with its rotation applied, so pieces cut from it can
    // be stored unrotated without moving.
    function getStrokeWorldPoints(stroke) {
        const rotation = stroke.rotation || 0;
        if (!rotation) return stroke.points.map(p => ({ x: p.x, y: p.y }));
        const bounds = getShapeBounds(stroke);
        const cos = Math.cos(rotation);
        const sin = Math.sin(rotation);
        return stroke.points.map(p => {
            const dx = p.x - bounds.x;
            const dy = p.y - bounds.y;
            return { x: bounds.x + dx * cos - dy * sin, y: bounds.y + dx * sin + dy * cos };
        });
    }

    // Cut away the part of a pen stroke inside a circle. Returns the strokes
    // left over (possibly none), or null when the circle misses the stroke.
    function eraseStrokeInCircle(stroke, cx, cy, radius) {
        // Reach the stroke's visible edge, not just its centre line.
        const reach = radius + (stroke.width || 0) / 2;
        if (!hitTestStroke(stroke, cx, cy, reach)) return null;

        const points = getStrokeWorldPoints(stroke);
        const reachSquared = reach * reach;
        const pieces = [];
        let current = [];

        for (let i = 0; i < points.length - 1; i++) {
            const a = points[i];
            const b = points[i + 1];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const fx = a.x - cx;
            const fy = a.y - cy;
            const lengthSquared = dx * dx + dy * dy;

            // The part of this segment inside the circle, as t in [enter, exit].
            let enter = Infinity;
            let exit = -Infinity;
            if (lengthSquared > 0) {
                const half = fx * dx + fy * dy;
                const discriminant = half * half - lengthSquared * (fx * fx + fy * fy - reachSquared);
                if (discriminant > 0) {
                    const root = Math.sqrt(discriminant);
                    enter = Math.max(0, (-half - root) / lengthSquared);
                    exit = Math.min(1, (-half + root) / lengthSquared);
                }
            } else if (fx * fx + fy * fy < reachSquared) {
                enter = 0;
                exit = 1;
            }

            if (enter >= exit) {
                // Untouched segment.
                if (!current.length) current.push(a);
                current.push(b);
                continue;
            }
            if (enter > 0) {
                if (!current.length) current.push(a);
                current.push({ x: a.x + dx * enter, y: a.y + dy * enter });
            }
            if (current.length) pieces.push(current);
            current = exit < 1 ? [{ x: a.x + dx * exit, y: a.y + dy * exit }, b] : [];
        }
        if (current.length) pieces.push(current);

        return pieces
            .filter(piece => piece.length > 1)
            .map(piece => ({ ...stroke, points: piece, rotation: 0 }));
    }

    // Erase at one point among the candidate shapes (kept in drawing order),
    // returning the candidates that remain.
    function eraseAt(candidates, x, y, radiusWorld) {
        if (eraserMode === "whole") {
            // Whole-item mode removes the topmost item under the eraser.
            for (let i = candidates.length - 1; i >= 0; i--) {
                const shape = candidates[i];
                const index = shapes.indexOf(shape);
                if (index === -1 || !hitTestShape(shape, x, y, radiusWorld)) continue;
                shapes.splice(index, 1);
                deselectShape(shape);
                eraseChanged = true;
                return candidates.filter(s => s !== shape);
            }
            return candidates;
        }

        // Part-of-stroke mode trims every pen stroke it touches. Other items
        // can't be partly erased, so touching them removes them.
        const remaining = [];
        for (const shape of candidates) {
            const index = shapes.indexOf(shape);
            if (index === -1) continue;
            if (shape.type === "stroke") {
                const pieces = eraseStrokeInCircle(shape, x, y, radiusWorld);
                if (pieces === null) {
                    remaining.push(shape);
                    continue;
                }
                shapes.splice(index, 1, ...pieces);
                remaining.push(...pieces);
            } else if (hitTestShape(shape, x, y, radiusWorld)) {
                shapes.splice(index, 1);
            } else {
                remaining.push(shape);
                continue;
            }
            deselectShape(shape);
            eraseChanged = true;
        }
        return remaining;
    }

    // Erase along the path from the previous eraser position, in steps no
    // longer than half the eraser, so a fast drag doesn't skip over strokes.
    function eraseAlong(from, to) {
        const radiusWorld = eraserSize / 2 / (camera.scale || 1);
        const start = from || to;
        const reach = radiusWorld + 1;
        const sweep = {
            minX: Math.min(start.x, to.x) - reach,
            minY: Math.min(start.y, to.y) - reach,
            maxX: Math.max(start.x, to.x) + reach,
            maxY: Math.max(start.y, to.y) + reach,
        };
        // Only shapes the sweep can reach need testing at each step.
        let candidates = shapes.filter(shape => {
            const extent = getShapeWorldExtent(shape);
            return extent && extent.minX <= sweep.maxX && extent.maxX >= sweep.minX &&
                extent.minY <= sweep.maxY && extent.maxY >= sweep.minY;
        });
        if (!candidates.length) return;

        const distance = Math.hypot(to.x - start.x, to.y - start.y);
        const steps = Math.max(1, Math.ceil(distance / Math.max(radiusWorld * 0.5, 1e-6)));
        for (let i = from ? 1 : steps; i <= steps; i++) {
            const t = i / steps;
            candidates = eraseAt(
                candidates,
                start.x + (to.x - start.x) * t,
                start.y + (to.y - start.y) * t,
                radiusWorld,
            );
            if (!candidates.length) break;
        }
    }

    // The eraser's footprint follows the mouse while the Eraser is active.
    function updateEraserCursor() {
        const visible = currentTool === "eraser" && !!lastPointerClient && !cropSession &&
            (pointerOverCanvas || (isDrawing && currentTool === "eraser"));
        eraserCursor.hidden = !visible;
        canvas.classList.toggle("eraser-cursor-visible", visible);
        if (!visible) return;
        const size = eraserSize;
        eraserCursor.style.width = `${size}px`;
        eraserCursor.style.height = `${size}px`;
        eraserCursor.style.transform =
            `translate(${lastPointerClient.x - size / 2}px, ${lastPointerClient.y - size / 2}px)`;
    }

    // Shared interaction helpers
    function beginPan(screenX, screenY) {
        isPanning = true;
        panStartScreen = { x: screenX, y: screenY };
        panStartCamera = { x: camera.x, y: camera.y };
        updateCanvasCursor();
    }

    // --- Rubber-band marquee ----------------------------------------------
    // Dragging from empty canvas with the Select tool sweeps out a box and
    // selects everything it touches. A shape counts as touched when its
    // axis-aligned world extent overlaps the box — the same extent its
    // selection outline is drawn from, so what you see is what you get.

    function beginMarquee(world, addToSelection) {
        isMarqueeSelecting = true;
        marqueeStartWorld = { ...world };
        marqueeRect = { minX: world.x, minY: world.y, maxX: world.x, maxY: world.y };
        marqueeBaseSelection = addToSelection ? selectedShapes : [];
        setSelection([...marqueeBaseSelection]);
    }

    function updateMarquee(world) {
        if (!marqueeStartWorld) return;
        marqueeRect = {
            minX: Math.min(marqueeStartWorld.x, world.x),
            minY: Math.min(marqueeStartWorld.y, world.y),
            maxX: Math.max(marqueeStartWorld.x, world.x),
            maxY: Math.max(marqueeStartWorld.y, world.y),
        };

        // Rebuild from the pre-drag selection every frame so shrinking the box
        // releases shapes it no longer covers.
        const swept = shapes.filter(shape => {
            if (marqueeBaseSelection.includes(shape)) return false;
            const extent = getShapeWorldExtent(shape);
            if (!extent) return false;
            return extent.minX <= marqueeRect.maxX && extent.maxX >= marqueeRect.minX &&
                extent.minY <= marqueeRect.maxY && extent.maxY >= marqueeRect.minY;
        });
        setSelection([...marqueeBaseSelection, ...swept]);
    }

    function endMarquee(cancelled) {
        if (!isMarqueeSelecting) return;
        if (cancelled) setSelection([...marqueeBaseSelection]);
        isMarqueeSelecting = false;
        marqueeStartWorld = null;
        marqueeRect = null;
        marqueeBaseSelection = [];
        updateControlVisibility();
        render();
    }

    function drawMarquee(scale) {
        if (!marqueeRect) return;
        const x = (marqueeRect.minX - camera.x) * scale;
        const y = (marqueeRect.minY - camera.y) * scale;
        const w = (marqueeRect.maxX - marqueeRect.minX) * scale;
        const h = (marqueeRect.maxY - marqueeRect.minY) * scale;
        ctx.save();
        ctx.fillStyle = "rgba(0, 123, 255, 0.08)";
        ctx.fillRect(x, y, w, h);
        ctx.setLineDash([4, 3]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#007bff";
        ctx.strokeRect(x, y, w, h);
        ctx.restore();
    }

    // Start a resize interaction for a transformable shape and remember original bounds.
    function beginResize(shape, handleInfo, world) {
        isResizing = true;
        activeHandle = handleInfo.id;
        resizeChanged = false;
        const b = getShapeBounds(shape);
        // A pen stroke has no x/y of its own: it pivots on its points' centre.
        const isStroke = shape.type === "stroke";
        originalBounds = {
            x: isStroke ? b.x : shape.x,
            y: isStroke ? b.y : shape.y,
            width: b ? b.width : 0,
            height: b ? b.height : 0,
            radius: shape.radius || 0,
            rotation: shape.rotation || 0,
        };
        resizeStartPoints = isStroke ? shape.points.map(p => ({ x: p.x, y: p.y })) : null;
        dragStartWorld = { ...world };
    }

    function resizeSegmentEndpoint(shape, bounds, world, minLength, snap = false) {
        const halfLength = bounds.width / 2;
        const start = localToWorldForBounds(bounds, -halfLength, 0);
        const end = localToWorldForBounds(bounds, halfLength, 0);
        const pointerDx = world.x - dragStartWorld.x;
        const pointerDy = world.y - dragStartWorld.y;

        let nextStart = start;
        let nextEnd = end;
        if (activeHandle === "start") {
            nextStart = { x: start.x + pointerDx, y: start.y + pointerDy };
        } else {
            nextEnd = { x: end.x + pointerDx, y: end.y + pointerDy };
        }

        if (snap) {
            // Shift: swing the dragged end around the fixed one in 15° steps.
            const fixed = activeHandle === "start" ? nextEnd : nextStart;
            const moving = activeHandle === "start" ? nextStart : nextEnd;
            const reach = Math.hypot(moving.x - fixed.x, moving.y - fixed.y);
            const angle = snapAngle(Math.atan2(moving.y - fixed.y, moving.x - fixed.x));
            const snapped = { x: fixed.x + Math.cos(angle) * reach, y: fixed.y + Math.sin(angle) * reach };
            if (activeHandle === "start") nextStart = snapped;
            else nextEnd = snapped;
        }

        let dx = nextEnd.x - nextStart.x;
        let dy = nextEnd.y - nextStart.y;
        let length = Math.hypot(dx, dy);
        const angle = length > 0 ? Math.atan2(dy, dx) : bounds.rotation;
        if (length < minLength) {
            const ux = Math.cos(angle);
            const uy = Math.sin(angle);
            length = minLength;
            if (activeHandle === "start") {
                nextStart = { x: nextEnd.x - ux * length, y: nextEnd.y - uy * length };
            } else {
                nextEnd = { x: nextStart.x + ux * length, y: nextStart.y + uy * length };
            }
            dx = nextEnd.x - nextStart.x;
            dy = nextEnd.y - nextStart.y;
        }

        shape.x = (nextStart.x + nextEnd.x) / 2;
        shape.y = (nextStart.y + nextEnd.y) / 2;
        shape.length = length;
        shape.rotation = Math.atan2(dy, dx);
    }

    function beginRotate(shape, world) {
        const bounds = getShapeBounds(shape);
        if (!bounds) return;
        isRotating = true;
        activeHandle = "rot";
        rotateChanged = false;
        rotationCenter = { x: bounds.x, y: bounds.y };
        const dx = world.x - rotationCenter.x;
        const dy = world.y - rotationCenter.y;
        rotationStartAngle = Math.atan2(dy, dx);
        shapeStartRotation = shape.rotation || 0;
    }

    // --- Group resize and rotate -------------------------------------------
    // A multi-selection gets one box with corner and rotation handles. Corners
    // scale the whole group evenly from the opposite corner (an uneven scale
    // can't be applied to rotated shapes); rotation turns it about its centre.

    function canShowGroupHandles() {
        return currentTool === "select" && selectedShapes.length > 1 &&
            !isMarqueeSelecting && !cropSession && !currentTextEditor;
    }

    function getGroupHandleAtWorld(world, preferCoarse = false) {
        if (!canShowGroupHandles()) return null;
        const extent = getShapesWorldExtent(selectedShapes);
        if (!extent) return null;
        const scale = camera.scale || 1;
        const metrics = getTransformHandleMetrics(preferCoarse);
        const pad = GROUP_BOX_PAD_SCREEN / scale;
        const left = extent.minX - pad;
        const right = extent.maxX + pad;
        const top = extent.minY - pad;
        const bottom = extent.maxY + pad;

        const rotation = { x: (left + right) / 2, y: top - metrics.rotationOffset / scale };
        const rotationRadius = metrics.rotationHitRadius / scale;
        if (Math.hypot(world.x - rotation.x, world.y - rotation.y) <= rotationRadius) {
            return { mode: "rotate", extent };
        }
        const resizeRadius = metrics.resizeHitRadius / scale;
        const corners = { tl: [left, top], tr: [right, top], br: [right, bottom], bl: [left, bottom] };
        for (const [id, [x, y]] of Object.entries(corners)) {
            if (Math.hypot(world.x - x, world.y - y) <= resizeRadius) {
                return { mode: "resize", handle: id, extent };
            }
        }
        return null;
    }

    // Just the geometry a group transform rewrites, so images' (potentially
    // huge) data URLs aren't copied every time a group is grabbed.
    function captureShapeGeometry(shape) {
        if (shape.type === "stroke") {
            const bounds = getShapeBounds(shape);
            return {
                points: shape.points.map(p => ({ x: p.x, y: p.y })),
                center: bounds ? { x: bounds.x, y: bounds.y } : { x: 0, y: 0 },
                rotation: shape.rotation || 0,
            };
        }
        if (shape.type === "text") {
            const metrics = measureTextBlock(shape.text, shape.fontSize || 0);
            return {
                x: shape.x, y: shape.y, fontSize: shape.fontSize,
                width: metrics.width, height: metrics.height, rotation: shape.rotation || 0,
            };
        }
        return {
            x: shape.x, y: shape.y, rotation: shape.rotation || 0,
            width: shape.width, height: shape.height, rx: shape.rx, ry: shape.ry,
            length: shape.length, cornerRadius: shape.cornerRadius,
        };
    }

    function beginGroupTransform(hit, world) {
        const { extent } = hit;
        const center = { x: (extent.minX + extent.maxX) / 2, y: (extent.minY + extent.maxY) / 2 };
        groupTransform = {
            mode: hit.mode,
            handle: hit.handle || null,
            extent: { ...extent },
            pivot: center,
            startWorld: { ...world },
            startAngle: Math.atan2(world.y - center.y, world.x - center.x),
            angle: 0,
            originals: selectedShapes.map(shape => ({ shape, geometry: captureShapeGeometry(shape) })),
            changed: false,
        };
        if (hit.mode === "resize") {
            const id = hit.handle;
            groupTransform.corner = {
                x: id.includes("r") ? extent.maxX : extent.minX,
                y: id.includes("b") ? extent.maxY : extent.minY,
            };
            groupTransform.anchor = {
                x: id.includes("r") ? extent.minX : extent.maxX,
                y: id.includes("b") ? extent.minY : extent.maxY,
            };
        }
    }

    function scaleShapeFrom(shape, geometry, anchor, factor) {
        const map = (x, y) => ({ x: anchor.x + (x - anchor.x) * factor, y: anchor.y + (y - anchor.y) * factor });
        if (shape.type === "stroke") {
            geometry.points.forEach((p, i) => {
                const q = map(p.x, p.y);
                shape.points[i].x = q.x;
                shape.points[i].y = q.y;
            });
            return;
        }
        if (shape.type === "text") {
            const center = map(geometry.x + geometry.width / 2, geometry.y + geometry.height / 2);
            shape.fontSize = Math.max(0.01, Math.round(geometry.fontSize * factor * 100) / 100);
            const metrics = measureTextBlock(shape.text, shape.fontSize);
            shape.x = center.x - metrics.width / 2;
            shape.y = center.y - metrics.height / 2;
            return;
        }
        const center = map(geometry.x, geometry.y);
        shape.x = center.x;
        shape.y = center.y;
        if (shape.type === "rect" || shape.type === "image") {
            shape.width = geometry.width * factor;
            shape.height = geometry.height * factor;
            if (geometry.cornerRadius) shape.cornerRadius = geometry.cornerRadius * factor;
        } else if (shape.type === "circle") {
            shape.rx = geometry.rx * factor;
            shape.ry = geometry.ry * factor;
        } else if (isSegmentShape(shape)) {
            shape.length = geometry.length * factor;
        }
    }

    function rotateShapeAbout(shape, geometry, pivot, angle) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const turn = (x, y) => ({
            x: pivot.x + (x - pivot.x) * cos - (y - pivot.y) * sin,
            y: pivot.y + (x - pivot.x) * sin + (y - pivot.y) * cos,
        });
        shape.rotation = geometry.rotation + angle;
        if (shape.type === "stroke") {
            // Strokes turn about their own centre, so move that centre round
            // the pivot and shift every point with it.
            const moved = turn(geometry.center.x, geometry.center.y);
            const dx = moved.x - geometry.center.x;
            const dy = moved.y - geometry.center.y;
            geometry.points.forEach((p, i) => {
                shape.points[i].x = p.x + dx;
                shape.points[i].y = p.y + dy;
            });
        } else if (shape.type === "text") {
            const moved = turn(geometry.x + geometry.width / 2, geometry.y + geometry.height / 2);
            shape.x = moved.x - geometry.width / 2;
            shape.y = moved.y - geometry.height / 2;
        } else {
            const moved = turn(geometry.x, geometry.y);
            shape.x = moved.x;
            shape.y = moved.y;
        }
    }

    function updateGroupTransform(world, shiftKey) {
        const transform = groupTransform;
        if (transform.mode === "rotate") {
            let angle = Math.atan2(world.y - transform.pivot.y, world.x - transform.pivot.x) -
                transform.startAngle;
            if (shiftKey) angle = snapAngle(angle);
            transform.angle = angle;
            for (const { shape, geometry } of transform.originals) {
                rotateShapeAbout(shape, geometry, transform.pivot, angle);
            }
        } else {
            const { anchor, corner } = transform;
            const diagonalX = corner.x - anchor.x;
            const diagonalY = corner.y - anchor.y;
            const diagonalSquared = diagonalX * diagonalX + diagonalY * diagonalY;
            if (diagonalSquared <= 0) return;
            const draggedX = corner.x + world.x - transform.startWorld.x - anchor.x;
            const draggedY = corner.y + world.y - transform.startWorld.y - anchor.y;
            const minFactor = (10 / (camera.scale || 1)) / Math.sqrt(diagonalSquared);
            const factor = Math.max(minFactor, (draggedX * diagonalX + draggedY * diagonalY) / diagonalSquared);
            for (const { shape, geometry } of transform.originals) {
                scaleShapeFrom(shape, geometry, anchor, factor);
            }
        }
        transform.changed = true;
        render();
    }

    function isShapeDrawingTool(tool) {
        return tool === "rect" || tool === "circle" || tool === "arrow" || tool === "line";
    }

    // A newly drawn item remains editable without taking the user out of its
    // drawing tool. Only the matching tool (or Select/Move) owns its transform
    // handles, so changing tools still starts the newly chosen kind of item.
    function currentToolCanTransformShape(shape) {
        if (!shape) return false;
        if (currentTool === "select") return true;
        if (currentTool === "pen") return shape.type === "stroke";
        return currentTool === shape.type;
    }

    function switchToSelectTool() {
        currentTool = "select";
        setActiveToolButton("select");
        updateCanvasCursor();
        updateControlVisibility();
    }

    function beginShapeDrawing(tool, world) {
        isDrawing = true;
        drawingStartWorld = { ...world };

        if (tool === "rect") {
            draftShape = {
                type: "rect",
                x: world.x,
                y: world.y,
                width: 0,
                height: 0,
                rotation: 0,
                strokeColor: penColor,
                fillColor: fillEnabled ? fillColor : null,
                strokeWidth: penWidth,
                cornerRadius,
            };
        } else if (tool === "circle") {
            draftShape = {
                type: "circle",
                x: world.x,
                y: world.y,
                rx: 0,
                ry: 0,
                rotation: 0,
                strokeColor: penColor,
                fillColor: fillEnabled ? fillColor : null,
                strokeWidth: penWidth,
            };
        } else {
            // arrow and line
            draftShape = {
                type: tool,
                x: world.x,
                y: world.y,
                length: 0,
                rotation: 0,
                strokeColor: penColor,
                strokeWidth: penWidth,
            };
            if (tool === "arrow") draftShape.arrowHead = arrowHead;
        }
        draftShape.dash = dashStyle;
        draftShape.opacity = shapeOpacity;

        shapes.push(draftShape);
        clearSelection();
        updateControlVisibility();
        render();
    }

    // Shift (`constrain`) draws squares and circles, and snaps lines and
    // arrows to 15° steps.
    function updateDraftShape(world, constrain = false) {
        if (!draftShape || !drawingStartWorld) return;

        const start = drawingStartWorld;
        let dx = world.x - start.x;
        let dy = world.y - start.y;
        if (constrain) {
            if (draftShape.type === "rect" || draftShape.type === "circle") {
                const side = Math.max(Math.abs(dx), Math.abs(dy));
                dx = (dx < 0 ? -1 : 1) * side;
                dy = (dy < 0 ? -1 : 1) * side;
            } else if (isSegmentShape(draftShape)) {
                const length = Math.hypot(dx, dy);
                const angle = snapAngle(Math.atan2(dy, dx));
                dx = Math.cos(angle) * length;
                dy = Math.sin(angle) * length;
            }
        }
        draftShape.x = start.x + dx / 2;
        draftShape.y = start.y + dy / 2;

        if (draftShape.type === "rect") {
            draftShape.width = Math.abs(dx);
            draftShape.height = Math.abs(dy);
        } else if (draftShape.type === "circle") {
            draftShape.rx = Math.abs(dx) / 2;
            draftShape.ry = Math.abs(dy) / 2;
        } else if (isSegmentShape(draftShape)) {
            draftShape.length = Math.hypot(dx, dy);
            draftShape.rotation = Math.atan2(dy, dx);
        }
    }

    // Remember where every selected shape started so a drag can move the whole
    // group from its original positions rather than accumulating rounding.
    function captureSelectionDragOrigins() {
        return selectedShapes.map(shape => ({
            shape,
            origin: shape.type === "stroke"
                ? shape.points.map(p => ({ x: p.x, y: p.y }))
                : { x: shape.x, y: shape.y },
        }));
    }

    function handlePrimaryDownAtWorld(
        world, screenX, screenY, addToSelection = false, forceCropDraw = false,
        preferCoarseHandles = false
    ) {
        // While cropping, the canvas belongs to the crop session. Handles resize
        // the crop, its interior moves it, and dragging elsewhere on the source
        // draws a fresh crop window. A full-size window cannot move, so dragging
        // inside it draws immediately. Shift-drag redraws from any image point.
        if (cropSession) {
            const handle = getCropHandleAtWorld(world);
            const local = worldToLocalForBounds(getCropFrame(cropSession), world.x, world.y);
            const isInsideSource = pointIsInsideRect(local, cropSession.full);

            if (handle && handle !== "move") {
                beginCropDrag(handle, world);
            } else if (isInsideSource && (forceCropDraw ||
                (handle === "move" && cropRectsMatch(cropSession.rect, cropSession.full)))) {
                beginCropDraw(world);
            } else if (handle === "move") {
                beginCropDrag(handle, world);
            } else if (isInsideSource) {
                // Preserve the existing click-outside-to-apply shortcut when
                // this never becomes a drag.
                beginCropDraw(world, true);
            } else {
                applyImageCrop();
            }
            return;
        }

        // A multi-selection's own box handles come before anything under them.
        const groupHandle = getGroupHandleAtWorld(world, preferCoarseHandles);
        if (groupHandle) {
            beginGroupTransform(groupHandle, world);
            return;
        }

        // Completed items keep their drawing tool active, so handle hit-testing
        // must also work in that tool instead of being limited to Select/Move.
        if (selectedShape && isTransformableShape(selectedShape) &&
            currentToolCanTransformShape(selectedShape)) {
            const handleInfo = getHandleHitTest(
                selectedShape, world.x, world.y, preferCoarseHandles
            );
            if (handleInfo) {
                if (handleInfo.type === "resize") {
                    beginResize(selectedShape, handleInfo, world);
                } else if (handleInfo.type === "rotate") {
                    beginRotate(selectedShape, world);
                }
                return;
            }
        }

        if (currentTool === "pen") {
            isDrawing = true;
            currentStroke = {
                type: "stroke",
                points: [world],
                color: penColor,
                width: penWidth,
                rotation: 0,
                smoothing: penSmoothing,
                dash: dashStyle,
                opacity: shapeOpacity,
            };
            shapes.push(currentStroke);
            clearSelection();
            updateControlVisibility();
            render();
        } else if (currentTool === "eraser") {
            isDrawing = true;
            eraseChanged = false;
            lastEraserWorld = null;
            eraseAlong(null, world);
            lastEraserWorld = { ...world };
            render();
        } else if (currentTool === "select") {
            const hit = hitTestShapes(world.x, world.y);
            collapseSelectionTo = null;

            if (!hit) {
                // Empty canvas: sweep out a marquee. A click that never moves
                // simply ends up selecting nothing, as it always did.
                beginMarquee(world, addToSelection);
            } else if (addToSelection) {
                // Ctrl/Shift+click adds to (or removes from) the selection.
                toggleShapeSelected(hit);
            } else if (isShapeSelected(hit) && selectedShapes.length > 1) {
                // Clicking inside a group drags all of it; a click that never
                // moves collapses the selection to this shape on mouse up.
                collapseSelectionTo = hit;
            } else {
                setSelection([hit]);
            }

            if (hit && isShapeSelected(hit)) {
                isDraggingSelection = true;
                dragStartWorld = { ...world };
                moveChanged = false;
                originalShapeData = captureSelectionDragOrigins();
            } else {
                isDraggingSelection = false;
                originalShapeData = null;
            }
            updateControlVisibility();
            render();
        } else if (currentTool === "text") {
            const shape = {
                type: "text",
                x: world.x,
                y: world.y,
                text: "",
                fontSize: textSize,
                color: penColor,
                fillColor: fillEnabled ? fillColor : null,
                rotation: 0,
                opacity: shapeOpacity,
            };
            shapes.push(shape);
            setSelection([shape]);
            updateControlVisibility();
            render();
            showTextEditor(shape, true);
        } else if (isShapeDrawingTool(currentTool)) {
            beginShapeDrawing(currentTool, world);
         } else if (currentTool === "hand") {
            beginPan(screenX, screenY);
        }
    }

    // `shiftKey` constrains whatever is being dragged: squares, circles and
    // 15° angles while drawing or rotating, kept proportions while resizing.
    function handlePointerMove(world, screenX, screenY, shiftKey = false) {
        const keepAspectRatio = shiftKey;
        // Crop drags own the pointer, but middle-mouse panning still works.
        if (cropSession && !isPanning) {
            updateCropDrag(world);
            return;
        }

        if (groupTransform && !isPanning) {
            updateGroupTransform(world, shiftKey);
            return;
        }

        if (currentTool === "pen" && isDrawing && currentStroke) {
            // Skip moves under half a screen pixel: they only add jitter.
            const last = currentStroke.points[currentStroke.points.length - 1];
            const minStep = 0.5 / (camera.scale || 1);
            if (Math.abs(world.x - last.x) < minStep && Math.abs(world.y - last.y) < minStep) return;
            currentStroke.points.push(world);
            render();
        } else if (isShapeDrawingTool(currentTool) && isDrawing && draftShape) {
            updateDraftShape(world, shiftKey);
            render();
        } else if (currentTool === "eraser" && isDrawing) {
            eraseAlong(lastEraserWorld, world);
            lastEraserWorld = { ...world };
            render();
        } else if (isMarqueeSelecting && !isPanning) {
            // Checked before the branch below: the marquee owns the pointer even
            // once it has swept up shapes and made the selection non-empty.
            updateMarquee(world);
            updateControlVisibility();
            render();
        } else if ((currentTool === "select" || isResizing || isRotating) &&
            selectedShapes.length && !isPanning) {
            if (isResizing && isTransformableShape(selectedShape) && originalBounds) {
                const b = originalBounds;
                const minSize = 10 / (camera.scale || 1);

                if (isSegmentShape(selectedShape) &&
                    (activeHandle === "start" || activeHandle === "end")) {
                    resizeSegmentEndpoint(selectedShape, b, world, minSize, shiftKey);
                    resizeChanged = true;
                    render();
                    return;
                }

                // Measure in the original rotated coordinate system. The shape's
                // center changes during this interaction, so using its live center
                // would make the dragged corner drift.
                const localStart = worldToLocalForBounds(b, dragStartWorld.x, dragStartWorld.y);
                const localNow = worldToLocalForBounds(b, world.x, world.y);
                const dxLocal = localNow.x - localStart.x;
                const dyLocal = localNow.y - localStart.y;

                const signX = activeHandle === "tr" || activeHandle === "br" ? 1 : -1;
                const signY = activeHandle === "bl" || activeHandle === "br" ? 1 : -1;
                const fixedX = -signX * b.width / 2;
                const fixedY = -signY * b.height / 2;
                const originalDraggedX = signX * b.width / 2;
                const originalDraggedY = signY * b.height / 2;
                let newW = Math.max(minSize, signX * (originalDraggedX + dxLocal - fixedX));
                let newH = Math.max(minSize, signY * (originalDraggedY + dyLocal - fixedY));

                if (keepAspectRatio && b.width > 0 && b.height > 0) {
                    const widthScale = newW / b.width;
                    const heightScale = newH / b.height;
                    const uniformScale = Math.max(
                        minSize / b.width,
                        minSize / b.height,
                        Math.abs(widthScale - 1) >= Math.abs(heightScale - 1)
                            ? widthScale
                            : heightScale
                    );
                    newW = b.width * uniformScale;
                    newH = b.height * uniformScale;
                }
                // A perfectly straight pen stroke has no extent across itself;
                // that side stays at zero rather than growing to the minimum.
                if (b.width < 1e-6) newW = b.width;
                if (b.height < 1e-6) newH = b.height;

                // Move the center by half the size change, leaving the corner
                // opposite the dragged handle fixed in world space.
                const newCenter = localToWorldForBounds(
                    b,
                    fixedX + signX * newW / 2,
                    fixedY + signY * newH / 2
                );

                if (selectedShape.type === "stroke" && resizeStartPoints) {
                    // Stroke points are stored unrotated around their centre,
                    // so scaling their offsets scales along the stroke's axes.
                    const scaleX = b.width > 1e-6 ? newW / b.width : 1;
                    const scaleY = b.height > 1e-6 ? newH / b.height : 1;
                    resizeStartPoints.forEach((p, i) => {
                        selectedShape.points[i].x = newCenter.x + (p.x - b.x) * scaleX;
                        selectedShape.points[i].y = newCenter.y + (p.y - b.y) * scaleY;
                    });
                    resizeChanged = true;
                    render();
                    return;
                }
                selectedShape.x = newCenter.x;
                selectedShape.y = newCenter.y;

                if (selectedShape.type === "circle") {
                    // allow ovals: map width/height to rx/ry
                    selectedShape.rx = Math.max(minSize / 2, newW / 2);
                    selectedShape.ry = Math.max(minSize / 2, newH / 2);
                } else {
                    selectedShape.width = newW;
                    selectedShape.height = newH;
                }

                resizeChanged = true;
                render();
            } else if (isRotating && isTransformableShape(selectedShape) && rotationCenter) {
                const dx = world.x - rotationCenter.x;
                const dy = world.y - rotationCenter.y;
                const angle = Math.atan2(dy, dx);
                const rotation = shapeStartRotation + (angle - rotationStartAngle);
                selectedShape.rotation = shiftKey ? snapAngle(rotation) : rotation;
                rotateChanged = true;
                render();
            } else if (isDraggingSelection && originalShapeData) {
                 const dx = world.x - dragStartWorld.x;
                 const dy = world.y - dragStartWorld.y;

                 for (const { shape, origin } of originalShapeData) {
                     if (shape.type === "stroke") {
                         for (let i = 0; i < shape.points.length; i++) {
                             shape.points[i].x = origin[i].x + dx;
                             shape.points[i].y = origin[i].y + dy;
                         }
                     } else {
                         shape.x = origin.x + dx;
                         shape.y = origin.y + dy;
                     }
                 }
                 moveChanged = true;
                 render();
             }
         } else if (isPanning) {
            const scale = camera.scale || 1;
            const dx = screenX - panStartScreen.x;
            const dy = screenY - panStartScreen.y;
            camera.x = panStartCamera.x - dx / scale;
            camera.y = panStartCamera.y - dy / scale;
            render();
            if (currentTextEditor) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
        }
    }

    function stopAllInteractions(cancelDrawing = false) {
        // Escape puts the selection back the way the marquee found it.
        if (isMarqueeSelecting) endMarquee(cancelDrawing);

        // A crop drag ends on pointer up, but the session stays open until it
        // is applied or cancelled.
        if (cropSession) {
            const shouldApplyClick = cropDragHandle === "draw" &&
                !cropDrawActivated && cropDrawClickApplies && !cancelDrawing;
            if (shouldApplyClick) {
                applyImageCrop();
                return;
            }
            cropDragHandle = null;
            cropDragStartLocal = null;
            cropDragStartRect = null;
            cropDrawActivated = false;
            cropDrawClickApplies = false;
            isPanning = false;
            panStartScreen = null;
            updateCanvasCursor();
            return;
        }

        if (isShapeDrawingTool(currentTool) && isDrawing && draftShape) {
            const minimumSize = 3 / (camera.scale || 1);
            const isLargeEnough = isSegmentShape(draftShape)
                ? draftShape.length >= minimumSize
                : draftShape.type === "circle"
                    ? draftShape.rx * 2 >= minimumSize && draftShape.ry * 2 >= minimumSize
                    : draftShape.width >= minimumSize && draftShape.height >= minimumSize;

            if (isLargeEnough && !cancelDrawing) {
                const completedShape = draftShape;
                pushHistory();
                setSelection([completedShape]);
                updateControlVisibility();
            } else {
                const draftIndex = shapes.indexOf(draftShape);
                if (draftIndex !== -1) shapes.splice(draftIndex, 1);
            }
            render();
        }
        if (currentTool === "pen" && isDrawing && currentStroke) {
            if (currentStroke.points.length > 1 && !cancelDrawing) {
                const completedStroke = currentStroke;
                pushHistory();
                setSelection([completedStroke]);
                updateControlVisibility();
                render();
            } else {
                const strokeIndex = shapes.indexOf(currentStroke);
                if (strokeIndex !== -1) shapes.splice(strokeIndex, 1);
            }
        }
        if (currentTool === "eraser" && isDrawing && eraseChanged) {
            pushHistory();
        }
        if (currentTool === "select") {
            if (isDraggingSelection && moveChanged) {
                pushHistory();
            }
            // A click on a group member that never turned into a drag means the
            // user was picking that one shape out of the group.
            if (isDraggingSelection && !moveChanged && collapseSelectionTo &&
                !cancelDrawing) {
                setSelection([collapseSelectionTo]);
                updateControlVisibility();
                render();
            }
        }
        if (isResizing && resizeChanged) {
            pushHistory();
        }
        if (isRotating && rotateChanged) {
            pushHistory();
        }
        if (groupTransform) {
