<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Simple Drawing Pad</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Prevent page zoom; we handle zoom ourselves on the canvas -->
<!--    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />-->

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="description" content="An in-browser drawing pad with pen, shapes, text and images. Works offline; drawings are saved on your device." />
    <meta name="theme-color" content="#fafafa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Drawing Pad" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
            background: #fafafa;
            font-size: 14px;
        }
        .toolbar button,
        .settings-panel button,
        .toolbar select,
        .toolbar input[type="text"],
        .toolbar input[type="number"],
        .toolbar input[type="color"],
        .toolbar input[type="range"],
        .settings-panel input[type="number"],
        .settings-panel input[type="color"],
        .settings-panel input[type="range"] {
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .toolbar input[type="color"],
        .settings-panel input[type="color"] {
            padding: 0;
            width: 36px;
            height: 28px;
        }
        .toolbar input[type="range"],
        .settings-panel input[type="range"] {
            cursor: pointer;
        }
        .toolbar input[type="text"] {
            cursor: text;
            width: 150px;
        }
        .toolbar input[type="number"],
        .settings-panel input[type="number"] {
            cursor: text;
            width: 58px;
        }
        .toolbar button.active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }
        .settings-panel button:disabled {
            background: #f5f5f5;
            color: #888;
            cursor: default;
        }
        .toolbar select:disabled {
            background: #f5f5f5;
            color: #888;
            cursor: default;
        }
        /* PWA controls: only revealed when the browser offers an install
           prompt, or when a new version is waiting to activate. */
        #install-app,
        #update-app {
            display: none;
        }
        #install-app.available,
        #update-app.available {
            display: inline-block;
        }
        #update-app.available {
            background: #28a745;
            border-color: #28a745;
            color: #fff;
        }
        /* Save/Import dropdown */
        .menu {
            position: relative;
            display: inline-flex;
        }
        .menu-panel {
            position: absolute;
            /* Flush against the button: any gap here is a dead zone the pointer
               would cross on its way down, closing the menu. */
            top: 100%;
            left: 0;
            z-index: 30;
            min-width: 240px;
            max-width: 340px;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 6px 18px rgb(0 0 0 / 18%);
        }
        .menu-panel[hidden] {
            display: none;
        }
        .toolbar .menu-panel button {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: transparent;
            padding: 6px 8px;
            /* Save names (and their timestamps) can be long — keep the panel
               from growing, and let the title show the full text. */
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .toolbar .menu-panel button:hover,
        .toolbar .menu-panel button:focus-visible,
        .toolbar .menu-panel button.save-preview-active {
            background: #eaf3ff;
        }
        .toolbar .menu-panel button.autosave-option {
            color: #006dcc;
        }
        .submenu {
            position: relative;
        }
        .submenu[hidden] {
            display: none;
        }
        .submenu-panel {
            position: absolute;
            /* Flush against the parent row for the same reason the main panel is
               flush against its button: no dead zone for the pointer to cross. */
            top: 0;
            left: 100%;
            z-index: 31;
            min-width: 240px;
            max-width: 340px;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 6px 18px rgb(0 0 0 / 18%);
        }
        /* Applied when the panel would run off the right edge of the window. */
        .submenu-panel.flip-left {
            left: auto;
            right: 100%;
        }
        .submenu-panel[hidden] {
            display: none;
        }
        .menu-separator {
            height: 1px;
            background: #ddd;
            margin: 4px 2px;
        }
        .menu-heading {
            font-weight: 600;
            color: #555;
            padding: 4px 8px 2px;
        }
        .menu-saves {
            max-height: 260px;
            overflow-y: auto;
        }
        .menu-empty {
            color: #888;
            padding: 4px 8px 6px;
        }
        #save-menu-button.save-success {
            background: #28a745;
            border-color: #28a745;
            color: #fff;
        }
        .toolbar .group-label {
            font-weight: 600;
            margin-right: 4px;
        }
        .toolbar .divider {
            width: 1px;
            height: 31px;
            background: #ddd;
            margin: 0 6px;
        }
        .toolbar .spacer {
            flex: 1;
        }
        .toolbar .inline-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        #pen-size-container,
        #color-container,
        #fill-container,
        #layer-container,
        #crop-container,
        #text-size-container {
            display: none;
            align-items: center;
            gap: 4px;
        }
        .settings-panel {
            position: fixed;
            top: calc(var(--toolbar-height, 0px) + 12px);
            right: 12px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(290px, calc(100vw - 24px));
            max-height: calc(100vh - var(--toolbar-height, 0px) - 24px);
            overflow-y: auto;
            padding: 12px;
            border: 1px solid #d7d7d7;
            border-radius: 8px;
            background: rgb(255 255 255 / 96%);
            box-shadow: 0 8px 24px rgb(0 0 0 / 18%);
            font-size: 13px;
        }
        .settings-panel[hidden] {
            display: none;
        }
        .settings-panel-title {
            margin: 0;
            color: #444;
            font-size: 14px;
            font-weight: 700;
        }
        .settings-panel .inline-group {
            width: 100%;
            min-height: 30px;
            align-items: center;
            gap: 8px;
        }
        .settings-panel .group-label {
            flex: 0 0 68px;
            font-weight: 600;
        }
        .settings-panel input[type="color"] {
            margin-left: auto;
        }
        .settings-panel input[type="range"] {
            min-width: 0;
            flex: 1;
        }
        .settings-panel #layer-container,
        .settings-panel #crop-container {
            flex-wrap: wrap;
        }
        .settings-panel #layer-container .group-label,
        .settings-panel #crop-container .group-label {
            flex-basis: 100%;
        }
        .settings-panel #layer-container button,
        .settings-panel #crop-container button {
            flex: 1;
            white-space: nowrap;
        }
        #crop-apply {
            background: #007bff;
            border-color: #007bff;
            color: #fff;
        }
        #canvas {
            flex: 1;
            display: block;
            background: #fff;
            cursor: crosshair;
            touch-action: none; /* hint for some browsers */
        }
        #canvas.drawing-pad.rectangle-mode {
            cursor: url("./rectangle-cursor.svg") 16 16, crosshair;
        }
        #canvas.drawing-pad.pen-mode {
            cursor: url("./pen-cursor.svg") 5 27, crosshair;
        }
        #canvas.drawing-pad.text-mode {
            cursor: text;
        }
        #canvas.drawing-pad.circle-mode {
            cursor: url("./circle-cursor.svg") 16 16, crosshair;
        }
        #canvas.drawing-pad.arrow-mode {
            cursor: url("./arrow-cursor.svg") 8 8, crosshair;
        }
        #canvas.drawing-pad.line-mode {
            cursor: url("./line-cursor.svg") 16 16, crosshair;
        }
        #canvas.drawing-pad.eraser-mode {
            cursor: url("./eraser-cursor.svg") 7 26, crosshair;
        }
        #canvas.image-drop-target {
            box-shadow: inset 0 0 0 4px #007bff;
        }
        /* Save Image dialog */
        .dialog-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgb(0 0 0 / 35%);
        }
        .dialog-backdrop[hidden] {
            display: none;
        }
        .dialog {
            width: min(340px, calc(100vw - 32px));
            padding: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 12px 32px rgb(0 0 0 / 25%);
            font-size: 14px;
        }
        .dialog h2 {
            margin: 0 0 12px;
            font-size: 16px;
        }
        .dialog-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }
        .dialog-row > label:first-child {
            font-weight: 600;
        }
        .dialog-inline {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
        }
        .dialog input[type="text"],
        .dialog input[type="number"],
        .dialog select {
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            padding: 4px 6px;
            font: inherit;
            font-size: 13px;
        }
        .dialog input[type="text"] {
            width: 150px;
        }
        .dialog input[type="number"] {
            width: 80px;
        }
        .dialog input[type="color"] {
            width: 36px;
            height: 26px;
            padding: 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
        .dialog input:disabled,
        .dialog select:disabled {
            background: #f5f5f5;
            color: #888;
        }
        .dialog-note {
            margin: 0 0 12px;
            color: #666;
            font-size: 12px;
            min-height: 15px;
        }
        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .dialog-actions button {
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            padding: 5px 12px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }
        .dialog-actions button[type="submit"] {
            background: #007bff;
            border-color: #007bff;
            color: #fff;
        }
        .dialog-actions button[type="submit"]:disabled {
            background: #9dc7f5;
            border-color: #9dc7f5;
            cursor: default;
        }
        .text-editor-overlay {
            position: absolute;
            border: 1px solid #007bff;
            border-radius: 4px;
            padding: 2px 4px;
            font-family: inherit;
            box-shadow: 0 0 0 1px rgba(0,123,255,0.2);
            outline: none;
            z-index: 10;
            line-height: 1.2;
            overflow: hidden;
            resize: none;
        }

        .toolbar>* {
            zoom: 0.6;
        }
    </style>
</head>
<body>
<div class="toolbar">
    <button data-tool="pen" class="active" title="Pen (P)">Pen</button>
    <button data-tool="text" title="Text (T)">Text</button>

    <div class="divider"></div>

    <button data-tool="rect" title="Rectangle (R)">Rect</button>
    <button data-tool="circle" title="Circle (C)">Circle</button>
    <button data-tool="arrow" title="Arrow (A)">Arrow</button>
    <button data-tool="line" title="Line (L)">Line</button>

    <div class="divider"></div>

    <button id="insert-image" title="Insert image (I) or paste one with Ctrl+V">Image</button>
    <input type="file" id="image-file-input" accept="image/*" style="display:none" />

    <div class="divider"></div>

    <button data-tool="eraser" title="Eraser (E)">Eraser</button>
    <button data-tool="select" title="Select / Move (V) — Ctrl+click to add, Ctrl+A to select all, Ctrl+C to copy as an image, Ctrl+D to duplicate">Select / Move</button>
    <button data-tool="hand" title="Hand / Pan (H)">Hand / Pan</button>

    <div class="divider"></div>

    <span class="group-label">History:</span>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">Redo</button>

    <div class="divider"></div>

    <div class="menu" id="save-menu">
        <button id="save-menu-button" aria-haspopup="true" aria-expanded="false"
                title="Export, import and local saves">Save/Import ▾</button>
        <div class="menu-panel" id="save-menu-panel" role="menu" hidden>
            <button type="button" role="menuitem" id="save-image">Save Image…</button>
            <button type="button" role="menuitem" id="export-json">Export JSON</button>
            <button type="button" role="menuitem" id="import-json">Import JSON</button>
            <div class="menu-separator"></div>
            <div class="menu-heading">Local saves</div>
            <button type="button" role="menuitem" id="save-local">Save now…</button>
            <div class="submenu" id="autosaves-menu" hidden>
                <button type="button" role="menuitem" id="autosaves-button"
                        aria-haspopup="true" aria-expanded="false">Autosaves ▸</button>
                <div class="submenu-panel menu-saves" id="autosaves-list" role="menu" hidden></div>
            </div>
            <div class="menu-saves" id="local-saves-list"></div>
        </div>
    </div>
    <input type="file" id="json-file-input" accept="application/json,.json" style="display:none" />

    <div class="spacer"></div>

    <button id="update-app" title="A new version is ready — reload to use it">Update</button>
    <button id="install-app" title="Install this app on your device">Install</button>
    <button id="clear">Clear</button>
</div>

<canvas id="canvas" class="drawing-pad pen-mode"></canvas>

<aside class="settings-panel" id="settings-panel" aria-labelledby="settings-panel-title" hidden>
    <h2 class="settings-panel-title" id="settings-panel-title">Settings</h2>

    <div id="color-container" class="inline-group">
        <label class="group-label" for="pen-color">Color:</label>
        <input type="color" id="pen-color" value="#000000" />
    </div>

    <div id="fill-container" class="inline-group">
        <label class="group-label" for="fill-enabled">
            <input type="checkbox" id="fill-enabled" /> Fill:
        </label>
        <input type="color" id="fill-color" value="#ffff00" disabled />
    </div>

    <div id="pen-size-container" class="inline-group">
        <label class="group-label" for="pen-size">Size:</label>
        <input type="range" id="pen-size" min="1" max="20" value="2" />
        <input type="number" id="pen-size-value" min="1" step="1" value="2" aria-label="Size value" />
    </div>

    <div id="text-size-container" class="inline-group">
        <label class="group-label" for="text-size">Text size:</label>
        <input type="range" id="text-size" min="1" max="72" value="20" />
        <input type="number" id="text-size-value" min="1" step="1" value="20" aria-label="Text size value" />
    </div>

    <div id="layer-container" class="inline-group">
        <span class="group-label">Order:</span>
        <button id="send-to-back" title="Send the selection behind everything">Send to Back</button>
        <button id="bring-to-front" title="Bring the selection in front of everything">Bring to Front</button>
    </div>

    <div id="crop-container" class="inline-group">
        <span class="group-label">Image:</span>
        <button id="crop-image" title="Crop the selected image (or double-click it); drag over the image to draw a crop box">Crop</button>
        <button id="crop-apply" title="Apply crop (Enter)">Apply</button>
        <button id="crop-reset" title="Restore the whole image">Reset</button>
        <button id="crop-cancel" title="Cancel crop (Esc)">Cancel</button>
    </div>
</aside>

<div class="dialog-backdrop" id="save-image-backdrop" hidden>
    <form class="dialog" id="save-image-dialog" role="dialog" aria-modal="true"
          aria-labelledby="save-image-title">
        <h2 id="save-image-title">Save Image</h2>

        <div class="dialog-row">
            <label for="save-image-name">File name</label>
            <input type="text" id="save-image-name" value="drawing" autocomplete="off" />
        </div>

        <div class="dialog-row">
            <label for="save-image-format">Format</label>
            <select id="save-image-format">
                <option value="png">PNG</option>
                <option value="jpeg">JPEG</option>
                <option value="webp">WebP</option>
            </select>
        </div>

        <div class="dialog-row">
            <label for="save-image-padding">Padding</label>
            <span class="dialog-inline">
                <input type="number" id="save-image-padding" min="0" max="2000" step="1" value="0" />
                px
            </span>
        </div>

        <div class="dialog-row">
            <label for="save-image-scale">Resolution</label>
            <select id="save-image-scale">
                <option value="1">1×</option>
                <option value="2" selected>2× (recommended)</option>
                <option value="3">3×</option>
                <option value="4">4×</option>
            </select>
        </div>

        <div class="dialog-row">
            <label for="save-image-bg-color">Background</label>
            <span class="dialog-inline">
                <label class="dialog-inline" for="save-image-transparent">
                    <input type="checkbox" id="save-image-transparent" checked /> Transparent
                </label>
                <input type="color" id="save-image-bg-color" value="#ffffff"
                       aria-label="Background colour" disabled />
            </span>
        </div>

        <p class="dialog-note" id="save-image-note"></p>

        <div class="dialog-actions">
            <button type="button" id="save-image-cancel">Cancel</button>
            <button type="submit" id="save-image-confirm">Save</button>
        </div>
    </form>
</div>

<script>
    // Cache loaded images so we don't recreate them every frame
    const imageCache = new Map(); // src -> { img, loaded, error }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const toolbarButtons = document.querySelectorAll(".toolbar button[data-tool]");
    const clearButton = document.getElementById("clear");
    const undoButton = document.getElementById("undo");
    const redoButton = document.getElementById("redo");
    const saveImageButton = document.getElementById("save-image");
    const saveImageBackdrop = document.getElementById("save-image-backdrop");
    const saveImageDialog = document.getElementById("save-image-dialog");
    const saveImageNameInput = document.getElementById("save-image-name");
    const saveImageFormatSelect = document.getElementById("save-image-format");
    const saveImagePaddingInput = document.getElementById("save-image-padding");
    const saveImageScaleSelect = document.getElementById("save-image-scale");
    const saveImageTransparentInput = document.getElementById("save-image-transparent");
    const saveImageBgColorInput = document.getElementById("save-image-bg-color");
    const saveImageNote = document.getElementById("save-image-note");
    const saveImageCancelButton = document.getElementById("save-image-cancel");
    const saveImageConfirmButton = document.getElementById("save-image-confirm");
    const exportJsonButton = document.getElementById("export-json");
    const importJsonButton = document.getElementById("import-json");
    const jsonFileInput = document.getElementById("json-file-input");
    const saveMenu = document.getElementById("save-menu");
    const saveMenuButton = document.getElementById("save-menu-button");
    const saveMenuPanel = document.getElementById("save-menu-panel");
    const saveLocalButton = document.getElementById("save-local");
    const localSavesList = document.getElementById("local-saves-list");
    const autosavesMenu = document.getElementById("autosaves-menu");
    const autosavesButton = document.getElementById("autosaves-button");
    const autosavesList = document.getElementById("autosaves-list");

    const insertImageButton = document.getElementById("insert-image");
    const imageFileInput = document.getElementById("image-file-input");

    const settingsPanel = document.getElementById("settings-panel");
    const colorContainer = document.getElementById("color-container");
    const penColorInput = document.getElementById("pen-color");
    const fillContainer = document.getElementById("fill-container");
    const fillEnabledInput = document.getElementById("fill-enabled");
    const fillColorInput = document.getElementById("fill-color");
    const penSizeContainer = document.getElementById("pen-size-container");
    const penSizeInput = document.getElementById("pen-size");
    const penSizeValueInput = document.getElementById("pen-size-value");
    const textSizeContainer = document.getElementById("text-size-container");
    const textSizeInput = document.getElementById("text-size");
    const textSizeValueInput = document.getElementById("text-size-value");
    const layerContainer = document.getElementById("layer-container");
    const sendToBackButton = document.getElementById("send-to-back");
    const bringToFrontButton = document.getElementById("bring-to-front");

    const cropContainer = document.getElementById("crop-container");
    const cropButton = document.getElementById("crop-image");
    const cropApplyButton = document.getElementById("crop-apply");
    const cropResetButton = document.getElementById("crop-reset");
    const cropCancelButton = document.getElementById("crop-cancel");

    const STORAGE_KEY = "drawingPad_saves_v1";
    const SAVE_DB_NAME = "drawingPadDatabase";
    const SAVE_STORE_NAME = "saves";

    // World / camera state (with zoom)
    let camera = { x: 0, y: 0, scale: 1 };
    const MIN_SCALE = 0.2;
    const MAX_SCALE = 20;

    // Shapes
    // stroke: { type: 'stroke', points: [{x,y},...], color, width, rotation }
    // text:   { type: 'text', x, y, text, fontSize, color, fillColor, rotation }
    // rect:   { type: 'rect', x, y, width, height, rotation, strokeColor, fillColor, strokeWidth }
    // circle: { type: 'circle', x, y, rx, ry, rotation, strokeColor, fillColor, strokeWidth }
    // arrow:  { type: 'arrow', x, y, length, rotation, strokeColor, strokeWidth }
    // line:   { type: 'line', x, y, length, rotation, strokeColor, strokeWidth }
    // image:  { type: 'image', x, y, width, height, rotation, src, crop? }
    //         crop is the visible part of the source image as fractions of it:
    //         { x, y, width, height } in 0..1, omitted when the whole image shows.
    let shapes = [];
    let cleanShapesSnapshot = JSON.stringify(shapes);
    let isDirty = false;

    // History (undo/redo) – shapes only
    let history = [];
    let historyIndex = -1;

    function cloneShapes(value) {
        return JSON.parse(JSON.stringify(value));
    }

    function pushHistory() {
        const snapshot = JSON.stringify(shapes);
        if (historyIndex < history.length - 1) {
            history.splice(historyIndex + 1);
        }
        history.push(snapshot);
        historyIndex = history.length - 1;
        updateDirtyState();
        updateHistoryButtons();
    }

    function updateDirtyState() {
        isDirty = JSON.stringify(shapes) !== cleanShapesSnapshot;
    }

    function markCurrentDrawingClean() {
        cleanShapesSnapshot = JSON.stringify(shapes);
        updateDirtyState();
    }

    function restoreHistory(index) {
        // The session points at a shape that is about to be replaced.
        cancelImageCrop();
        shapes = JSON.parse(history[index] || "[]");
        clearSelection();
        historyIndex = index;
        updateDirtyState();
        updateHistoryButtons();
        updateControlVisibility();
        render();
    }

    function updateHistoryButtons() {
        undoButton.disabled = historyIndex <= 0;
        redoButton.disabled = historyIndex >= history.length - 1;
    }

    // Tools and interaction state
    let currentTool = "pen";
    let isDrawing = false;
    let isPanning = false;         // used for hand tool, middle mouse, and touch pan
    let isDraggingSelection = false;
    // Set when a click landed on an already multi-selected shape: if the drag
    // turns out to be a plain click, the selection collapses to just that shape.
    let collapseSelectionTo = null;
    let isMarqueeSelecting = false;
    let marqueeStartWorld = null;
    let marqueeRect = null;          // world-space { minX, minY, maxX, maxY }
    let marqueeBaseSelection = [];   // selection the marquee started from
    let isResizing = false;
    let isRotating = false;
    let activeHandle = null; // e.g. 'tl','tr','br','bl','t','r','b','l','rot'
    let panStartScreen = null;
    let panStartCamera = { x: 0, y: 0 };

    let currentStroke = null;
    let draftShape = null;
    let drawingStartWorld = null;

    // Selection. `selectedShapes` is the whole selection; `selectedShape` is a
    // convenience mirror that is only set when exactly one shape is selected,
    // because resize/rotate handles, cropping, and layering all need a single
    // target. Never assign to either directly — go through setSelection().
    let selectedShapes = [];
    let selectedShape = null;

    function setSelection(nextSelection) {
        selectedShapes = nextSelection;
        selectedShape = selectedShapes.length === 1 ? selectedShapes[0] : null;
    }

    function clearSelection() {
        setSelection([]);
    }

    function isShapeSelected(shape) {
        return selectedShapes.includes(shape);
    }

    function deselectShape(shape) {
        if (!isShapeSelected(shape)) return;
        setSelection(selectedShapes.filter(s => s !== shape));
    }

    function toggleShapeSelected(shape) {
        if (isShapeSelected(shape)) deselectShape(shape);
        else setSelection([...selectedShapes, shape]);
    }

    // Shapes in the selection that carry a given property, so the settings can
    // edit a mixed selection without touching shapes the control cannot affect.
    function selectedShapesWith(predicate) {
        return selectedShapes.filter(predicate);
    }

    // Ctrl/Cmd+A. Selecting only makes sense with the Select tool, so switch to
    // it rather than leaving a selection the current tool cannot act on.
    function selectAllShapes() {
        commitCurrentTextEditor();
        applyImageCrop();
        setSelection([...shapes]);
        switchToSelectTool();
        updateControlVisibility();
        render();
    }

    // How far a duplicate lands from its original, in screen pixels, so the
    // copy is offset by the same visible amount at any zoom level.
    const DUPLICATE_OFFSET_SCREEN = 12;

    // Ctrl/Cmd+D. The copies go on top of the stack and become the selection,
    // so a duplicate can be dragged straight into place.
    function duplicateSelectedShapes() {
        if (!selectedShapes.length) return;
        commitCurrentTextEditor();
        applyImageCrop();

        // Walk `shapes` rather than the selection so the copies keep the draw
        // order of their originals instead of the order they were clicked in.
        const originals = shapes.filter(isShapeSelected);
        if (!originals.length) return;

        const offset = DUPLICATE_OFFSET_SCREEN / (camera.scale || 1);
        const copies = cloneShapes(originals);
        for (const copy of copies) {
            if (copy.type === "stroke") {
                for (const point of copy.points) {
                    point.x += offset;
                    point.y += offset;
                }
            } else {
                copy.x += offset;
                copy.y += offset;
            }
        }

        shapes.push(...copies);
        setSelection(copies);
        switchToSelectTool();
        pushHistory();
        updateControlVisibility();
        render();
    }

    // Image cropping. While a session is active the shape itself is untouched;
    // `rect` is the pending crop window and only Apply writes it back.
    // { shape, origin: {x,y,rotation}, full, rect, initialRect }
    // `full`/`rect`/`initialRect` are { left, top, right, bottom } boxes in the
    // shape's local (rotated, world-scaled) space, centred on `origin`.
    let cropSession = null;
    let cropDragHandle = null;   // 'tl','t','tr','r','br','b','bl','l','move','draw'
    let cropDragStartLocal = null;
    let cropDragStartRect = null;
    let cropDrawActivated = false;
    let cropDrawClickApplies = false;

    let dragStartWorld = null;
    let originalShapeData = null;
    let originalBounds = null; // for resize: { x, y, width, height, radius, rotation }
    let rotationCenter = null;
    let rotationStartAngle = 0;
    let shapeStartRotation = 0;

    // Pinch state
    let pinchStartDistance = 0;
    let pinchStartScale = 1;
    let pinchCenterWorld = null;
    let isPinching = false;

    let eraseChanged = false;
    let moveChanged = false;
    let resizeChanged = false;
    let rotateChanged = false;

    // Pen / text settings
    let penColor = "#000000";
    let penWidth = 2;
    let textSize = 20;
    let fillEnabled = false;
    let fillColor = "#ffff00";
    const ERASER_RADIUS = 10;   // screen px
    const HIT_TEST_RADIUS = 8;  // screen px

    // Text editing overlay state
    let currentTextEditor = null; // { input, shape, originalText }

    function destroyTextEditor() {
        if (!currentTextEditor) return;
        const { input } = currentTextEditor;
        if (input && input.parentNode) {
            input.parentNode.removeChild(input);
        }
        currentTextEditor = null;
    }

    function commitCurrentTextEditor() {
        currentTextEditor?.commit();
    }

    function positionTextEditor(shape, input) {
        const rect = getCanvasRect();
        const scale = camera.scale || 1;
        const fontSizeScreen = shape.fontSize * scale;
        const metrics = measureTextBlock(input.value, fontSizeScreen);

        const rotation = shape.rotation || 0;
        const halfWidthWorld = metrics.width / (2 * scale);
        const halfHeightWorld = metrics.height / (2 * scale);
        const centerX = shape.x + halfWidthWorld;
        const centerY = shape.y + halfHeightWorld;
        const cosR = Math.cos(rotation);
        const sinR = Math.sin(rotation);
        const topLeftX = centerX - halfWidthWorld * cosR + halfHeightWorld * sinR;
        const topLeftY = centerY - halfWidthWorld * sinR - halfHeightWorld * cosR;
        const sx = (topLeftX - camera.x) * scale + rect.left;
        const sy = (topLeftY - camera.y) * scale + rect.top;

        input.style.left = `${sx}px`;
        input.style.top = `${sy}px`;
        input.style.fontSize = `${fontSizeScreen}px`;
        input.style.color = shape.color || "#000000";
        input.style.backgroundColor = shape.fillColor || "transparent";
        input.style.transformOrigin = "top left";
        input.style.transform = `rotate(${rotation}rad)`;
        input.style.width = `${Math.max(60, metrics.width + 12)}px`;
        input.style.height = `${Math.max(fontSizeScreen * 1.2 + 8, metrics.height + 8)}px`;
    }

    function measureTextBlock(text, fontSize) {
        const lines = String(text ?? "").split(/\r?\n/);
        const lineHeight = fontSize * 1.2;
        ctx.save();
        ctx.font = `${fontSize}px sans-serif`;
        const width = lines.reduce((maxWidth, line) =>
            Math.max(maxWidth, ctx.measureText(line || " ").width), 0);
        ctx.restore();
        return { lines, lineHeight, width, height: lines.length * lineHeight };
    }

    function showTextEditor(shape, isNew = false) {
        commitCurrentTextEditor();

        const input = document.createElement("textarea");
        input.className = "text-editor-overlay";
        input.value = shape.text || "";

        document.body.appendChild(input);
        const editorState = { input, shape, originalText: shape.text, isNew, commit: null };
        currentTextEditor = editorState;

        positionTextEditor(shape, input);
        // The text is not transformable while its textarea owns interaction.
        // Re-render now so its rotation handle disappears immediately.
        render();

        const commitAndClose = (push = true) => {
            if (currentTextEditor !== editorState) return;
            const newText = input.value || "";
            if (isNew && newText.trim() === "") {
                const shapeIndex = shapes.indexOf(shape);
                if (shapeIndex !== -1) shapes.splice(shapeIndex, 1);
                deselectShape(shape);
            } else {
                shape.text = newText;
            }
            const changed = isNew
                ? newText.trim() !== ""
                : newText !== editorState.originalText;
            if (push && changed) {
                pushHistory();
            }
            destroyTextEditor();
            updateControlVisibility();
            render();
        };
        editorState.commit = () => commitAndClose(true);

        input.addEventListener("blur", () => commitAndClose(true));
        input.addEventListener("input", () => positionTextEditor(shape, input));
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                commitAndClose(true);
            } else if (e.key === "Escape") {
                e.preventDefault();
                if (isNew) {
                    const shapeIndex = shapes.indexOf(shape);
                    if (shapeIndex !== -1) shapes.splice(shapeIndex, 1);
                    deselectShape(shape);
                }
                destroyTextEditor();
                updateControlVisibility();
                render();
            }
        });

        // Wait until the canvas click that created the editor has finished.
        // Otherwise that same mousedown can immediately blur and remove it.
        requestAnimationFrame(() => {
            if (currentTextEditor === editorState && input.isConnected) {
                input.focus({ preventScroll: true });
                input.select();
            }
        });
    }

    // Apply camera transform, shape position, and rotation, then invoke a callback
    // that draws in the shape's local coordinate system (0,0 at center, units in world units).
    function drawTransformedShape(shape, scale, drawLocalCallback, viewCamera = camera) {
        const s = scale || 1;
        const sx = (shape.x - viewCamera.x) * s;
        const sy = (shape.y - viewCamera.y) * s;
        const rot = shape.rotation || 0;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(rot);
        ctx.scale(s, s);
        drawLocalCallback();
        ctx.restore();
    }

    // Rendering
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const preview = activeSavePreview;
        const sceneShapes = preview ? preview.save.shapes || [] : shapes;
        const sceneCamera = preview
            ? getFitCameraForShapes(sceneShapes, 64) || preview.save.camera || camera
            : camera;
        const scale = sceneCamera.scale || 1;

        for (const s of sceneShapes) {
            // The image being cropped is drawn by the crop overlay instead, so
            // the dimmed area outside the crop window reads consistently.
            if (!preview && cropSession && s === cropSession.shape) continue;

            if (s.type === "stroke") {
                drawStroke(s, scale, sceneCamera);
            } else if (s.type === "text") {
                drawTextShape(s, scale, sceneCamera);
            } else if (s.type === "rect") {
                drawRectShape(s, scale, sceneCamera);
            } else if (s.type === "circle") {
                drawCircleShape(s, scale, sceneCamera);
            } else if (isSegmentShape(s)) {
                drawSegmentShape(s, scale, sceneCamera);
            } else if (s.type === "image") {
                drawImageShape(s, scale, sceneCamera);
            }
        }

        if (preview) {
            drawSavePreviewLabel(preview.name);
            return;
        }

        if (cropSession) {
            drawCropOverlay();
        } else if (selectedShapes.length) {
            // Transform handles belong to a single shape, so a multi-selection
            // gets plain outlines plus one box around the whole group.
            const isSingleSelection = selectedShapes.length === 1 && !isMarqueeSelecting;
            const isEditingSelectedText = !!currentTextEditor &&
                currentTextEditor.shape === selectedShape;
            const withHandles = isSingleSelection && !isEditingSelectedText;
            for (const s of selectedShapes) drawSelectionOutline(s, scale, withHandles);
            if (!isSingleSelection) drawMultiSelectionBounds(scale);
        }

        if (isMarqueeSelecting) drawMarquee(scale);
    }

    function truncateCanvasText(text, maxWidth) {
        if (ctx.measureText(text).width <= maxWidth) return text;
        let low = 0;
        let high = text.length;
        while (low < high) {
            const middle = Math.ceil((low + high) / 2);
            if (ctx.measureText(`${text.slice(0, middle)}…`).width <= maxWidth) low = middle;
            else high = middle - 1;
        }
        return `${text.slice(0, low)}…`;
    }

    function drawSavePreviewLabel(name) {
        const availableWidth = Math.max(40, Math.min(520, canvas.width - 56));
        const instruction = "Click to load • move away to return";

        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "600 14px system-ui, sans-serif";
        const title = truncateCanvasText(`Previewing: ${name}`, availableWidth);
        const titleWidth = ctx.measureText(title).width;
        ctx.font = "12px system-ui, sans-serif";
        const hint = truncateCanvasText(instruction, availableWidth);
        const hintWidth = ctx.measureText(hint).width;

        const boxWidth = Math.min(canvas.width - 24, Math.max(180, titleWidth, hintWidth) + 24);
        const boxHeight = 50;
        const x = canvas.width / 2;
        const y = Math.max(boxHeight / 2 + 8, canvas.height - boxHeight / 2 - 12);

        ctx.fillStyle = "rgba(20, 28, 38, 0.88)";
        ctx.fillRect(x - boxWidth / 2, y - boxHeight / 2, boxWidth, boxHeight);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x - boxWidth / 2 + 0.5, y - boxHeight / 2 + 0.5,
            boxWidth - 1, boxHeight - 1);

        ctx.fillStyle = "#ffffff";
        ctx.font = "600 14px system-ui, sans-serif";
        ctx.fillText(title, x, y - 9);
        ctx.fillStyle = "#d9e7f7";
        ctx.font = "12px system-ui, sans-serif";
        ctx.fillText(hint, x, y + 11);
        ctx.restore();
    }

    function drawMultiSelectionBounds(scale) {
        const extent = getShapesWorldExtent(selectedShapes);
        if (!extent) return;
        const pad = 6;
        ctx.save();
        ctx.setLineDash([2, 4]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#007bff";
        ctx.strokeRect(
            (extent.minX - camera.x) * scale - pad,
            (extent.minY - camera.y) * scale - pad,
            (extent.maxX - extent.minX) * scale + pad * 2,
            (extent.maxY - extent.minY) * scale + pad * 2,
        );
        ctx.restore();
    }

    // Helpers to draw shapes
    function drawStroke(stroke, scale, viewCamera = camera) {
        const { points, color, width } = stroke;
        const bounds = getShapeBounds(stroke);
        if (!bounds || !points.length) return;

        ctx.save();
        ctx.translate(
            (bounds.x - viewCamera.x) * scale,
            (bounds.y - viewCamera.y) * scale,
        );
        ctx.rotate(stroke.rotation || 0);
        ctx.strokeStyle = color || "#000000";
        ctx.lineWidth = width * scale;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo((points[0].x - bounds.x) * scale, (points[0].y - bounds.y) * scale);
        for (let i = 1; i < points.length; i++) {
            const p = points[i];
            ctx.lineTo((p.x - bounds.x) * scale, (p.y - bounds.y) * scale);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawTextShape(shape, scale, viewCamera = camera) {
        const { x, y, text, fontSize, color, fillColor } = shape;
        ctx.font = `${fontSize * scale}px sans-serif`;
        ctx.textBaseline = "top";
        const metrics = measureTextBlock(text, fontSize * scale);

        const scaledX = (x - viewCamera.x) * scale;
        const scaledY = (y - viewCamera.y) * scale;
        const halfWidth = metrics.width / 2;
        const halfHeight = metrics.height / 2;

        ctx.save();
        ctx.translate(scaledX + halfWidth, scaledY + halfHeight);
        ctx.rotate(shape.rotation || 0);
        if (fillColor) {
            ctx.fillStyle = fillColor;
            ctx.fillRect(-halfWidth, -halfHeight, metrics.width, metrics.height);
        }
        ctx.fillStyle = color || "#000000";

        metrics.lines.forEach((line, index) => {
            ctx.fillText(line, -halfWidth, -halfHeight + index * metrics.lineHeight);
        });
        ctx.restore();
    }

    function drawRectShape(shape, scale, viewCamera = camera) {
        const { x, y, width, height, rotation, strokeColor, fillColor, strokeWidth } = shape;
        const halfW = (width / 2) * scale;
        const halfH = (height / 2) * scale;

        ctx.save();
        ctx.translate((x - viewCamera.x) * scale, (y - viewCamera.y) * scale);
        ctx.rotate(rotation);
        ctx.strokeStyle = strokeColor || "#000000";
        ctx.fillStyle = fillColor || "transparent";
        ctx.lineWidth = strokeWidth * scale;

        ctx.beginPath();
        ctx.moveTo(-halfW, -halfH);
        ctx.lineTo(halfW, -halfH);
        ctx.lineTo(halfW, halfH);
        ctx.lineTo(-halfW, halfH);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    function drawCircleShape(shape, scale, viewCamera = camera) {
        const { x, y, rx, ry, rotation, strokeColor, fillColor, strokeWidth } = shape;
        ctx.save();
        ctx.translate((x - viewCamera.x) * scale, (y - viewCamera.y) * scale);
        ctx.rotate(rotation);
        ctx.strokeStyle = strokeColor || "#000000";
        ctx.fillStyle = fillColor || "transparent";
        ctx.lineWidth = strokeWidth * scale;

        ctx.beginPath();
        ctx.ellipse(0, 0, rx * scale, ry * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    // Arrows and lines share one geometry — a segment centred on (x, y) with a
    // length and a rotation — and differ only in the arrowhead.
    function isSegmentShape(shape) {
        return !!shape && (shape.type === "arrow" || shape.type === "line");
    }

    function getArrowHeadLength(shape) {
        if (!shape || shape.type !== "arrow") return 0;
        const length = Math.max(0, shape.length || 0);
        const strokeWidth = Math.max(1, shape.strokeWidth || 2);
        // Keep short arrows usable while making every Size step visibly grow
        // both the shaft and the arrowhead.
        return Math.min(Math.max(6, strokeWidth * 5), length * 0.5);
    }

    function drawSegmentShape(shape, scale, viewCamera = camera) {
        const len = shape.length ?? 0;
        if (len <= 0) return;
        const strokeWidth = shape.strokeWidth || 2;
        const hasHead = shape.type === "arrow";
        const headLength = getArrowHeadLength(shape);
        const half = len / 2;
        drawTransformedShape(shape, scale, () => {
            ctx.strokeStyle = shape.strokeColor || "#000000";
            ctx.lineWidth = strokeWidth;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(-half, 0);
            ctx.lineTo(half - headLength, 0);
            ctx.stroke();

            if (!hasHead) return;

            // arrowhead at end (right side)
            ctx.beginPath();
            ctx.moveTo(half, 0);
            ctx.lineTo(half - headLength, headLength / 2);
            ctx.lineTo(half - headLength, -headLength / 2);
            ctx.closePath();
            ctx.fillStyle = shape.strokeColor || "#000000";
            ctx.fill();
        }, viewCamera);
    }

    // Smallest crop we allow, as a fraction of the source image, so the source
    // rectangle handed to drawImage can never collapse to zero.
    const MIN_CROP_FRACTION = 1e-4;
    const FULL_CROP = Object.freeze({ x: 0, y: 0, width: 1, height: 1 });

    // Clamp a stored crop into a usable window, or return null when it is
    // missing, unusable, or simply covers the whole image.
    function sanitizeCrop(crop) {
        if (!crop || typeof crop !== "object") return null;
        const number = (value, fallback) => {
            const n = Number(value);
            return Number.isFinite(n) ? n : fallback;
        };
        const limit = 1 - MIN_CROP_FRACTION;
        const x = Math.min(limit, Math.max(0, number(crop.x, 0)));
        const y = Math.min(limit, Math.max(0, number(crop.y, 0)));
        const width = Math.min(1 - x, Math.max(MIN_CROP_FRACTION, number(crop.width, 1 - x)));
        const height = Math.min(1 - y, Math.max(MIN_CROP_FRACTION, number(crop.height, 1 - y)));

        const epsilon = 1e-6;
        const coversEverything = x <= epsilon && y <= epsilon &&
            width >= 1 - epsilon && height >= 1 - epsilon;
        return coversEverything ? null : { x, y, width, height };
    }

    function getImageCrop(shape) {
        return sanitizeCrop(shape?.crop) || FULL_CROP;
    }

    function getLoadedImage(shape) {
        const cached = imageCache.get(shape.src);
        if (!cached) {
            loadImageSource(shape.src, render);
            return null;
        }
        return cached.loaded ? cached.img : null;
    }

    // Draw the part of `img` selected by a crop (fractions of the source) into
    // the destination box given in the current transform's units.
    function drawCroppedImage(img, crop, dx, dy, dw, dh) {
        const naturalWidth = img.naturalWidth || 0;
        const naturalHeight = img.naturalHeight || 0;
        if (naturalWidth <= 0 || naturalHeight <= 0) return;
        ctx.drawImage(
            img,
            crop.x * naturalWidth, crop.y * naturalHeight,
            crop.width * naturalWidth, crop.height * naturalHeight,
            dx, dy, dw, dh
        );
    }

    function drawImageShape(shape, scale, viewCamera = camera) {
        const { x, y, width, height, rotation } = shape;
        const img = getLoadedImage(shape);
        if (!img) return;

        ctx.save();
        ctx.translate((x - viewCamera.x) * scale, (y - viewCamera.y) * scale);
        ctx.rotate(rotation);

        drawCroppedImage(img, getImageCrop(shape),
            -width / 2 * scale, -height / 2 * scale, width * scale, height * scale);

        ctx.restore();
    }

    // Canvas controls use CSS-pixel measurements so they remain usable at every
    // zoom level. Touch devices get larger artwork and a 44px-diameter hit area.
    const FINE_TRANSFORM_HANDLE_METRICS = {
        resizeSize: 8,
        visibleRadius: 6,
        resizeHitRadius: 10,
        rotationHitRadius: 9,
        rotationOffset: 20,
    };
    const COARSE_TRANSFORM_HANDLE_METRICS = {
        resizeSize: 16,
        visibleRadius: 10,
        resizeHitRadius: 22,
        rotationHitRadius: 22,
        rotationOffset: 30,
    };
    const coarsePrimaryPointerQuery = typeof window.matchMedia === "function"
        ? window.matchMedia("(pointer: coarse)")
        : null;

    function getTransformHandleMetrics(preferCoarse = false) {
        return preferCoarse || coarsePrimaryPointerQuery?.matches
            ? COARSE_TRANSFORM_HANDLE_METRICS
            : FINE_TRANSFORM_HANDLE_METRICS;
    }

    function drawSelectionOutline(shape, scale, withHandles = true) {
        const handleMetrics = getTransformHandleMetrics();
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#007bff";

        if (shape.type === "stroke") {
            const bounds = getShapeBounds(shape);
            if (!bounds) {
                ctx.restore();
                return;
            }
            const w = bounds.width * scale;
            const h = bounds.height * scale;
            const pad = Math.max(4, (shape.width || 0) * scale / 2);
            ctx.save();
            ctx.translate(
                (bounds.x - camera.x) * scale,
                (bounds.y - camera.y) * scale,
            );
            ctx.rotate(shape.rotation || 0);
            ctx.strokeRect(-w / 2 - pad, -h / 2 - pad, w + pad * 2, h + pad * 2);
            if (withHandles) {
                const rotY = -h / 2 - handleMetrics.rotationOffset;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(0, -h / 2);
                ctx.lineTo(0, rotY + handleMetrics.visibleRadius);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, rotY, handleMetrics.visibleRadius, 0, Math.PI * 2);
                ctx.fillStyle = "#007bff";
                ctx.fill();
            }
            ctx.restore();
        } else if (shape.type === "text") {
            const fontSizeScreen = shape.fontSize * scale;
            const metrics = measureTextBlock(shape.text, fontSizeScreen);
            const pad = 4;
            const w = metrics.width + pad * 2;
            const h = metrics.height + pad * 2;
            const cx = (shape.x - camera.x) * scale + metrics.width / 2;
            const cy = (shape.y - camera.y) * scale + metrics.height / 2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(shape.rotation || 0);
            ctx.strokeRect(-w / 2, -h / 2, w, h);
            if (withHandles) {
                const rotY = -metrics.height / 2 - handleMetrics.rotationOffset;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(0, -metrics.height / 2);
                ctx.lineTo(0, rotY + handleMetrics.visibleRadius);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, rotY, handleMetrics.visibleRadius, 0, Math.PI * 2);
                ctx.fillStyle = "#007bff";
                ctx.fill();
            }
            ctx.restore();
        } else if (isSegmentShape(shape)) {
            const s = camera.scale || 1;
            const halfLength = (shape.length || 0) / 2 * s;
            ctx.save();
            ctx.translate((shape.x - camera.x) * s, (shape.y - camera.y) * s);
            ctx.rotate(shape.rotation || 0);
            ctx.beginPath();
            ctx.moveTo(-halfLength, 0);
            ctx.lineTo(halfLength, 0);
            ctx.stroke();
            if (withHandles) {
                ctx.setLineDash([]);
                ctx.fillStyle = "#ffffff";
                ctx.strokeStyle = "#007bff";
                [-halfLength, halfLength].forEach(endpointX => {
                    ctx.beginPath();
                    ctx.arc(endpointX, 0, handleMetrics.visibleRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                });
            }
            ctx.restore();
        } else if (shape.type === "rect" || shape.type === "image" || shape.type === "circle") {
            const s = camera.scale || 1;
            const rot = shape.rotation || 0;
            let w, h;
            if (shape.type === "circle") {
                const rx = shape.rx ?? shape.radius ?? 0;
                const ry = shape.ry ?? shape.radius ?? 0;
                w = rx * 2;
                h = ry * 2;
            } else {
                w = shape.width || 0;
                h = shape.height || 0;
            }

            const cx = (shape.x - camera.x) * s;
            const cy = (shape.y - camera.y) * s;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rot);
            ctx.strokeRect(-w / 2 * s, -h / 2 * s, w * s, h * s);

            if (!withHandles) {
                ctx.restore();
                ctx.restore();
                return;
            }

            // Draw resize handles (4 corners)
            const hs = handleMetrics.resizeSize;
            const corners = [
                { id: "tl", x: -w / 2 * s, y: -h / 2 * s },
                { id: "tr", x: w / 2 * s, y: -h / 2 * s },
                { id: "br", x: w / 2 * s, y: h / 2 * s },
                { id: "bl", x: -w / 2 * s, y: h / 2 * s },
            ];
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#007bff";
            ctx.setLineDash([]);
            corners.forEach(c => {
                ctx.beginPath();
                ctx.rect(c.x - hs / 2, c.y - hs / 2, hs, hs);
                ctx.fill();
                ctx.stroke();
            });

            // Rotation handle above top-center
            const rotOffset = handleMetrics.rotationOffset;
            const rx = 0;
            const ry = -h / 2 * s - rotOffset;
            ctx.beginPath();
            ctx.moveTo(0, -h / 2 * s);
            ctx.lineTo(rx, ry + handleMetrics.visibleRadius);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(rx, ry, handleMetrics.visibleRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#007bff";
            ctx.fill();
            ctx.restore();
        }

        ctx.restore();
    }

    // --- Image cropping ---------------------------------------------------
    // A crop session works in the image's local space: the origin is the image
    // centre as it was when cropping started and the axes follow the image's
    // own rotation. `full` is where the entire source image sits in that space
    // and `rect` is the pending crop window inside it.

    const CROP_HANDLE_SCREEN_SIZE = 9;   // drawn side length, in screen px
    const CROP_HANDLE_HIT_RADIUS = 12;   // grab radius, in screen px
    const CROP_DRAW_THRESHOLD_SCREEN = 4;

    function getCropFrame(session) {
        return {
            x: session.origin.x,
            y: session.origin.y,
            rotation: session.origin.rotation,
        };
    }

    function cropRectsMatch(a, b) {
        const epsilon = 1e-6;
        return Math.abs(a.left - b.left) < epsilon && Math.abs(a.top - b.top) < epsilon &&
            Math.abs(a.right - b.right) < epsilon && Math.abs(a.bottom - b.bottom) < epsilon;
    }

    function beginImageCrop(shape) {
        if (!shape || shape.type !== "image") return;
        commitCurrentTextEditor();
        if (cropSession) applyImageCrop();

        const crop = getImageCrop(shape);
        const width = shape.width || 0;
        const height = shape.height || 0;
        const left = -width / 2;
        const top = -height / 2;

        // Undo the crop to find where the whole source image would sit.
        const fullWidth = width / crop.width;
        const fullHeight = height / crop.height;
        const fullLeft = left - crop.x * fullWidth;
        const fullTop = top - crop.y * fullHeight;

        const rect = { left, top, right: left + width, bottom: top + height };
        cropSession = {
            shape,
            origin: { x: shape.x, y: shape.y, rotation: shape.rotation || 0 },
            full: {
                left: fullLeft,
                top: fullTop,
                right: fullLeft + fullWidth,
                bottom: fullTop + fullHeight,
            },
            rect,
            initialRect: { ...rect },
        };

        setSelection([shape]);
        switchToSelectTool();
        updateControlVisibility();
        updateCanvasCursor();
        render();
    }

    function endCropSession() {
        cropSession = null;
        cropDragHandle = null;
        cropDragStartLocal = null;
        cropDragStartRect = null;
        cropDrawActivated = false;
        cropDrawClickApplies = false;
        updateControlVisibility();
        updateCanvasCursor();
    }

    function cancelImageCrop() {
        if (!cropSession) return;
        endCropSession();
        render();
    }

    function applyImageCrop() {
        if (!cropSession) return;
        const { shape, full, rect, initialRect } = cropSession;
        const changed = !cropRectsMatch(rect, initialRect);

        if (changed) {
            const fullWidth = full.right - full.left;
            const fullHeight = full.bottom - full.top;
            const centre = localToWorldForBounds(
                getCropFrame(cropSession),
                (rect.left + rect.right) / 2,
                (rect.top + rect.bottom) / 2
            );

            shape.x = centre.x;
            shape.y = centre.y;
            shape.width = rect.right - rect.left;
            shape.height = rect.bottom - rect.top;

            // Crop fractions are absolute against the source image, so they can
            // be recomputed from the full rect regardless of earlier crops.
            const crop = sanitizeCrop({
                x: (rect.left - full.left) / fullWidth,
                y: (rect.top - full.top) / fullHeight,
                width: shape.width / fullWidth,
                height: shape.height / fullHeight,
            });
            if (crop) shape.crop = crop;
            else delete shape.crop;
        }

        endCropSession();
        if (changed) pushHistory();
        render();
    }

    function resetImageCrop() {
        if (!cropSession) return;
        cropSession.rect = { ...cropSession.full };
        render();
    }

    function getCropHandlePositions(rect) {
        const midX = (rect.left + rect.right) / 2;
        const midY = (rect.top + rect.bottom) / 2;
        return [
            { id: "tl", x: rect.left, y: rect.top },
            { id: "t", x: midX, y: rect.top },
            { id: "tr", x: rect.right, y: rect.top },
            { id: "r", x: rect.right, y: midY },
            { id: "br", x: rect.right, y: rect.bottom },
            { id: "b", x: midX, y: rect.bottom },
            { id: "bl", x: rect.left, y: rect.bottom },
            { id: "l", x: rect.left, y: midY },
        ];
    }

    function getCropHandleAtWorld(world) {
        if (!cropSession) return null;
        const local = worldToLocalForBounds(getCropFrame(cropSession), world.x, world.y);
        const hitRadius = CROP_HANDLE_HIT_RADIUS / (camera.scale || 1);

        for (const handle of getCropHandlePositions(cropSession.rect)) {
            if (Math.hypot(local.x - handle.x, local.y - handle.y) <= hitRadius) {
                return handle.id;
            }
        }

        const { rect } = cropSession;
        const isInside = local.x >= rect.left && local.x <= rect.right &&
            local.y >= rect.top && local.y <= rect.bottom;
        return isInside ? "move" : null;
    }

    function beginCropDrag(handle, world) {
        cropDragHandle = handle;
        cropDragStartLocal = worldToLocalForBounds(getCropFrame(cropSession), world.x, world.y);
        cropDragStartRect = { ...cropSession.rect };
        cropDrawActivated = false;
        cropDrawClickApplies = false;
    }

    function pointIsInsideRect(point, rect) {
        return point.x >= rect.left && point.x <= rect.right &&
            point.y >= rect.top && point.y <= rect.bottom;
    }

    function clampPointToRect(point, rect) {
        return {
            x: Math.min(rect.right, Math.max(rect.left, point.x)),
            y: Math.min(rect.bottom, Math.max(rect.top, point.y)),
        };
    }

    // Start a fresh crop window at the pointer. We wait for a few screen pixels
    // of movement before replacing the existing window, so an ordinary click
    // never collapses it to a tiny rectangle.
    function beginCropDraw(world, clickApplies = false) {
        const local = worldToLocalForBounds(getCropFrame(cropSession), world.x, world.y);
        cropDragHandle = "draw";
        cropDragStartLocal = clampPointToRect(local, cropSession.full);
        cropDragStartRect = { ...cropSession.rect };
        cropDrawActivated = false;
        cropDrawClickApplies = clickApplies;
    }

    function cropAxisFromDrag(anchor, pointer, minimum, maximum, minSize) {
        let low = Math.min(anchor, pointer);
        let high = Math.max(anchor, pointer);

        if (high - low < minSize) {
            if (pointer < anchor) {
                low = Math.max(minimum, anchor - minSize);
                high = anchor;
            } else {
                low = anchor;
                high = Math.min(maximum, anchor + minSize);
            }

            // If the anchor is too close to that edge, grow toward the other
            // side instead while keeping the box inside the source image.
            if (high - low < minSize) {
                low = Math.max(minimum, high - minSize);
                high = Math.min(maximum, low + minSize);
            }
        }

        return { low, high };
    }

    function updateCropDrag(world) {
        if (!cropSession || !cropDragHandle) return;

        let local = worldToLocalForBounds(getCropFrame(cropSession), world.x, world.y);
        const dx = local.x - cropDragStartLocal.x;
        const dy = local.y - cropDragStartLocal.y;
        const start = cropDragStartRect;
        const full = cropSession.full;
        const minSize = Math.min(
            20 / (camera.scale || 1),
            (full.right - full.left) / 2,
            (full.bottom - full.top) / 2
        );
        const next = { ...start };

        if (cropDragHandle === "draw") {
            local = clampPointToRect(local, full);
            const drawDx = local.x - cropDragStartLocal.x;
            const drawDy = local.y - cropDragStartLocal.y;
            const threshold = CROP_DRAW_THRESHOLD_SCREEN / (camera.scale || 1);

            if (!cropDrawActivated && Math.hypot(drawDx, drawDy) < threshold) return;
            cropDrawActivated = true;

            const horizontal = cropAxisFromDrag(
                cropDragStartLocal.x, local.x, full.left, full.right, minSize
            );
            const vertical = cropAxisFromDrag(
                cropDragStartLocal.y, local.y, full.top, full.bottom, minSize
            );
            next.left = horizontal.low;
            next.right = horizontal.high;
            next.top = vertical.low;
            next.bottom = vertical.high;
        } else if (cropDragHandle === "move") {
            const width = start.right - start.left;
            const height = start.bottom - start.top;
            next.left = Math.min(full.right - width, Math.max(full.left, start.left + dx));
            next.top = Math.min(full.bottom - height, Math.max(full.top, start.top + dy));
            next.right = next.left + width;
            next.bottom = next.top + height;
        } else {
            // Handle ids name the edges they move: "tl" moves top and left, and
            // so on. Each edge stops at the source image and at the minimum size.
            if (cropDragHandle.includes("l")) {
                next.left = Math.min(start.right - minSize, Math.max(full.left, start.left + dx));
            }
            if (cropDragHandle.includes("r")) {
                next.right = Math.max(start.left + minSize, Math.min(full.right, start.right + dx));
            }
            if (cropDragHandle.includes("t")) {
                next.top = Math.min(start.bottom - minSize, Math.max(full.top, start.top + dy));
            }
            if (cropDragHandle.includes("b")) {
                next.bottom = Math.max(start.top + minSize, Math.min(full.bottom, start.bottom + dy));
            }
        }

        cropSession.rect = next;
        render();
    }

    function drawCropOverlay() {
        const session = cropSession;
        const { shape, full, rect } = session;
        const scale = camera.scale || 1;
        const img = getLoadedImage(shape);

        ctx.save();
        ctx.translate((session.origin.x - camera.x) * scale, (session.origin.y - camera.y) * scale);
        ctx.rotate(session.origin.rotation);
        ctx.scale(scale, scale); // draw in local units from here on

        const fullWidth = full.right - full.left;
        const fullHeight = full.bottom - full.top;
        const rectWidth = rect.right - rect.left;
        const rectHeight = rect.bottom - rect.top;

        if (img) {
            // Whole source image dimmed, then the crop window at full strength.
            ctx.globalAlpha = 0.3;
            drawCroppedImage(img, FULL_CROP, full.left, full.top, fullWidth, fullHeight);
            ctx.globalAlpha = 1;
            drawCroppedImage(img, {
                x: (rect.left - full.left) / fullWidth,
                y: (rect.top - full.top) / fullHeight,
                width: rectWidth / fullWidth,
                height: rectHeight / fullHeight,
            }, rect.left, rect.top, rectWidth, rectHeight);
        }

        const pixel = 1 / scale; // one screen pixel, in local units
        ctx.strokeStyle = "#007bff";
        ctx.lineWidth = pixel;
        ctx.setLineDash([4 * pixel, 4 * pixel]);
        ctx.strokeRect(full.left, full.top, fullWidth, fullHeight);

        ctx.setLineDash([]);
        ctx.lineWidth = 2 * pixel;
        ctx.strokeRect(rect.left, rect.top, rectWidth, rectHeight);

        // Rule-of-thirds guides inside the crop window
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = pixel;
        ctx.beginPath();
        for (let i = 1; i <= 2; i++) {
            const guideX = rect.left + rectWidth * (i / 3);
            const guideY = rect.top + rectHeight * (i / 3);
            ctx.moveTo(guideX, rect.top);
            ctx.lineTo(guideX, rect.bottom);
            ctx.moveTo(rect.left, guideY);
            ctx.lineTo(rect.right, guideY);
        }
        ctx.stroke();

        const handleSize = CROP_HANDLE_SCREEN_SIZE / scale;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#007bff";
        ctx.lineWidth = pixel;
        getCropHandlePositions(rect).forEach(handle => {
            ctx.beginPath();
            ctx.rect(handle.x - handleSize / 2, handle.y - handleSize / 2, handleSize, handleSize);
            ctx.fill();
            ctx.stroke();
        });

        ctx.restore();
    }

    // Local saves
    let saves = {};
    let currentSaveName = "Drawing 1";
    let saveSuccessTimeout = null;
    let saveOperationQueue = Promise.resolve();
    let saveDatabasePromise = null;
    const SAVE_PREVIEW_DELAY_MS = 200;
    let pendingSavePreview = null; // { name, item, timer }
    let activeSavePreview = null;  // { name, item, save, textEditorVisibility? }
    // Declared here because the first refreshSavesMenu() below can already close
    // the Autosaves submenu, long before its handlers are wired up.
    let autosavesMenuPinned = false;
    refreshSavesMenu();
    const savesReady = initializeSaveStorage();

    // Resize canvas
    function resizeCanvas() {
        const toolbarHeight = document.querySelector(".toolbar").offsetHeight;
        document.documentElement.style.setProperty("--toolbar-height", `${toolbarHeight}px`);
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - toolbarHeight;
        render();
        if (currentTextEditor) {
            positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
        }
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // UI: visibility helpers
    function updatePenSizeVisibility() {
        const isSizedDrawingTool = currentTool === "pen" || currentTool === "rect" ||
            currentTool === "circle" || currentTool === "arrow" || currentTool === "line";
        // A mixed selection follows the first shape the control can affect.
        const sized = selectedShapesWith(s => getShapeWidthProperty(s));
        if (currentTool === "select" && sized.length) {
            penWidth = sized[0][getShapeWidthProperty(sized[0])];
            penSizeInput.value = Math.min(20, Math.max(1, penWidth)).toString();
            penSizeValueInput.value = penWidth.toString();
        }
        penSizeContainer.style.display =
            isSizedDrawingTool || sized.length ? "inline-flex" : "none";
    }

    function updateTextSizeVisibility() {
        const texts = selectedShapesWith(s => s.type === "text");
        if (currentTool === "select" && texts.length) {
            textSize = texts[0].fontSize;
            textSizeInput.value = Math.min(72, Math.max(1, textSize)).toString();
            textSizeValueInput.value = textSize.toString();
        }
        textSizeContainer.style.display =
            currentTool === "text" || texts.length ? "inline-flex" : "none";
    }

    function updateColorVisibility() {
        const isColorDrawingTool = currentTool === "pen" || currentTool === "text" ||
            currentTool === "rect" || currentTool === "circle" ||
            currentTool === "arrow" || currentTool === "line";
        const hasColorableSelection = selectedShapes.some(s => getShapeColorProperty(s));
        colorContainer.style.display =
            isColorDrawingTool || hasColorableSelection ? "inline-flex" : "none";
    }

    function isFillableShape(shape) {
        return shape && (shape.type === "rect" || shape.type === "circle" || shape.type === "text");
    }

    function updateFillVisibility() {
        const isFillDrawingTool = currentTool === "rect" || currentTool === "circle" || currentTool === "text";
        const fillable = selectedShapesWith(isFillableShape);
        if (currentTool === "select" && fillable.length) {
            fillEnabled = !!fillable[0].fillColor;
            fillEnabledInput.checked = fillEnabled;
            if (fillable[0].fillColor) {
                fillColor = fillable[0].fillColor;
                fillColorInput.value = fillColor;
            }
        }
        fillContainer.style.display = isFillDrawingTool || fillable.length
            ? "inline-flex"
            : "none";
        fillColorInput.disabled = !fillEnabledInput.checked;
        const hideUncheckedTextFill = currentTool === "text" && !fillEnabledInput.checked;
        fillColorInput.style.display = hideUncheckedTextFill ? "none" : "inline-block";
    }

    function updateLayerVisibility() {
        const indices = selectedShapes
            .map(s => shapes.indexOf(s))
            .filter(index => index !== -1)
            .sort((a, b) => a - b);
        layerContainer.style.display = indices.length === 0 ? "none" : "inline-flex";
        // Already at the far end of the stack means there is nothing to do.
        const atBack = indices.every((index, offset) => index === offset);
        const atFront = indices.every((index, offset) =>
            index === shapes.length - indices.length + offset);
        sendToBackButton.disabled = indices.length === 0 || atBack;
        bringToFrontButton.disabled = indices.length === 0 || atFront;
    }

    function updateCropVisibility() {
        const isCropping = !!cropSession;
        const hasImageSelected = !!selectedShape && selectedShape.type === "image";
        const showCropControls = isCropping || hasImageSelected;
        cropContainer.style.display = showCropControls ? "inline-flex" : "none";
        cropButton.style.display = isCropping ? "none" : "inline-block";
        [cropApplyButton, cropResetButton, cropCancelButton].forEach(button => {
            button.style.display = isCropping ? "inline-block" : "none";
        });
    }

    function updateSettingsPanelVisibility() {
        const settingGroups = [
            colorContainer,
            fillContainer,
            penSizeContainer,
            textSizeContainer,
            layerContainer,
            cropContainer,
        ];
        settingsPanel.hidden = !settingGroups.some(group => group.style.display !== "none");
        const toolbarHeight = document.querySelector(".toolbar").offsetHeight;
        document.documentElement.style.setProperty("--toolbar-height", `${toolbarHeight}px`);
    }

    function updateControlVisibility() {
        updatePenSizeVisibility();
        updateTextSizeVisibility();
        updateColorVisibility();
        updateFillVisibility();
        updateLayerVisibility();
        updateCropVisibility();
        updateSettingsPanelVisibility();
    }

    function isTransformableShape(shape) {
        return shape && (shape.type === "stroke" || shape.type === "text" || shape.type === "rect" || shape.type === "circle" ||
            isSegmentShape(shape) || shape.type === "image");
    }

    const toolCursorClasses = {
        pen: "pen-mode",
        text: "text-mode",
        rect: "rectangle-mode",
        circle: "circle-mode",
        arrow: "arrow-mode",
        line: "line-mode",
        eraser: "eraser-mode",
    };

    function updateCanvasCursor() {
        Object.values(toolCursorClasses).forEach(className => canvas.classList.remove(className));
        const cursorClass = toolCursorClasses[currentTool];
        if (cursorClass) canvas.classList.add(cursorClass);

        if (cropSession) {
            canvas.style.cursor = "crosshair";
        } else if (isPanning) {
            canvas.style.cursor = "grabbing";
        } else if (currentTool === "hand") {
            canvas.style.cursor = "grab";
        } else if (currentTool === "select") {
            canvas.style.cursor = "default";
        } else {
            canvas.style.cursor = "";
        }
    }

    // Tool switching
    toolbarButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
            applyImageCrop();
            currentTool = btn.dataset.tool;
            toolbarButtons.forEach(b => b.classList.toggle("active", b === btn));

            updateCanvasCursor();
            updateControlVisibility();
        });
    });

    // Pen / text UI handlers — also update selected shape if present
    function getShapeColorProperty(shape) {
        if (!shape) return null;
        if (shape.type === "stroke" || shape.type === "text") return "color";
        if (shape.type === "rect" || shape.type === "circle" || isSegmentShape(shape)) {
            return "strokeColor";
        }
        return null;
    }

    function getShapeWidthProperty(shape) {
        if (!shape) return null;
        if (shape.type === "stroke") return "width";
        if (shape.type === "rect" || shape.type === "circle" || isSegmentShape(shape)) {
            return "strokeWidth";
        }
        return null;
    }

    penColorInput.addEventListener("input", () => {
        penColor = penColorInput.value || "#000000";

        const colorable = selectedShapesWith(s => getShapeColorProperty(s));
        if (colorable.length) {
            colorable.forEach(s => { s[getShapeColorProperty(s)] = penColor; });
            render();
        }
    });

    penColorInput.addEventListener("change", () => {
        if (selectedShapes.some(s => getShapeColorProperty(s))) {
            pushHistory();
        }
    });

    fillEnabledInput.addEventListener("change", () => {
        fillEnabled = fillEnabledInput.checked;
        fillColorInput.disabled = !fillEnabled;
        const fillable = selectedShapesWith(isFillableShape);
        if (fillable.length) {
            fillable.forEach(s => { s.fillColor = fillEnabled ? fillColor : null; });
            if (currentTextEditor && fillable.includes(currentTextEditor.shape)) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
            pushHistory();
            render();
        }
        updateFillVisibility();
    });

    fillColorInput.addEventListener("input", () => {
        fillColor = fillColorInput.value || "#ffff00";
        const fillable = fillEnabled ? selectedShapesWith(isFillableShape) : [];
        if (fillable.length) {
            fillable.forEach(s => { s.fillColor = fillColor; });
            if (currentTextEditor && fillable.includes(currentTextEditor.shape)) {
                positionTextEditor(currentTextEditor.shape, currentTextEditor.input);
            }
            render();
        }
    });

    fillColorInput.addEventListener("change", () => {
        if (fillEnabled && selectedShapes.some(isFillableShape)) pushHistory();
    });

    function applyPenSize(value) {
        if (!Number.isFinite(value) || value < 1) return false;
        penWidth = value;
        const sized = selectedShapesWith(s => getShapeWidthProperty(s));
        if (sized.length) {
            sized.forEach(s => { s[getShapeWidthProperty(s)] = penWidth; });
            render();
        }
        return true;
    }

    penSizeInput.addEventListener("input", () => {
        const value = Number(penSizeInput.value);
        if (applyPenSize(value)) penSizeValueInput.value = value.toString();
    });

    penSizeInput.addEventListener("change", () => {
        if (selectedShapes.some(s => getShapeWidthProperty(s))) {
